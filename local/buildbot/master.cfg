# local buildbot master -- everything derived from ppg-testing descriptors.
# no generated config: this file imports tools/render directly, so adding a
# scenario.yml is enough to get a new force scheduler after a reconfig.
import os
import pathlib
import shlex
import sys

from buildbot.plugins import schedulers, steps, util, worker
from buildbot.process.results import FAILURE, WARNINGS, worst_status
from twisted.internet import defer

BASE = pathlib.Path(__file__).resolve().parent
REPO = pathlib.Path(os.environ.get("PPG_TESTING_DIR", BASE.parent.parent))
if str(REPO) not in sys.path:
    sys.path.insert(0, str(REPO))

from tools import gen_groups, render  # noqa: E402

# the versioned ppg groups are not in the repo, materialize them first
gen_groups.ensure()

SLOTS = int(os.environ.get("PPG_LOCAL_SLOTS", "4"))
WORKER_PASS = os.environ.get("PPG_WORKER_PASS", "ppg-local")
REPO_URL = os.environ.get("PPG_TESTING_REPO", "/repo")
ARTIFACTS = os.environ.get("PPG_ARTIFACTS", "/artifacts")
# set PPG_TESTING_BRANCH to test the branch you are on; it wins over the
# per-descriptor TESTING_BRANCH default
ENV_BRANCH = os.environ.get("PPG_TESTING_BRANCH")
DEFAULT_BRANCH = ENV_BRANCH or "main"

SKIP_PARAMS = ("PLATFORM", "DESTROY_ENV")

# buildbot runs at most one build per (builder, worker) pair, so max_builds on a
# single worker would serialize molecule-run. one worker process per slot
# instead; start-worker.sh spawns exactly these.
MOLECULE_WORKERS = ["molecule-%d" % i for i in range(1, SLOTS + 1)]

# same rule bites the coordinator: a group-run build sits on its worker until
# the whole fan out finishes, so a single one would serialize whole groups.
# these are in-process, cheap, and only ever wait -- no reason to ration them.
COORDINATORS = ["coordinator-%d" % i for i in range(1, 9)]

def slug(name):
    return name.replace("/", "-")


def local_oses(oses):
    """local/env.sh leaves the rhel (no subscription) and all arm image keys
    unset, so those scenarios can only fail at create. Keep them selectable
    in the forms for whoever adds images later, but never run them by default
    and never fan a sweep out to them."""
    usable = [o for o in oses
              if not o.endswith("-arm") and not o.startswith("rhel-")]
    return usable or oses


@util.renderer
def run_command(props):
    group = props.getProperty("group")
    if group not in GROUPS:
        raise ValueError("build property 'group' is %r, not one of the known "
                         "groups -- trigger via a run-<group> scheduler" % (group,))
    os_key = props.getProperty("os")
    if not os_key:
        raise ValueError("build property 'os' is empty, one os per build")
    desc = GROUPS[group]
    # buildnumber counts per virtual builder, i.e. per os -- the coordinator's
    # number is what keeps one fan out together in one artifacts dir
    run_id = props.getProperty("run_id") or props.getProperty("buildnumber")
    argv = ["python3", "tools/run.py",
            "--group", group,
            "--os", os_key,
            "--sequence", props.getProperty("sequence") or "test",
            "--artifacts-dir",
            "%s/%s/%s" % (ARTIFACTS, slug(group), run_id)]
    for p in desc.get("params", []):
        name = p["name"]
        if name in SKIP_PARAMS:
            continue
        val = props.getProperty(name)
        if val is None or val == "":
            continue
        if isinstance(val, bool):
            val = "true" if val else "false"
        argv += ["--param", "%s=%s" % (name, val)]
    return ". local/env.sh && exec " + " ".join(shlex.quote(a) for a in argv)


@util.renderer
def job_name(props):
    # goes into libvirt domain names via name_pattern {job}, keep it path-free
    return slug(props.getProperty("group") or "ppg")


@util.renderer
def build_number(props):
    # name_pattern {build}. settable as a property so a destroy can target the
    # guests another build left behind instead of its own
    return str(props.getProperty("BUILD_NUMBER")
               or props.getProperty("buildnumber"))


run_factory = util.BuildFactory([
    steps.Git(repourl=REPO_URL, branch=util.Property("TESTING_BRANCH", default=DEFAULT_BRANCH),
              mode="full", method="fresh", name="checkout"),
    steps.ShellCommand(name="molecule", command=["sh", "-ec", run_command],
                       # name_pattern feeds these into guest names: unique per
                       # build, or concurrent runs of the same (group, os)
                       # would fight over one vm
                       env={"BUILD_NUMBER": build_number,
                            "JOB_NAME": job_name},
                       # buildbot kills by default; run.py destroys the guests
                       # in its finally, so let it see the sigterm first
                       timeout=4 * 3600, sigtermTime=60, haltOnFailure=True),
])


def as_list(value):
    """Multi selects arrive as a list, hand written properties as a string."""
    if isinstance(value, str):
        return [v for v in value.replace(",", " ").split() if v]
    return list(value or [])


# a sweep spans groups with different sequence sets, so a missing sequence falls
# back to "test" -- every descriptor declares that one, and dropping the group
# silently would hide it from the sweep. destroy and cleanup are exempt: turning
# them into a full test run is the opposite of what was asked, skip instead.
NO_FALLBACK_SEQUENCES = ("destroy", "cleanup")


def resolve_sequence(desc, wanted):
    seqs = desc.get("sequences", {})
    if wanted in seqs:
        return wanted
    if wanted in NO_FALLBACK_SEQUENCES:
        return None
    return "test" if "test" in seqs else None


def testing_branch(build):
    return build.getProperty("TESTING_BRANCH") or DEFAULT_BRANCH


def trigger_entry(group, os_key, props, tags=()):
    props = dict(props, group=group, os=os_key,
                 virtual_builder_name="%s %s" % (group, os_key),
                 virtual_builder_tags=[slug(group)] + list(tags))
    return {"sched_name": "molecule-run-t",
            "props_to_set": props, "unimportant": False}


class FanOut(steps.Trigger):
    """One molecule-run build per selected OS."""

    def getSchedulersAndProperties(self):
        group = self.build.getProperty("group")
        desc = GROUPS[group]
        shared = {
            "run_id": self.build.getProperty("buildnumber"),
            "sequence": self.build.getProperty("sequence") or "test",
            "TESTING_BRANCH": testing_branch(self.build),
        }
        for p in desc.get("params", []):
            val = self.build.getProperty(p["name"])
            if val is not None:
                shared[p["name"]] = val
        return [trigger_entry(group, o, shared)
                for o in as_list(self.build.getProperty("oses"))]


# params a sweep sets once for every group it touches. run_command drops the
# ones a descriptor does not declare, so the union can be forwarded blindly;
# empty means "keep each descriptor's own default".
SWEEP_SHARED = ("VERSION", "FROM_VERSION", "REPO", "FROM_REPO", "TO_REPO")
# "ppg/psp-" is not covered by "psp/": that one only matches psp/server_tests
SWEEP_DEFAULT_PREFIXES = ("ppg/pg-", "ppg/psp-", "pg_tde/",
                          "pg_stat_monitor/", "psp/")


def sweep_result(triggered, skipped, result):
    """A sweep that ran nothing, or less than asked, must not look clean."""
    if not triggered:
        return FAILURE
    if skipped:
        return worst_status(result, WARNINGS)
    return result


class SweepFanOut(steps.Trigger):
    """One molecule-run build per (selected group, os of that group)."""

    # skips are per group and easy to miss in a 1000 build fan out, so they end
    # up in a log and in the step result, never silently dropped
    sweep_skipped = ()
    sweep_triggered = 0

    @defer.inlineCallbacks
    def run(self):
        result = yield super().run()
        if self.sweep_skipped:
            yield self.addCompleteLog("skipped",
                                      "\n".join(self.sweep_skipped) + "\n")
        if not self.sweep_triggered:
            yield self.addCompleteLog(
                "skipped-all",
                "nothing was triggered: every selected group was skipped\n")
        return sweep_result(self.sweep_triggered, self.sweep_skipped, result)

    def getSchedulersAndProperties(self):
        wanted = self.build.getProperty("sequence") or "test"
        shared = {
            # prefixed: sweep-run and group-run number their builds
            # independently, and both end up under the same group dir
            "run_id": "sweep-%s" % self.build.getProperty("buildnumber"),
            "TESTING_BRANCH": testing_branch(self.build),
        }
        for name in SWEEP_SHARED:
            val = self.build.getProperty(name)
            if val not in (None, ""):
                shared[name] = val
        # not a descriptor param: only the guest names care, see build_number
        target = self.build.getProperty("BUILD_NUMBER")
        if target not in (None, ""):
            shared["BUILD_NUMBER"] = target
        out = []
        skipped = []
        for group in as_list(self.build.getProperty("groups")):
            desc = GROUPS.get(group)
            if desc is None:
                skipped.append("%s: unknown group" % group)
                continue
            sequence = resolve_sequence(desc, wanted)
            if sequence is None:
                skipped.append("%s: declares no %r sequence"
                               % (group, wanted))
                continue
            props = dict(shared, sequence=sequence)
            for o in local_oses(render.expand_scenarios(desc)):
                out.append(trigger_entry(group, o, props, tags=["sweep"]))
        self.sweep_skipped = skipped
        self.sweep_triggered = len(out)
        return out


fanout_factory = util.BuildFactory([
    FanOut(schedulerNames=["molecule-run-t"], waitForFinish=True, name="fan out"),
])

sweep_factory = util.BuildFactory([
    SweepFanOut(schedulerNames=["molecule-run-t"], waitForFinish=True,
                name="fan out"),
])


def force_fields(group, desc):
    oses = render.expand_scenarios(desc)
    if not oses:
        raise ValueError("descriptor lists no oses")
    seqs = sorted(desc.get("sequences", {}))
    if not seqs:
        raise ValueError("descriptor declares no sequences")
    declared = {p["name"]: p for p in desc.get("params", [])}
    branch_default = ENV_BRANCH or str(
        declared.get("TESTING_BRANCH", {}).get("default", "main"))
    fields = [
        util.FixedParameter(name="group", default=group),
        util.ChoiceStringParameter(name="oses", label="OS", choices=oses,
                                   multiple=True, strict=True,
                                   default=local_oses(oses)),
        util.ChoiceStringParameter(name="sequence", label="sequence", choices=seqs,
                                   default="test" if "test" in seqs else seqs[0]),
        util.StringParameter(name="TESTING_BRANCH", label="TESTING_BRANCH",
                             default=branch_default, size=60),
    ]
    for p in desc.get("params", []):
        name = p["name"]
        if name in SKIP_PARAMS or name == "TESTING_BRANCH":
            continue
        kind = p.get("kind", "string")
        if kind == "choice" and p.get("choices"):
            fields.append(util.ChoiceStringParameter(
                name=name, label=name, choices=p["choices"],
                default=p.get("default", p["choices"][0])))
        elif kind == "boolean":
            fields.append(util.BooleanParameter(
                name=name, label=name, default=bool(p.get("default", False))))
        else:
            fields.append(util.StringParameter(
                name=name, label=name, default=str(p.get("default", "")), size=60))
    return fields


# one broken descriptor must not take the whole master down with it: build the
# form up front, skip and report the groups that fail
GROUPS = {}
FORMS = {}
for _g in render.find_all_groups():
    _rel = str(_g.relative_to(render.REPO))
    try:
        _desc = render.load_desc(_g)
        FORMS[_rel] = force_fields(_rel, _desc)
    except Exception as _exc:
        print("skipping %s: %s" % (_rel, _exc), file=sys.stderr)
        continue
    GROUPS[_rel] = _desc

if not GROUPS:
    raise RuntimeError("no usable scenario.yml groups under %s -- wrong "
                       "PPG_TESTING_DIR, or the repo is not mounted" % REPO)

SWEEP_GROUPS = sorted(GROUPS)
SWEEP_DEFAULT = [g for g in SWEEP_GROUPS if g.startswith(SWEEP_DEFAULT_PREFIXES)]
# destroy is left out on purpose: without a BUILD_NUMBER it would look for
# guests of its own build number and destroy nothing. destroy-sweep is the tool.
SWEEP_SEQUENCES = sorted({s for d in GROUPS.values()
                          for s in d.get("sequences", {})} - {"destroy"})
# empty first: "whatever each descriptor defaults to"
REPO_CHOICES = [""] + sorted({c for d in GROUPS.values()
                              for p in d.get("params", [])
                              if p["name"] == "REPO"
                              for c in p.get("choices", [])})


def sweep_fields(sequence_field, versions=True):
    fields = [
        util.ChoiceStringParameter(name="groups", label="groups",
                                   choices=SWEEP_GROUPS, multiple=True,
                                   strict=True, default=SWEEP_DEFAULT),
        sequence_field,
        util.StringParameter(name="TESTING_BRANCH", label="TESTING_BRANCH",
                             default=DEFAULT_BRANCH, size=60),
    ]
    if versions:
        fields += [
            util.StringParameter(name="VERSION", size=30, default="",
                                 label="VERSION (empty: per group default)"),
            util.StringParameter(name="FROM_VERSION", size=30, default="",
                                 label="FROM_VERSION (upgrade groups)"),
            util.ChoiceStringParameter(name="REPO", choices=REPO_CHOICES,
                                       default="",
                                       label="REPO (empty: per group default)"),
        ]
    else:
        fields.append(util.StringParameter(
            name="BUILD_NUMBER", size=30, default="", regex=r"^\d*$",
            label="BUILD_NUMBER of the guests to remove (empty: this build)"))
    return fields


c = BuildmasterConfig = {
    "buildbotNetUsageData": None,
    "title": "ppg local",
    "titleURL": "https://github.com/Percona-QA/ppg-testing",
    "buildbotURL": os.environ.get("PPG_BUILDBOT_URL", "http://localhost:8010/"),
    "www": {"port": 8010, "plugins": {"waterfall_view": {}, "grid_view": {}}},
    "db": {"db_url": "sqlite:///state.sqlite"},
    "protocols": {"pb": {"port": 9989}},
    "collapseRequests": False,
    "workers": [
        worker.Worker(name, WORKER_PASS, max_builds=1)
        for name in MOLECULE_WORKERS
    ] + [
        worker.LocalWorker(name) for name in COORDINATORS
    ],
    "builders": [
        util.BuilderConfig(name="molecule-run", workernames=MOLECULE_WORKERS,
                           factory=run_factory, collapseRequests=False,
                           description="one (group, os) run of tools/run.py"),
        util.BuilderConfig(name="group-run", workernames=COORDINATORS,
                           factory=fanout_factory, collapseRequests=False,
                           description="fans a group out over its selected oses"),
        util.BuilderConfig(name="sweep-run", workernames=COORDINATORS,
                           factory=sweep_factory, collapseRequests=False,
                           description="fans many groups out over all their oses"),
    ],
    "schedulers": [
        schedulers.Triggerable(name="molecule-run-t", builderNames=["molecule-run"]),
    ],
    "services": [],
}

c["schedulers"] += [
    schedulers.ForceScheduler(
        name="release-sweep",
        label="release sweep",
        buttonName="sweep",
        builderNames=["sweep-run"],
        codebases=[util.CodebaseParameter(codebase="", hide=True)],
        properties=sweep_fields(util.ChoiceStringParameter(
            name="sequence", label="sequence", choices=SWEEP_SEQUENCES,
            default="test" if "test" in SWEEP_SEQUENCES else SWEEP_SEQUENCES[0]))),
    schedulers.ForceScheduler(
        name="destroy-sweep",
        label="destroy sweep",
        buttonName="destroy",
        builderNames=["sweep-run"],
        codebases=[util.CodebaseParameter(codebase="", hide=True)],
        # fixed: a sweep that silently ran tests instead would be expensive
        properties=sweep_fields(util.FixedParameter(name="sequence",
                                                   default="destroy"),
                                versions=False)),
]

for _group in sorted(GROUPS):
    c["schedulers"].append(schedulers.ForceScheduler(
        name="run-" + slug(_group),
        label=_group,
        buttonName="run " + _group,
        builderNames=["group-run"],
        codebases=[util.CodebaseParameter(codebase="", hide=True)],
        properties=FORMS[_group]))
