os_list: all
name_pattern: pgstatmon-{token}-{build}
aws:
  size: large
  subnet: aws2
cleanup: none
verifier: ansible
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - destroy
  cleanup:
  - cleanup
overrides:
  debian-12:
    aws:
      size: xlarge
  debian-12-arm:
    aws:
      size: xlarge
  debian-13:
    aws:
      size: xlarge
  debian-13-arm:
    aws:
      size: xlarge
  rhel-10:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-10-arm:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-8:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-8-arm:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-9:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-9-arm:
    billing_tag: jenkins-pg-molecule-rhel
  ubuntu-jammy:
    aws:
      size: xlarge
  ubuntu-jammy-arm:
    aws:
      size: xlarge
  ubuntu-noble:
    aws:
      size: xlarge
  ubuntu-noble-arm:
    aws:
      size: xlarge
  ubuntu-resolute:
    aws:
      size: xlarge
  ubuntu-resolute-arm:
    aws:
      size: xlarge
params:
- name: PLATFORM
  kind: choice
  special: platform_choice
  description: For what platform (OS) need to test
  flavors:
  - single
- name: PGSM_REPO
  kind: string
  default: https://github.com/percona/pg_stat_monitor.git
  description: PGSM repo that we want to test, we could also use forked developer
    repo here.
- name: PGSM_BRANCH
  kind: string
  default: main
  default_parallel: 2.3.2
  description: PGSM repo version/branch/tag to use; e.g main, 2.0.5
- name: VERSION
  kind: string
  default: ppg-18.4
  default_parallel: pg-18.4
  description: PGDG Server PG version for test, including major and minor version,
    e.g pg-16.2, pg-15.5
- name: USE_OBS_REPO
  kind: boolean
  quote: '"'
  description: Install Percona packages from the OBS (openSUSE Build Service) repo
    instead of repo.percona.com.
- name: OBS_HOST
  kind: string
  default: ''
  description: OBS instance hostname to use when USE_OBS_REPO is enabled. Leave
    empty for the default public instance (download.opensuse.org).
- name: OBS_PROJECT
  kind: string
  default: ''
  description: Full OBS project to install from when USE_OBS_REPO is enabled, e.g.
    isv:percona:PR:pr-42:ppg:staging:18 for a pull request build. Leave empty to
    derive it from REPO and VERSION.
- name: TESTING_BRANCH
  kind: string
  default: main
  description: Branch for ppg-testing testing repository
- name: RUN_LABELS
  kind: string
  default: Manual
  description: Optional comma-separated labels to categorize this run, e.g. Manual,
    Nightly, Release.
jenkins:
  molecule_dir: pg_stat_monitor/pgsm_pgdg
  artifacts: pg_stat_monitor/pgsm_pgdg/artifacts/**/*.tar.gz
  jobs:
    single:
      job_name: ppg
      file: pgsm-pgdg
      display_name: ${env.BUILD_NUMBER}-${env.VERSION}-${env.PLATFORM}
    parallel:
      job_name: ppg-parallel
      file: pgsm-pgdg-parallel
      display_name: ${env.BUILD_NUMBER}-pgsm-${env.VERSION}
      slack:
        channel: '#postgresql-test'
        params:
        - pgsm_repo
        - pgsm_branch
        - version
        args:
        - PGSM_REPO
        - PGSM_BRANCH
        - VERSION
        fields:
        - label: PGSM_Repo
          param: pgsm_repo
        - label: PGSM_Branch
          param: pgsm_branch
        - label: Version
          param: version
