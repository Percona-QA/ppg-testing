scenarios:
  amd:
    os: rhel-9
  arm:
    os: rhel-9-arm
name_pattern: pgbouncer-rhel9-{scenario}-{build}
aws:
  size: xlarge
  subnet: aws2
cleanup: none
verifier: ansible
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - destroy
  cleanup:
  - cleanup
