scenarios:
  amd:
    os: ubuntu-noble
  arm:
    os: ubuntu-noble-arm
name_pattern: pgbouncer-u24-{scenario}-{build}
aws:
  size: xlarge
  subnet: aws2
cleanup: none
verifier: ansible
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - destroy
  cleanup:
  - cleanup
