scenarios:
  amd:
    os: rhel-9
  arm:
    os: rhel-9-arm
name_pattern: pgbadger-rhel9-{scenario}-{build}
aws:
  size: small
  subnet: aws2
cleanup: none
verifier:
  testinfra:
    directory: ../../tests/
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - verify
  - destroy
  cleanup:
  - cleanup
