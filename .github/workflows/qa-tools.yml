name: qa-tools

on:
  push:
    paths:
      - 'catalog/**'
      - 'templates/**'
      - 'tools/**'
      - 'ppg/versions.yml'
      - '**/scenario.yml'
      - 'local/buildbot/**'
  pull_request:
    paths:
      - 'catalog/**'
      - 'templates/**'
      - 'tools/**'
      - 'ppg/versions.yml'
      - '**/scenario.yml'
      - 'local/buildbot/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # optional: a token that may dispatch workflows in Percona-Lab/jenkins-pipelines.
      # job level on purpose, a step's own env is not reliable in its `if`
      JENKINS_PIPELINES_DISPATCH_TOKEN: ${{ secrets.JENKINS_PIPELINES_DISPATCH_TOKEN }}
    steps:
      - name: checkout ppg-testing
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: install deps
        run: pip install pytest jinja2 pyyaml "buildbot==4.3.0" "buildbot-worker==4.3.0"

      - name: clone jenkins-pipelines
        run: git clone --depth 1 https://github.com/Percona-Lab/jenkins-pipelines.git /tmp/jp

      - name: run unit tests
        run: python3 -m pytest tools/tests/ -v

      - name: rendered molecule.yml files match the snapshot
        run: python3 tools/migrate_check.py --snapshot

      - name: jenkins-pipelines drift check
        # advisory by design: ppg-testing lands first, the generated jenkins
        # jobs are regenerated as a follow-up. DRIFT lines here are that todo.
        continue-on-error: true
        run: python3 tools/gen_jenkins.py --check --jenkins-repo /tmp/jp

      - name: ask jenkins-pipelines to regenerate its ppg jobs
        # main only. jenkins-pipelines runs ppg-regenerate-jobs.yml on this
        # event and opens a PR there when the generated jobs changed; without
        # the token its daily schedule picks the change up instead.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.JENKINS_PIPELINES_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.JENKINS_PIPELINES_DISPATCH_TOKEN }}
        run: |
          gh api repos/Percona-Lab/jenkins-pipelines/dispatches \
            -f event_type=ppg-testing-updated \
            -f "client_payload[sha]=${GITHUB_SHA}"
