# Per-major data for the generated ppg role groups (ppg/pg-14..18*, psp-16*).
# tools/gen_groups.py renders these at runtime from templates/groups/.
#
# Each instance carries flavor (ppg/psp), major, and one section per scenario
# type (server, meta-server, meta-ha, minor-upgrade, major-upgrade). The
# 'gates' lists are the End-play/fail guards at the top of tasks/main.yml:
# action end_host/end_play/fail(+msg), distribution or family match,
# os_version, pg version literal and compare op. Everything else is small
# per-major knobs the templates branch on -- see templates/groups/.
instances:
  pg-14:
    major: 14
    flavor: ppg
    server:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      - name: End play on Debian 13
        action: end_play
        distribution: Debian
        os_version: '13'
        version: '14.19'
        op: <=
      subnet: aws2
      legacy_debian_overrides: true
    meta-server:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
    meta-ha:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      cleanup_extra_rpm:
      - etcd
      - percona-haproxy
    minor-upgrade:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      - name: End play on rocky linux 9
        action: end_play
        family: RedHat
        os_version: '9'
        version: '14.6'
        op: <=
      - name: End play on Debian 12
        action: end_play
        family: Debian
        os_version: '12'
        version: '14.8'
        op: <=
      - name: End play on Debian 13
        action: end_play
        distribution: Debian
        os_version: '13'
        version: '14.19'
        op: <=
      - name: End play on Ubuntu 24
        action: end_play
        distribution: Ubuntu
        os_version: '24'
        version: '14.11'
        op: <=
      upgrade_to_fact: false
      extra_repo_refresh: true
      telemetry_comment: extended
      plpython3_extra: false
      tde: false
      dev_switch_cutoff: '14.17'
      dev_switch_var: pg_version_to_install
      stop_pause: false
    major-upgrade:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      - name: End play on rocky linux 9
        action: end_play
        family: RedHat
        os_version: '9'
        version: '13.9'
        op: <=
      - name: End play on Debian 12
        action: end_play
        family: Debian
        os_version: '12'
        version: '13.11'
        op: <=
      - name: End play on Debian 13
        action: end_play
        distribution: Debian
        os_version: '13'
        version: '13.22'
        op: <=
      - name: End play on Ubuntu 24
        action: end_play
        distribution: Ubuntu
        os_version: '24'
        version: '13.14'
        op: <=
      enable_only: false
      commented_plpython: true
      commented_llvm: false
      remove_conflicting_dev: '13.21'
      dev_switch_cutoff: '14.17'
      legacy_tail: true
