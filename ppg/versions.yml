      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      cleanup_extra_rpm:
      - etcd
      - percona-haproxy
    minor-upgrade:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      - name: End play on rocky linux 9
        action: end_play
        family: RedHat
        os_version: '9'
        version: '14.6'
        op: <=
      - name: End play on Debian 12
        action: end_play
        family: Debian
        os_version: '12'
        version: '14.8'
        op: <=
      - name: End play on Debian 13
        action: end_play
        distribution: Debian
        os_version: '13'
        version: '14.19'
        op: <=
      - name: End play on Ubuntu 24
        action: end_play
        distribution: Ubuntu
        os_version: '24'
        version: '14.11'
        op: <=
      upgrade_to_fact: false
      extra_repo_refresh: true
      telemetry_comment: extended
      plpython3_extra: false
      tde: false
      dev_switch_cutoff: '14.17'
      dev_switch_var: pg_version_to_install
      stop_pause: false
    major-upgrade:
      gates:
      - name: End play on Ubuntu 26 and versions older than 14.23
        action: end_host
        distribution: Ubuntu
        os_version: '26'
        version: '14.23'
        op: <
      - name: End play on rocky linux 9
        action: end_play
        family: RedHat
        os_version: '9'
        version: '13.9'
        op: <=
      - name: End play on Debian 12
        action: end_play
        family: Debian
        os_version: '12'
        version: '13.11'
        op: <=
      - name: End play on Debian 13
        action: end_play
        distribution: Debian
        os_version: '13'
        version: '13.22'
        op: <=
      - name: End play on Ubuntu 24
        action: end_play
        distribution: Ubuntu
        os_version: '24'
        version: '13.14'
        op: <=
      remove_conflicting_dev: '13.21'
      dev_switch_cutoff: '14.17'
    install:
      dev_switch_cutoff: '14.17'
      plpython_extra: false
    install_tools:
      vars_gate: '14.10'
      pgpool_low_gate: '14.7'
      pgpool_switch: '14.23'
      postgis_gate: '14.8'
      gather_gate: '14.9'
      pgvector_gate: '14.15'
      cron_gate: '14.22'
      base_extensions: '[''pg_stat_monitor'', ''pgaudit'', ''set_user'']'
      legacy_layout: true
      patroni_deb_gate: '14.12'
      pgpool_start_gate: '14.7'
