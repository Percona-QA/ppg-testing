os_list: all
name_pattern: '{token}-{build}-{job}'
aws:
  size: large
  subnet: aws1
cleanup: per-family
verifier:
  testinfra:
    directory: ../../../tests/tests_ppg
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - verify
  - cleanup
  - destroy
  cleanup:
  - cleanup
overrides:
  debian-12:
    aws:
      size: small
  debian-12-arm:
    aws:
      size: small
  debian-13:
    aws:
      size: small
  debian-13-arm:
    aws:
      size: small
  rhel-10:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-10-arm:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-8:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-8-arm:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-9:
    billing_tag: jenkins-pg-molecule-rhel
  rhel-9-arm:
    billing_tag: jenkins-pg-molecule-rhel
  ubuntu-jammy:
    aws:
      size: small
  ubuntu-jammy-arm:
    aws:
      size: small
  ubuntu-noble:
    aws:
      size: small
  ubuntu-noble-arm:
    aws:
      size: small
  ubuntu-resolute:
    aws:
      size: small
  ubuntu-resolute-arm:
    aws:
      size: small
