os_list: all
name_pattern: '{token}-{build}-{job}'
aws:
  size: large
  subnet: aws2
cleanup: per-family
verifier:
  testinfra:
    directory: ../../../tests/tests_ppg_tarballs
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - verify
  - cleanup
  - destroy
  cleanup:
  - cleanup
