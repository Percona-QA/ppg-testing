---
- name: Setting facts so that they will be persisted in the fact cache
  ansible.builtin.set_fact:
    pg_version_to_install: "{{ lookup('env', 'VERSION') | replace('ppg-','') }}"


- name: Setting facts so that they will be persisted in the fact cache
  ansible.builtin.set_fact:
    server_version: "{{ lookup('env', 'VERSION') }}"
    major_version: "{{ lookup('env', 'VERSION').split('.')[0].split('-')[1] }}"
    tarball_url:  "{{ lookup('env', 'TARBALL_URL') }}"
    dest_dir: "/opt/pgdistro"
    data_dir_path: "/opt/pgdistro/data"
    user_name: 'postgres'
    database_name: 'postgres'
    server_port: 5432
    ssl_version: "{{ lookup('env', 'SSL_VERSION') }}"
    io_method: "{{ lookup('env', 'IO_METHOD') | default('worker') }}"

# OBS: with TARBALL_URL empty and OBS_PROJECT set (an OBS tarballs project,
# e.g. isv:percona:ppg:staging:18:tarballs), find the tarball in the project's
# published repository for this SSL variant (SSL_VERSION 1 -> ssl1.1, 3 -> ssl3,
# 3.5 -> ssl3.5) and this host's architecture:
#   percona-postgresql-<version>-<variant>-linux-<arch>.tar.gz
# The exact version is read from the repository listing, at its top level or
# in an <arch>/ folder. OBS_HOST is the OBS download host, as for packages.
- name: Locate the tarball in the OBS project
  when:
    - tarball_url | trim | length == 0
    - lookup('env', 'OBS_PROJECT') | trim | length > 0
  block:
    - name: Map SSL_VERSION and the OBS project to the tarball repository
      ansible.builtin.set_fact:
        obs_tarball_repo: "{{ {'1': 'ssl1.1', '1.1': 'ssl1.1', '3': 'ssl3', '3.5': 'ssl3.5'}[ssl_version | string | trim] | default('') }}"
        obs_tarball_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"
        obs_tarball_base: "{{ obs_tarball_base_url | default('https://' ~ (obs_instance_host | default(lookup('env', 'OBS_HOST') | default('download.opensuse.org', true)))) }}"

    - name: Fail on an SSL_VERSION without an OBS tarball repository
      ansible.builtin.fail:
        msg: "SSL_VERSION={{ ssl_version }} has no OBS tarball repository; use 1, 3 or 3.5."
      when: obs_tarball_repo | length == 0

    - name: Set the repository URL
      ansible.builtin.set_fact:
        obs_tarball_dir: "{{ obs_tarball_base }}/repositories/{{ lookup('env', 'OBS_PROJECT') | trim | regex_replace(':', ':/') }}/{{ obs_tarball_repo }}/"
        obs_tarball_pattern: "percona-postgresql-{{ major_version }}\\.[0-9.]+-{{ obs_tarball_repo | regex_escape }}-linux-{{ obs_tarball_arch }}\\.tar\\.gz"

    - name: List the repository and its architecture folder
      ansible.builtin.uri:
        url: "{{ item }}"
        return_content: true
        status_code: [200, 404]
      loop:
        - "{{ obs_tarball_dir }}"
        - "{{ obs_tarball_dir }}{{ obs_tarball_arch }}/"
      register: obs_tarball_listing

    - name: Pick the tarball for this host
      ansible.builtin.set_fact:
        tarball_url: "{{ (found | last) if found else '' }}"
      vars:
        found: >-
          {%- set urls = [] -%}
          {%- for r in obs_tarball_listing.results if r.status == 200 -%}
            {%- for f in (r.content | regex_findall(obs_tarball_pattern) | unique | sort) -%}
              {%- set _ = urls.append(r.item ~ f) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ urls }}

    - name: Fail when the OBS project has no tarball for this host
      ansible.builtin.fail:
        msg: >-
          No percona-postgresql-{{ major_version }}.*-{{ obs_tarball_repo }}-linux-{{ obs_tarball_arch }}.tar.gz
          in {{ obs_tarball_dir }} (or its {{ obs_tarball_arch }}/ folder).
      when: tarball_url | length == 0

    - name: Tarball found in OBS
      ansible.builtin.debug:
        msg: "Using {{ tarball_url }}"

- name: Fall back to worker io_method on RHEL 8, Rocky 8 and OracleLinux 8, as uring not supported
  ansible.builtin.set_fact:
    io_method: worker
  when:
    - (major_version | int) >= 18
    - io_method in ['io_uring']
    - >
      (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'Rocky' and ansible_facts['distribution_major_version'] | int == 8)
      or
      (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'RedHat' and ansible_facts['distribution_major_version'] | int == 8)
      or
      (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'OracleLinux' and ansible_facts['distribution_major_version'] | int == 8)

- name: task to run for aarch64 architecture
  shell: echo {{ tarball_url }} | sed  's:x86_64:aarch64:'
  register: aarch_url
  when: ansible_architecture == 'aarch64'

- name: task to run for aarch64 architecture
  ansible.builtin.set_fact:
    tarball_url: "{{ aarch_url.stdout }}"
  when: ansible_architecture == 'aarch64'

- name: Set Data directory
  ansible.builtin.set_fact:
    data_dir: "{{ data_dir_path }}"

- name: Tarball's SSL version
  debug:
    msg: "Tarball version is {{ ssl_version }}"

- name: Tarball's URL
  debug:
    msg: "Tarball version is {{ tarball_url }}"

- name: Install pre-packages
  ignore_errors: True
  package:
    name: "{{ item }}"
    update_cache: yes
    state: latest
  with_items:
    - sudo
    - vim
    - zstd
    - tar
    - file
    - wget
    - curl
    - binutils

- name: install Percona Platform for PostgreSQL {{major_version}} packages
  include_tasks: ../../../../tasks/install_openssl_for_tarballs.yml

- name: Gather groups information
  become: true
  command: getent group
  register: groups_info

- name: Set groups_list fact
  set_fact:
    groups_list: "{{ groups_info.stdout_lines | map('regex_replace', '^([^:]+):.*', '\\1') | list }}"

- name: Ensure postgres user is present
  user:
    name: postgres       # Specify the username to create
    state: present       # Ensure the user exists
    shell: /bin/bash     # Set the user's shell (optional)
    groups: "{{ 'wheel' if 'wheel' in groups_list else 'sudo' }}"
  when: groups_list is defined and ('wheel' in groups_list or 'sudo' in groups_list)

- name: install acl package on rhel 10
  become: true
  command:  sudo dnf install -y acl
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

- name: Install Percona Platform for PostgreSQL {{major_version}} packages
  include_tasks: ../../../../tasks/install_ppg_tarballs.yml

- name: Ensure data directory exists
  become: true
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory

- name: Grant read/write permissions to 'postgres' user
  ansible.builtin.file:
    path: "{{ data_dir }}"
    owner: postgres
    group: postgres
    mode: '0755'

- name: Initialize Postgres
  become: true
  command: "initdb -A trust -k {{data_dir}} "
  environment:
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:{{dest_dir}}/percona-postgresql{{major_version}}/bin"
  become_user: postgres

- name: Comment out any existing io_method line (PG18+)
  ansible.builtin.replace:
    path: "{{ data_dir }}/postgresql.conf"
    regexp: '^(?!#)(.*io_method.*)$'
    replace: '# \1'
  when: (major_version | int) >= 18

- name: Set io_method in postgresql.conf (PG18+)
  ansible.builtin.lineinfile:
    path: "{{ data_dir }}/postgresql.conf"
    line: "io_method = {{ io_method }}"
  when: (major_version | int) >= 18

- name: Check if io_uring is disabled
  command: cat /proc/sys/kernel/io_uring_disabled
  register: uring_disabled
  ignore_errors: true
  when:
    - (major_version | int) >= 18
    - io_method in ['io_uring']
    - ansible_os_family == 'RedHat'

- debug: var=uring_disabled.stdout_lines
  when:
    - (major_version | int) >= 18
    - io_method in ['io_uring']
    - ansible_os_family == 'RedHat'

- name: Enable io_uring if possible
  become: true
  sysctl:
    name: kernel.io_uring_disabled
    value: 0
    state: present
  when:
    - (major_version | int) >= 18
    - io_method in ['io_uring']
    - ansible_os_family == 'RedHat'
    - uring_disabled.stdout is defined
    - uring_disabled.stdout | int > 0

- name: Start Postgres Server
  include_tasks: ../../../../tasks/start_pgctl_with_diagnostics.yml
  vars:
    pgctl_bin: pg_ctl
    pgctl_data_dir: "{{ data_dir }}"
    pgctl_log_file: "/tmp/data{{ major_version }}.log"
    pgctl_options: "-p {{ server_port }}"
    pgctl_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:{{dest_dir}}/percona-postgresql{{major_version}}/bin"

- name: Display ppg version
  become: true
  ansible.builtin.command:
    cmd: ./psql -c "select version()"
  become_user: postgres
  args:
    chdir: "{{dest_dir}}/percona-postgresql{{major_version}}/bin"
  register: results

- debug: var=results.stdout_lines

- name: Display ppg version
  shell: ./psql -c "select version();"
  become_user: postgres
  args:
    chdir: "{{dest_dir}}/percona-postgresql{{major_version}}/bin"
  register: results

- debug: var=results.stdout_lines

- name: Create extension
  shell: ./psql -c "create extension xml2;"
  become_user: postgres
  args:
    chdir: "{{dest_dir}}/percona-postgresql{{major_version}}/bin"
  register: results

- debug: var=results.stdout_lines

- name: Create extension
  shell: ./psql -c "create extension plperl;"
  become_user: postgres
  args:
    chdir: "{{dest_dir}}/percona-postgresql{{major_version}}/bin"
  register: results

- debug: var=results.stdout_lines

- name: list /home/postgres
  ignore_errors: yes
  become: true
  shell: ls -ltra /home/postgres
  register: results

- debug: var=results.stdout_lines

- name: list /opt/pgdistro
  ignore_errors: yes
  become: true
  shell: ls -l /opt/pgdistro
  register: results

- debug: var=results.stdout_lines

- name: list /opt/pgdistro server bin dir
  ignore_errors: yes
  become: true
  shell: ls -l /opt/pgdistro/percona-postgresql17/bin
  register: results

- debug: var=results.stdout_lines

- name: Install PPG tools
  include_tasks: ../../../../tasks/install_ppg_tools_tarballs.yml

- name: Install GCC Deb
  apt:
    name: gcc
  when: ansible_os_family == "Debian"

- name: Install GCC RHEL
  yum:
    name: gcc
  when: ansible_os_family == "RedHat"

- name: Create temporary directory for compilation
  become: true
  ansible.builtin.file:
    path: "/tmp/libpq_command_temp_dir"
    state: directory

- name: Copy libpq source file
  copy:
    src: ../../common/files/lib_version.c
    dest: /tmp/libpq_command_temp_dir

- name: Delete dpkg-query for RHEL
  yum:
    name: dpkg
    state: absent
  when: ansible_os_family == "RedHat"
