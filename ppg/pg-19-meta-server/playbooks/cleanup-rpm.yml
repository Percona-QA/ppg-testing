---
- name: Cleanup
  hosts: all
  become: true
  become_method: sudo
  tasks:
    - name: remove Postgresql rpm packages
      yum:
        name: "{{ packages }}"
        state: absent
      vars:
        packages:
          - percona-postgresql-client-common
          - percona-postgresql-common
          - percona-postgresql19
          - percona-wal2json19
          - percona-pg-stat-monitor19
          - percona-pgaudit
          - percona-pg_repack19
      when: ansible_os_family == "RedHat"
