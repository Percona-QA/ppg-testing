---
- name: Cleanup
  hosts: all
  become: true
  become_method: sudo
  tasks:
    - name: remove Postgresql deb packages
      apt:
        name: "{{ packages }}"
        state: absent
      vars:
        packages:
          - percona-postgresql-19
          - percona-postgresql-19-pgaudit
          - percona-postgresql-19-repack
          - percona-postgresql-19-wal2json
          - percona-pg-stat-monitor19
      when: ansible_distribution == "Debian"
