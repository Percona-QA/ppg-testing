---
- name: Configure repository
  include_tasks: ../../../tasks/install_percona_release.yml

- name: Setting facts so that they will be persisted in the fact cache
  ansible.builtin.set_fact:
    pg_version_to_install: "{{ lookup('env', 'FROM_VERSION') | replace('ppg-','') }}"

- name: End play on Ubuntu 26 and versions older than 14.23
  meta: end_host
  when: ansible_distribution == "Ubuntu" and
    ansible_distribution_major_version == "26" and
    pg_version_to_install | string is version('14.23', '<', strict=True)

- name: End play on rocky linux 9
  meta: end_play
  when: ansible_os_family == "RedHat" and
   ansible_distribution_major_version == "9" and
   pg_version_to_install | string is version('14.6', '<=', strict=True)

- name: End play on Debian 12
  meta: end_play
  when: ansible_os_family == "Debian" and
   ansible_distribution_major_version == "12" and
   pg_version_to_install | string is version('14.8', '<=', strict=True)

- name: End play on Debian 13
  meta: end_play
  when: ansible_distribution == "Debian" and
   ansible_distribution_major_version == "13" and
   pg_version_to_install | string is version('14.19', '<=', strict=True)

- name: End play on Ubuntu 24
  meta: end_play
  when: ansible_distribution == "Ubuntu" and
   ansible_distribution_major_version == "24" and
   pg_version_to_install | string is version('14.11', '<=', strict=True)

- name: Setup initial (old) repository
  command: percona-release enable {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'FROM_REPO') }}"
    pg_version: "{{ lookup('env', 'FROM_VERSION') }}"

- name: install Percona Platform for PostgreSQL 14 packages
  include_tasks: ../../../../tasks/install_ppg14.yml

- name: Initialize Postgres RHEL
  command: /usr/pgsql-14/bin/postgresql-14-setup initdb
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  when: ansible_os_family == "RedHat"

- name: Install PPG tools
  include_tasks: ../../../../tasks/install_ppg14_tools.yml

- name: Start Postgres RHEL
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql-14
    svc_state: started
  when: ansible_os_family == "RedHat"

- name: Start postgresql service for Debian based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql
    svc_state: started
  when: ansible_os_family == "Debian"

- name: Seed data-integrity baseline before upgrade
  include_tasks: ../../../../tasks/seed_data_integrity.yml

- name: Disable old repository
  command: percona-release disable {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'FROM_REPO') }}"
    pg_version: "{{ lookup('env', 'FROM_VERSION') }}"

- name: Setup new repository
  command: percona-release enable {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'TO_REPO') }}"
    pg_version: "{{ lookup('env', 'VERSION') }}"

- name: Update apt cache
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Disable postgresql DNF module on RHEL/Rocky/OL
  command: dnf module disable postgresql -y
  ignore_errors: true
  when: ansible_os_family == "RedHat"

# percona-pg-telemetry14 is listed explicitly (it's otherwise only pulled in
# as a weak dependency/Recommends of the server package) so that this
# post-repo-switch install actually upgrades it too -- an already-installed
# package satisfying an unversioned Recommends is not otherwise re-resolved
# to a newer version by apt/dnf. This step is inlined (rather than reusing
# tasks/install_ppg14.yml, as it did before) so that change doesn't also
# affect that shared file's other callers (ppg/pg-14, ppg/pg-15-major-upgrade).
- name: install Percona Platform for PostgreSQL deb packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: latest
  vars:
    packages:
      - percona-postgresql
      - percona-postgresql-14
      - percona-postgresql-all
      - percona-postgresql-client
      - percona-postgresql-client-14
      - percona-postgresql-common
      - percona-postgresql-contrib
      - percona-postgresql-doc
      - percona-postgresql-doc-14
      - percona-pg-telemetry14
      - percona-postgresql-plperl-14
      - percona-postgresql-plpython3-14
      - percona-postgresql-pltcl-14
      - percona-postgresql-server-dev-14
      - percona-postgresql-server-dev-all
      - percona-postgresql-14-dbgsym
      - percona-postgresql-client-14-dbgsym
      - percona-postgresql-plperl-14-dbgsym
      - percona-postgresql-plpython3-14-dbgsym
      - percona-postgresql-pltcl-14-dbgsym
      - postgresql-client-common
      - postgresql-common
  when: ansible_os_family == "Debian"
  environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: install Percona Platform for PostgreSQL rpm packages for RHEL
  yum:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
        - percona-postgresql-client-common
        - percona-postgresql-common
        - percona-postgresql14
        - percona-pg-telemetry14
        - percona-postgresql14-contrib
        - percona-postgresql14-debuginfo
        - percona-postgresql14-devel
        - percona-postgresql14-docs
        - percona-postgresql14-libs
        - percona-postgresql14-llvmjit
        - percona-postgresql14-plpython3
        - percona-postgresql14-plperl
        - percona-postgresql14-pltcl
        - percona-postgresql14-server
        - percona-postgresql14-test
        - percona-postgresql14-contrib-debuginfo
        - percona-postgresql14-debuginfo
        - percona-postgresql14-debugsource
        - percona-postgresql14-devel-debuginfo
        - percona-postgresql14-libs-debuginfo
        - percona-postgresql14-plperl-debuginfo
        - percona-postgresql14-pltcl-debuginfo
        - percona-postgresql14-plpython3-debuginfo
        - percona-postgresql14-server-debuginfo
  when: ansible_os_family == "RedHat"
  environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: Determine required PostgreSQL dev package for RHEL
  set_fact:
    pg_dev_package: >-
      {{ 'percona-postgresql-server-dev-all'
        if (pg_version_to_install | string is version('14.17', '<=', strict=True))
        else 'percona-postgresql-common-dev' }}
  when: ansible_os_family == "RedHat"

- name: Install PostgreSQL dev package on RHEL
  yum:
    name: "{{ pg_dev_package }}"
    state: latest
    update_cache: yes
  when: ansible_os_family == "RedHat"

- name: Start postgresql service for RHEL based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql-14
    svc_state: started
  when: ansible_os_family == "RedHat"

- name: Start postgresql service for Debian based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql
    svc_state: started
  when: ansible_os_family == "Debian"

- name: Display ppg version
  become_user: postgres
  shell: psql -c "select version()"
  register: results

- debug:
      var: results.stdout

# =========Telemetry weak-dependency upgrade verification
- name: Verify telemetry weak-dependency survived the upgrade
  include_tasks: ../../../tasks/verify_telemetry_upgrade.yml
