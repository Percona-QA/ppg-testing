---
# Tasks for test major upgrade for PPG 19 packages

- name: Configure repository
  include_tasks: ../../../tasks/install_percona_release.yml

- name: setup epel release
  yum:
    name: epel-release
    update_cache: yes
    state: present
  when: ansible_os_family == "RedHat"

- name: Setting facts so that they will be persisted in the fact cache
  ansible.builtin.set_fact:
    pg_version_to_install: "{{ lookup('env', 'FROM_VERSION') | replace('ppg-','') }}"
    upgrade_to_pg_version: "{{ lookup('env', 'VERSION') | replace('ppg-','') }}"

# The 17->18 version of this file skipped Ubuntu 26 below FROM_VERSION 17.10
# (naively shifting that to 18.10 would be meaningless -- no such version
# exists, and it would silently make this gate always-true). The real,
# already-verified cutoff for PG18/Ubuntu 26 support is 18.4 (see pg-18's
# own base role), so that's what's used here for the FROM_VERSION (18.x)
# side of this upgrade.
- name: End play on Ubuntu 26 and versions older than 18.4
  meta: end_host
  when: ansible_distribution == "Ubuntu" and
    ansible_distribution_major_version == "26" and
    pg_version_to_install | string is version('18.4', '<', strict=True)

# The 17->18 version of this file also skipped Debian 13 entirely for
# FROM_VERSION <= 17.6 (an early-17.x/trixie build issue). No equivalent
# issue is known for 18.x -- Debian 13 is a fully supported pg-18 platform
# today -- so this end_play gate is not carried forward for the 18->19
# upgrade. Restore it (with a real cutoff) if 18.x turns out to have a
# similar issue on Debian 13.

- name: Setup initial (old) repository
  command: percona-release enable {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'FROM_REPO') }}"
    pg_version: "{{ lookup('env', 'FROM_VERSION') }}"

- name: install Percona Platform for PostgreSQL 18 packages
  include_tasks: ../../../../tasks/install_ppg18.yml

- name: Initialize Percona PostgreSQL 18 on RHEL
  ansible.builtin.command:
    cmd: "/usr/pgsql-18/bin/postgresql-18-setup initdb"
  become: true
  when: ansible_os_family == "RedHat"

- name: Enable checksums on Percona PostgreSQL 18 cluster
  ansible.builtin.command:
    cmd: "/usr/pgsql-18/bin/pg_checksums --enable -D /var/lib/pgsql/18/data"
  become: true
  when: ansible_os_family == "RedHat"

- name: Install PPG tools
  include_tasks: ../../../../tasks/install_ppg18_tools.yml

- name: Start Postgres RHEL
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql-18
    svc_state: started
  when: ansible_os_family == "RedHat"

- name: Start postgresql service for Debian based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql
    svc_state: started
  when: ansible_os_family == "Debian"

- name: Seed data-integrity baseline before upgrade
  include_tasks: ../../../../tasks/seed_data_integrity.yml

- name: Disable old repository
  command: percona-release disable {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'FROM_REPO') }}"
    pg_version: "{{ lookup('env', 'FROM_VERSION') }}"

- name: Setup new repository
  command: percona-release enable-only {{ pg_version }} {{ repo }}
  vars:
    repo: "{{ lookup('env', 'TO_REPO') }}"
    pg_version: "{{ lookup('env', 'VERSION') }}"

- name: install Percona Platform for PostgreSQL deb packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
    state: latest
  vars:
    packages:
      - percona-postgresql
      - percona-postgresql-19
      - percona-postgresql-all
      - percona-postgresql-client
      - percona-postgresql-client-19
      - percona-postgresql-common
      - percona-postgresql-contrib
      - percona-postgresql-doc
      - percona-postgresql-doc-19
      - percona-postgresql-plperl-19
      - percona-postgresql-plpython3-19
      - percona-postgresql-pltcl-19
      - percona-postgresql-server-dev-19
      - percona-postgresql-common-dev
      - percona-postgresql-19-dbgsym
      - percona-postgresql-client-19-dbgsym
      - percona-postgresql-plperl-19-dbgsym
      - percona-postgresql-plpython3-19-dbgsym
      - percona-postgresql-pltcl-19-dbgsym
      - postgresql-client-common
      - postgresql-common
  when: ansible_os_family == "Debian"
  environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

# The 17->18 version of this file only removed the conflicting package for
# FROM_VERSION >= 17.9, because early 17.x used a different RHEL common-dev
# packaging scheme. install_ppg18.yml already installs
# percona-postgresql-common-dev unconditionally for every 18.x version (no
# such split exists for 18.x), so this removal is unconditional here too
# rather than guessing an equivalent 18.x cutoff.
- name: Remove conflicting percona-postgresql-common-dev
  ansible.builtin.package:
    name: percona-postgresql-common-dev
    state: absent
  when: ansible_os_family == "RedHat"

- name: install Percona Platform for PostgreSQL rpm packages for RHEL
  yum:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
        - percona-postgresql-client-common
        - percona-postgresql-common
        - percona-postgresql-common-dev
        - percona-postgresql19
        - percona-postgresql19-contrib
        - percona-postgresql19-debuginfo
        - percona-postgresql19-devel
        - percona-postgresql19-docs
        - percona-postgresql19-libs
        - percona-postgresql19-llvmjit
        - percona-postgresql19-plpython3
        - percona-postgresql19-plperl
        - percona-postgresql19-pltcl
        - percona-postgresql19-server
        - percona-postgresql19-test
        - percona-postgresql19-contrib-debuginfo
        - percona-postgresql19-debuginfo
        - percona-postgresql19-debugsource
        - percona-postgresql19-devel-debuginfo
        - percona-postgresql19-libs-debuginfo
        - percona-postgresql19-plperl-debuginfo
        - percona-postgresql19-pltcl-debuginfo
        - percona-postgresql19-plpython3-debuginfo
        - percona-postgresql19-server-debuginfo
  when: ansible_os_family == "RedHat"
  environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

- name: Install pg_tde packages RHEL
  yum:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
    - percona-pg_tde19
    - percona-pg_tde19-devel
    - percona-pg_tde19-debugsource
    - percona-pg_tde19-debuginfo
  when: ansible_os_family == "RedHat"

- name: Install pg_tde packages Debian
  apt:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
    - percona-pg-tde19
    - percona-pg-tde19-client
    - percona-pg-tde19-dbgsym
  when: ansible_os_family == "Debian"

- name: Install pg-stat-monitor RHEL
  yum:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
      - percona-pg_stat_monitor19
  when: ansible_os_family == "RedHat"

- name: Install pg-stat-monitor debian
  apt:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
  vars:
    packages:
      - percona-pg-stat-monitor19
  when: ansible_os_family == "Debian"

- name: Initialize Percona PostgreSQL 19 on RHEL
  ansible.builtin.command:
    cmd: "/usr/pgsql-19/bin/postgresql-19-setup initdb"
  become: true
  when: ansible_os_family == "RedHat"

- name: Set io_method to worker for PG 19
  ansible.builtin.lineinfile:
    path: "/var/lib/pgsql/19/data/postgresql.conf"
    regexp: '^io_method'
    line: "io_method = 'worker'"
  become: true
  when: ansible_os_family == "RedHat"

- name: Stop postgresql service for RHEL based
  service:
    name: postgresql-18
    state: stopped
  when: ansible_os_family == "RedHat"

- name: Stop postgresql service for Debian based
  service:
    name: postgresql
    state: stopped
  when: ansible_os_family == "Debian"

- name: Create PostgreSQL 19 cluster on Debian with no checksums
  ansible.builtin.command: >
    /usr/bin/pg_createcluster 19 main --port=5433 -- --no-data-checksums
  become: true
  become_user: postgres
  when: ansible_os_family == "Debian"

- name: Set io_method = 'worker' for PostgreSQL 19 cluster
  lineinfile:
    path: /etc/postgresql/19/main/postgresql.conf
    line: "io_method = 'worker'"
  when: ansible_os_family == "Debian"

- pause:
    minutes: 1

- name: Add Percona PG19 lib to ld.so.conf.d
  become: true
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/percona-pg19.conf
    content: "/usr/lib/postgresql/19/lib"
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Percona PG19 lib to ld.so.conf.d
  become: true
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/percona-pg19.conf
    content: "/usr/pgsql-19/lib"
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "RedHat"

- name: Run ldconfig after adding percona lib path
  become: true
  ansible.builtin.command: /sbin/ldconfig

- name: Execute pg_upgrade RHEL
  command: /usr/pgsql-19/bin/pg_upgrade --old-bindir /usr/pgsql-18/bin --new-bindir /usr/pgsql-19/bin --old-datadir /var/lib/pgsql/18/data --new-datadir /var/lib/pgsql/19/data
  become: true
  become_user: postgres
  args:
    chdir: /tmp
  when: ansible_os_family == "RedHat"

- name: Execute pg_upgrade Deb
  command: /usr/lib/postgresql/19/bin/pg_upgrade --old-datadir=/var/lib/postgresql/18/main --new-datadir=/var/lib/postgresql/19/main --old-bindir=/usr/lib/postgresql/18/bin --new-bindir=/usr/lib/postgresql/19/bin --old-options '-c config_file=/etc/postgresql/18/main/postgresql.conf' --new-options '-c config_file=/etc/postgresql/19/main/postgresql.conf'
  become: true
  become_method: sudo
  become_user: postgres
  args:
    chdir: /tmp
  when: ansible_os_family == "Debian"

- name: Change postgresql 18 port in config Debian
  lineinfile:
    path: /etc/postgresql/18/main/postgresql.conf
    search_string: 'port'
    line: port = 5433
  when: ansible_os_family == "Debian"

- name: Change postgresql 18 port in config RHEL
  lineinfile:
    path: /var/lib/pgsql/18/data/postgresql.conf
    search_string: 'port'
    line: port = 5433
  when: ansible_os_family == "RedHat"

- name: Change postgresql 19 port in config Debian
  lineinfile:
    path: /etc/postgresql/19/main/postgresql.conf
    search_string: 'port'
    line: port = 5432
  when: ansible_os_family == "Debian"

- name: Change postgresql 19 port in config RHEL
  lineinfile:
    path: /var/lib/pgsql/19/data/postgresql.conf
    search_string: 'port'
    line: port = 5432
  when: ansible_os_family == "RedHat"

- name: Add extensions to postgresql.conf for Debian
  lineinfile:
    path: /etc/postgresql/19/main/postgresql.conf
    line: shared_preload_libraries = 'pg_stat_monitor'
  when: ansible_os_family == "Debian"

- name: Add extensions to postgresql.conf for RHEL
  lineinfile:
    path: /var/lib/pgsql/19/data/postgresql.conf
    line: shared_preload_libraries = 'pg_stat_monitor'
  when: ansible_os_family == "RedHat"

- name: Restart postgresql service for RHEL based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql-19
    svc_state: restarted
  when: ansible_os_family == "RedHat"

- name: Drop pg_dropcluster for version 18
  command: /usr/bin/pg_dropcluster 18 main
  become: true
  become_method: sudo
  become_user: postgres
  when: ansible_os_family == "Debian"
  register: results

- debug:
    var: results.stdout_lines

- name: list pg_lsclsuters
  command: pg_lsclusters
  become: true
  become_method: sudo
  become_user: postgres
  when: ansible_os_family == "Debian"
  register: results

- debug:
    var: results.stdout_lines

- name: Delete /var/run/postgresql lock and pid file
  command: rm -fr /var/run/postgresql/*
  become: true
  when: ansible_os_family == "Debian"
  register: results

- name: Restart postgresql service for Debian based
  include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
  vars:
    svc_name: postgresql@19-main.service
    svc_state: restarted
  when: ansible_os_family == "Debian"

- name: Display ppg version
  become_user: postgres
  shell: psql -c "select version()"
  register: results

- debug: var=results.stdout_lines
