---
# Start haproxy. Not a systemd unit in this repo's setup — launched directly
# via `haproxy -f <cfg> -D` (self-daemonizing), so "did it fail" means the
# launcher command exited non-zero, not a systemd state check — hence its
# own file rather than a branch inside start_service_with_diagnostics.yml.
#
# Caller must set:
#   haproxy_cfg - path to haproxy.cfg, e.g. /etc/haproxy/haproxy.cfg
# Caller may set:
#   haproxy_bin      - path (or bare name, if PATH-resolved) to the haproxy
#                      binary; default "haproxy" (package installs put it on
#                      the default PATH -- tarball installs need the full
#                      {{dest_dir}}/percona-haproxy/sbin/haproxy path)
#   haproxy_env_path - PATH environment value for the command, e.g. to make
#                      a tarball's percona-haproxy/sbin resolvable

- name: Start haproxy
  ansible.builtin.shell: "{{ haproxy_bin | default('haproxy') }} -f {{ haproxy_cfg }} -D"
  environment:
    PATH: "{{ haproxy_env_path | default(ansible_env.PATH) }}"
  register: __haproxy_result
  changed_when: true
  ignore_errors: true

- name: Show haproxy launch output on failure
  ansible.builtin.debug:
    msg: >-
      haproxy failed to start (rc={{ __haproxy_result.rc }}):
      stdout: {{ __haproxy_result.stdout }}
      stderr: {{ __haproxy_result.stderr }}
  when: __haproxy_result is failed

- name: Fail if haproxy did not start
  ansible.builtin.fail:
    msg: "haproxy failed to start (rc={{ __haproxy_result.rc }})"
  when: __haproxy_result is failed
