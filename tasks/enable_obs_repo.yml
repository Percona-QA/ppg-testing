---
  - name: Resolve OBS project for this repo/version selection
    include_tasks: resolve_obs_repo.yml

  - name: Add OBS apt source (Debian/Ubuntu)
    ansible.builtin.copy:
      dest: "/etc/apt/sources.list.d/{{ obs_project }}.list"
      mode: "0644"
      content: |
        deb {{ obs_base_url }}/ /
    when: ansible_os_family == "Debian"

  - name: Ensure gnupg is present (Debian/Ubuntu)
    ansible.builtin.apt:
      name: gnupg
      state: present
    when: ansible_os_family == "Debian"

  - name: Download OBS repo signing key (Debian/Ubuntu)
    ansible.builtin.get_url:
      url: "{{ obs_base_url }}/Release.key"
      dest: "/tmp/{{ obs_safe_id }}.key"
      mode: "0644"
      force: true
    when: ansible_os_family == "Debian"

  - name: Dearmor and install OBS repo signing key (Debian/Ubuntu)
    ansible.builtin.shell: |
      gpg --batch --yes --dearmor -o /etc/apt/trusted.gpg.d/{{ obs_safe_id }}.gpg /tmp/{{ obs_safe_id }}.key
    when: ansible_os_family == "Debian"

  - name: Update apt cache (Debian/Ubuntu)
    ansible.builtin.apt:
      update_cache: true
    when: ansible_os_family == "Debian"

  - name: Import OBS repo signing key (RHEL/Rocky)
    # rpm has its own OpenPGP parser and doesn't shell out to the system gpg/gpg2,
    # unlike ansible.builtin.rpm_key — which failed on RHEL10 (couldn't parse the
    # key's OpenPGP v6 packet) and OL10 (no gpg2 binary present at all).
    ansible.builtin.command: "rpm --import {{ obs_base_url }}/repodata/repomd.xml.key"
    changed_when: true
    when: ansible_os_family == "RedHat"

  - name: Add OBS yum repository (RHEL/Rocky)
    ansible.builtin.copy:
      dest: "/etc/yum.repos.d/{{ obs_safe_id }}.repo"
      mode: "0644"
      content: |
        [{{ obs_project }}]
        name={{ obs_project }} - {{ obs_repo_dir }}
        baseurl={{ obs_base_url }}/
        enabled=1
        gpgcheck=0
    when: ansible_os_family == "RedHat"

  - name: Refresh dnf cache (RHEL/Rocky)
    ansible.builtin.shell: |
      dnf clean all
      dnf makecache
    when: ansible_os_family == "RedHat"
