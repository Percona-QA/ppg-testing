---
# Seed a deterministic dataset on the FROM_VERSION server, before it is
# upgraded, so tests_ppg/test_bvt.py can verify afterwards that the upgrade
# actually preserved the data rather than just installing packages
# successfully.
#
# Caller must have already set the pg_version_to_install fact (major.minor
# of FROM_VERSION, e.g. "16.14") and started the old server.

- name: Determine pgbench binary path for FROM_VERSION
  ansible.builtin.set_fact:
    __seed_pgbench_bin: >-
      {{ '/usr/pgsql-' + (pg_version_to_install.split('.')[0]) + '/bin/pgbench'
         if ansible_os_family == 'RedHat' else 'pgbench' }}

- name: Seed pgbench baseline data before upgrade
  become_user: postgres
  ansible.builtin.command: "{{ __seed_pgbench_bin }} -i -s 1"
  register: __seed_pgbench_result

- name: Seed deterministic checksum table before upgrade
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "CREATE TABLE ppg_upgrade_data_check (id serial PRIMARY KEY, payload text NOT NULL)"
      - -c
      - >-
        INSERT INTO ppg_upgrade_data_check (payload)
        SELECT md5(i::text) FROM generate_series(1, 500) AS i
  register: __seed_checksum_result

- name: Report data-integrity seeding results
  ansible.builtin.debug:
    msg:
      - "{{ __seed_pgbench_result.stdout_lines }}"
      - "{{ __seed_checksum_result.stdout_lines }}"

# credcheck: if the FROM release ships it (installed by the tools install),
# create the extension before the upgrade, so the upgrade has to carry it
# (pg_upgrade needs credcheck on the new side) and the post-upgrade tests in
# test_bvt.py can check it. Decided at run time: no-op where the FROM
# release has no credcheck.
- name: Check whether credcheck is available before upgrade
  become_user: postgres
  ansible.builtin.command: psql -tAc "SELECT count(*) FROM pg_available_extensions WHERE name = 'credcheck'"
  register: __seed_credcheck_available
  changed_when: false

- name: Remember whether credcheck is seeded for the upgrade
  ansible.builtin.set_fact:
    upgrade_seeded_credcheck: "{{ __seed_credcheck_available.stdout | trim == '1' }}"

- name: Create the credcheck extension before upgrade
  become_user: postgres
  ansible.builtin.command:
    argv:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -c
      - "CREATE EXTENSION credcheck"
      - -c
      - "CREATE TABLE ppg_upgrade_credcheck_check (extversion text NOT NULL)"
      - -c
      - "INSERT INTO ppg_upgrade_credcheck_check SELECT extversion FROM pg_extension WHERE extname = 'credcheck'"
  when: upgrade_seeded_credcheck | bool
