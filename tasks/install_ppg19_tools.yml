---
  # Unlike pg-18 (where this was version-gated because postgis35 packaging
  # only applied from a certain point onward), ppg-19 always uses these
  # names -- and postgis is 3.7.x for ppg-19 (vs 3.5.x for pg-14..18), so
  # the RHEL package prefix is postgis37, not postgis35.
  - name: Setting facts so that they will be persisted in the fact cache
    ansible.builtin.set_fact:
      pgaudit_rhel_package_name: "percona-pgaudit19"
      postgis_rhel_package_name_prefix: "percona-postgis37_19"

  - debug:
      msg: "Value of pgaudit_rhel_package_name is : {{ pgaudit_rhel_package_name }}"

  - debug:
      msg: "Value of postgis_rhel_package_name_prefix is : {{ postgis_rhel_package_name_prefix }}"

  - name: Install additional tools for pgbackrest test Debian
    apt:
      name: "{{ packages }}"
      state: latest
    vars:
      packages:
        - libxml-checker-perl
        - libyaml-perl
        - texlive-latex-base
        - texlive-latex-extra
        - texlive-fonts-recommended
        - lcov
        - rsync
        - zlib1g-dev
        - libssl-dev
        - libxml2-dev
        - libpq-dev
        - pkg-config
        - valgrind
        - liblz4-dev
        - zstd
        - libzstd-dev
        - bzip2
        - libbz2-dev
#        - libsharyanto-string-util-perl
        - libipc-run-perl
        - libtext-csv-xs-perl
        - python3-systemd
    when: ansible_os_family == "Debian"

  - name: Ensure correct lz4 package is installed (Debian/Ubuntu)
    ansible.builtin.apt:
      name: "{{ lz4_package }}"
      state: present
      update_cache: yes
    vars:
      lz4_package: >-
        {% if ansible_distribution == 'Debian' and (ansible_distribution_major_version | int) < 13 %}
          liblz4-tool
        {% elif ansible_distribution == 'Ubuntu' and (ansible_distribution_major_version | int) <= 24 %}
          liblz4-tool
        {% else %}
          lz4
        {% endif %}
    when: ansible_os_family == "Debian"

  - name: Install pgaudit Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-postgresql-19-pgaudit
        - percona-postgresql-19-pgaudit-dbgsym
    when: ansible_os_family == "Debian"

  - name: Install pgaudit RHEL
    yum:
      name: "{{ pgaudit_rhel_package_name }}"
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  # TEMPORARILY DISABLED: percona-pgbackrest is not yet published on OBS for
  # ppg-19 (isv:percona:ppg:staging:19 has zero pgbackrest packages, confirmed
  # directly against the repo). Revert this whole pgbackrest block (remove
  # the `and false` from each `when`) once it's available.
  - name: Install pgbackrest Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pgbackrest
        - percona-pgbackrest-doc
        - percona-pgbackrest-dbgsym
    when: ansible_os_family == "Debian" and false

  - name: Install pgbackrest RHEL
    yum:
      name: percona-pgbackrest
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat" and false

  - name: Create pgbackrest directory
    file:
      path: /etc/pgbackrest/
      state: directory
    when: false

  - name: Create pgbackrest configuration Debian
    blockinfile:
      path: /etc/pgbackrest/pgbackrest.conf
      create: yes
      block: |
        [global]
        repo1-path=/var/lib/pgbackrest

        [testing]
        pg1-path=/var/lib/postgresql/19/main
        pg1-port=5432
    when: ansible_os_family == "Debian" and false

  - name: Create pgbackrest configuration RHEL
    blockinfile:
      path: /etc/pgbackrest/pgbackrest.conf
      create: yes
      block: |
        [global]
        repo1-path=/var/lib/pgbackrest

        [testing]
        pg1-path=/var/lib/pgsql/19/data
        pg1-port=5432
    when: ansible_os_family == "RedHat" and false

  - name: Configure backup config for Debian
    blockinfile:
      path: /etc/postgresql/19/main/postgresql.conf
      block: |
        archive_mode = on
        archive_command = 'pgbackrest --stanza=testing archive-push %p'
        max_wal_senders = 10
        wal_level = logical
    when: ansible_os_family == "Debian" and false

  - name: Configure backup config for RHEL
    blockinfile:
      path: /var/lib/pgsql/19/data/postgresql.conf
      block: |
        archive_mode = on
        archive_command = 'pgbackrest --stanza=testing archive-push %p'
        max_wal_senders = 10
        wal_level = logical
    when: ansible_os_family == "RedHat" and false

  - name: Restart Postgres RHEL
    include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
    vars:
      svc_name: postgresql-19
      svc_state: restarted
    when: ansible_os_family == "RedHat"

  - name: Restart Postgres Debian
    include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
    vars:
      svc_name: postgresql
      svc_state: restarted
    when: ansible_os_family == "Debian"

  - name: Install pgrepack Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-postgresql-19-repack
        - percona-postgresql-19-repack-dbgsym
    when: ansible_os_family == "Debian"

  - name: Install pgrepack RHEL
    yum:
      name: percona-pg_repack19
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  # --- Patroni/etcd/haproxy HA sandbox -------------------------------------
  # This role also runs a plain, standalone PostgreSQL instance (initdb'd
  # and started earlier in this role's tasks/main.yml) that dozens of
  # unrelated tests in this same file exercise directly (pgbackrest,
  # pgaudit, pg_stat_monitor, postgis, pg_cron, telemetry, etc.). The
  # Patroni cluster below is a fully separate, isolated 3-node sandbox --
  # its own data dirs/ports under patroni_test/, nodes named
  # postgresql0/1/2 -- so it never touches that standalone instance.
  # Because of that isolation, the plain `patroni` systemd unit (installed
  # by the package) is only ever a packaging-sanity check here
  # (test_patroni_service asserts is_enabled, nothing about it actually
  # running or being part of the cluster); the *real* cluster members are
  # patroni0/patroni1/patroni2. See the Debian "Enable (but do not start)
  # patroni" task below for why that distinction matters in practice.
  #
  # The patroniN service/config files themselves live in the shared
  # files/patroni_common/ at the repo root, not in this role's own files/ --
  # they're identical (or, for the postgresqlN configs, differ only by the
  # bin_dir path) across every ppg-<major> role, so ppg-14..19 all render
  # them from that one shared location instead of keeping five near-
  # duplicate copies.
  - name: Set patroni template major version fact
    set_fact:
      patroni_pg_major: "{{ pg_version_to_install.split('.')[0] }}"

  - name: Install patroni RPM
    yum:
      name: percona-patroni
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  - name: Install python3-pip
    yum:
      name: python3-pip
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "9"

  # - name: Install python3 module - patroni[etcd]
  #   become: true
  #   command: python3 -m pip install patroni[etcd]
  #   when: ansible_os_family == "RedHat"

  - name: Install patroni debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-patroni
        - percona-patroni-doc
    when: ansible_os_family == "Debian"

  - name: Install pg-stat-monitor RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pg_stat_monitor19
        - percona-pg_stat_monitor19-debuginfo
    when: ansible_os_family == "RedHat"

  - name: Install pg-stat-monitor debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pg-stat-monitor19
        - percona-pg-stat-monitor19-dbgsym
    when: ansible_os_family == "Debian"

  - name: Install pgbadger RHEL
    yum:
      name: percona-pgbadger
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  - name: Install pgbadger Debian
    apt:
      name: percona-pgbadger
      state: latest
      update_cache: yes
    when: ansible_os_family == "Debian"

  - name: Install CPAN
    become: true
    command: yum -y install perl-CPAN
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "9"

  - name: Install perl-App-cpanminus
    become: true
    command: yum -y install perl-App-cpanminus
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "9"

  - name: Install perl module Benchmark
    become: true
    command: cpanm Benchmark
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "9"

  - name: Install percona-pgaudit19_set_user RHEL
    yum:
      name: percona-pgaudit19_set_user
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  - name: Install percona-pgaudit19_set_user Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pgaudit19-set-user
        - percona-pgaudit19-set-user-dbgsym
    when: ansible_os_family == "Debian"

  - name: Install percona-pgbouncer RHEL
    yum:
      name: percona-pgbouncer
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  - name: Install percona-pgbouncer Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pgbouncer
        - percona-pgbouncer-dbgsym
    when: ansible_os_family == "Debian"

  - name: Install percona-pgpool RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pgpool-II-pg19
        - percona-pgpool-II-pg19-extensions
    when: ansible_os_family == "RedHat"

  # Unlike pg-18 (which switched from libpgpool2 to libpgpoolpcp3 at 18.4),
  # ppg-19 uses libpgpoolpcp3 from its first release, so no version gate
  # is needed here.
  - name: Install percona-pgpool Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pgpool2
        - libpgpoolpcp3
    when: ansible_os_family == "Debian"

  - name: Enable llvm-toolset for RHEL8 to install PostGIS
    become: true
    command: dnf module enable llvm-toolset -y
    when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"

  - name: Install percona-postgis RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - "{{postgis_rhel_package_name_prefix}}"
      - "{{postgis_rhel_package_name_prefix}}-client"
      - "{{postgis_rhel_package_name_prefix}}-client-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-devel"
      - "{{postgis_rhel_package_name_prefix}}-docs"
      - "{{postgis_rhel_package_name_prefix}}-gui"
      - "{{postgis_rhel_package_name_prefix}}-gui-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-llvmjit"
      - "{{postgis_rhel_package_name_prefix}}-utils"
    when: ansible_os_family == "RedHat"

  - name: Install percona-postgis Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-postgresql-19-postgis-3
        - percona-postgresql-19-postgis-3-scripts
        - percona-postgresql-postgis-scripts
        - percona-postgresql-postgis
        - percona-postgis
    when: ansible_os_family == "Debian"

  # TEMPORARILY DISABLED: percona-wal2json19 is not yet published on OBS for
  # ppg-19. Revert (remove `and false`) once it's available.
  - name: Install percona-wal2json19 RHEL
    yum:
      name: percona-wal2json19
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat" and false

  - name: Install percona-wal2json19 Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-postgresql-19-wal2json
        - percona-postgresql-19-wal2json-dbgsym
    when: ansible_os_family == "Debian" and false

  - name: Install percona-pg_gather RHEL
    yum:
      name: percona-pg_gather
      state: latest
      update_cache: yes
    when: ansible_os_family == "RedHat"

  - name: Install percona-pg_gather Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - percona-pg-gather
    when: ansible_os_family == "Debian"

  - name: Install pgvector packages RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pgvector_19
      - percona-pgvector_19-debuginfo
      - percona-pgvector_19-debugsource
      - percona-pgvector_19-llvmjit
    when: ansible_os_family == "RedHat"

  - name: Install pgvector packages Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-postgresql-19-pgvector
    when: ansible_os_family == "Debian"

  # TEMPORARILY DISABLED: percona-pg_tde19 is not yet published on OBS for
  # ppg-19. Revert (remove `and false`) once it's available -- and also
  # add 'pg_tde' back to final_extensions below at the same time.
  - name: Install pg_tde packages RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pg_tde19
      - percona-pg_tde19-devel
      - percona-pg_tde19-debugsource
      - percona-pg_tde19-debuginfo
    when: ansible_os_family == "RedHat" and false

  - name: Install pg_tde packages Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pg-tde19
      - percona-pg-tde19-client
      - percona-pg-tde19-dbgsym
    when: ansible_os_family == "Debian" and false

  # Unlike pg-18 (which gated pg_oidc_validator and pg_cron behind
  # minor-version cutoffs, since they were backported mid-cycle), ppg-19
  # ships both from its first release, so no version gate is needed here.
  - name: Install pg_oidc_validator packages RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pg_oidc_validator19
    when: ansible_os_family == "RedHat"

  - name: Install pg_oidc_validator packages Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pg-oidc-validator19
    when: ansible_os_family == "Debian"

  - name: Install pg_cron packages RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-pg_cron_19
    when: ansible_os_family == "RedHat"

  - name: Install pg_cron packages Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-postgresql-19-cron
    when: ansible_os_family == "Debian"

  - name: Configure shared_preload_libraries
    vars:
      # 1. Define base extensions
      # pg_oidc_validator is NOT preloaded; it is tested as a regular extension via CREATE EXTENSION
      # pg_cron is available from 19.0 onwards, so no version gate is needed here.
      # pg_tde TEMPORARILY REMOVED: its package isn't installed (see the
      # disabled "Install pg_tde packages" tasks above) -- listing it here
      # while uninstalled would make postgres fail to start outright. Add
      # it back here at the same time pg_tde installation is re-enabled.
      final_extensions: ['pg_stat_monitor', 'pgaudit', 'set_user', 'pg_cron']

      # 3. Handle OS-specific paths dynamically
      pg_conf_path: "{{ '/etc/postgresql/19/main/postgresql.conf' if ansible_os_family == 'Debian' else '/var/lib/pgsql/19/data/postgresql.conf' }}"

    ansible.builtin.lineinfile:
      path: "{{ pg_conf_path }}"
      regexp: '^#?shared_preload_libraries\s*='
      line: "shared_preload_libraries = '{{ final_extensions | join(', ') }}'"
      state: present
    become: true
    # Only run if it's one of your supported families
    when: ansible_os_family in ["Debian", "RedHat"]

  - name: Configure pg_oidc_validator settings in postgresql.conf
    blockinfile:
      path: "{{ '/etc/postgresql/19/main/postgresql.conf' if ansible_os_family == 'Debian' else '/var/lib/pgsql/19/data/postgresql.conf' }}"
      marker: "# {mark} ANSIBLE MANAGED BLOCK pg_oidc_validator"
      block: |
        oauth_validator_libraries = 'pg_oidc_validator'
        pg_oidc_validator.authn_field = 'sub'
    when: ansible_os_family in ["Debian", "RedHat"]

  - name: Remove pg_hba.conf debian
    file:
      path: /var/lib/pgsql/19/data/pg_hba.conf
      state: absent
    when: ansible_os_family == "RedHat"

  - name: Remove pg_hba.conf debian
    file:
      path: /etc/postgresql/19/main/pg_hba.conf
      state: absent
    when: ansible_os_family == "Debian"

  - name: Edit pg_hba.conf RHEL
    blockinfile:
      path: /var/lib/pgsql/19/data/pg_hba.conf
      create: yes
      owner: postgres
      block: |
        local   all             all                                     trust
        host    all             all             127.0.0.1/32            trust
        host    all             all             ::1/128                 trust
        local   replication     all                                     trust
        host    replication     all             127.0.0.1/32            trust
        host    replication     all             ::1/128                 trust
    when: ansible_os_family == "RedHat"

  - name: Edit pg_hba.conf Debian
    blockinfile:
      create: yes
      owner: postgres
      path: /etc/postgresql/19/main/pg_hba.conf
      block: |
        local   all             all                                     trust
        host    all             all             127.0.0.1/32            trust
        host    all             all             ::1/128                 trust
        local   replication     all                                     trust
        host    replication     all             127.0.0.1/32            trust
        host    replication     all             ::1/128                 trust
    when: ansible_os_family == "Debian"

  - name: Add OIDC entry to pg_hba.conf RHEL
    lineinfile:
      path: /var/lib/pgsql/19/data/pg_hba.conf
      line: 'host    all             oidc_test_user  127.0.0.1/32            oauth issuer="https://mock-issuer.com", scope="openid"'
      state: present
    when: ansible_os_family == "RedHat"

  - name: Add OIDC entry to pg_hba.conf Debian
    lineinfile:
      path: /etc/postgresql/19/main/pg_hba.conf
      line: 'host    all             oidc_test_user  127.0.0.1/32            oauth issuer="https://mock-issuer.com", scope="openid"'
      state: present
    when: ansible_os_family == "Debian"

  - name: Restart Postgres RHEL
    include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
    vars:
      svc_name: postgresql-19
      svc_state: restarted
    when: ansible_os_family == "RedHat"

  - name: Restart Postgres Debian
    include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
    vars:
      svc_name: postgresql
      svc_state: restarted
    when: ansible_os_family == "Debian"


  - name: Install etcd packages RHEL
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - etcd
      - percona-haproxy
      - python3-etcd
    when: ansible_os_family == "RedHat"

  - name: Restart etcd RHEL
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: etcd
      svc_state: restarted
    when: ansible_os_family == "RedHat"

  - name: Install patroni related packages Debian
    apt:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
        - etcd
        - percona-haproxy
    when: ansible_os_family == "Debian"

  - name: Create /etc/patroni directory
    file:
      path: /etc/patroni
      state: directory

  # - name: Check if patroni.yml exists
  #   ansible.builtin.stat:
  #     path: /etc/patroni/patroni.yml
  #   register: patroni_cfg_stat
  #   become: yes

  # - name: Copy Patroni sample config to active config if not present
  #   ansible.builtin.copy:
  #     src: /etc/patroni/patroni.yml.sample
  #     dest: /etc/patroni/patroni.yml
  #     remote_src: yes
  #     owner: postgres
  #     group: postgres
  #     mode: '0644'
  #   become: yes
  #   when:
  #     - ansible_os_family == "Debian"
  #     - not patroni_cfg_stat.stat.exists

  - name: Copy postgresql.yml for patroni service Debian
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql0_deb.yml.j2"
      dest: /etc/patroni/patroni.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "Debian"

  # - name: Change systemd Type from notify to simple for Patroni
  #   ansible.builtin.replace:
  #     path: /usr/lib/systemd/system/patroni.service
  #     regexp: '^Type=notify'
  #     replace: 'Type=simple'
  #   become: yes
  #   when: ansible_os_family == "Debian"

  # - name: Reload systemd daemon
  #   ansible.builtin.command: systemctl daemon-reload
  #   become: yes
  #   when: ansible_os_family == "Debian"

  # - name: Start patroni
  #   service:
  #     name: patroni
  #     state: started
  #     enabled: yes

  - name: Enable and start patroni with wait RHEL
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: patroni
      svc_state: started
      svc_daemon_reload: true
      svc_async: 190
      svc_poll: 5
    when: ansible_os_family == "RedHat"

  # Debian's /etc/patroni/patroni.yml is copied from the same
  # postgresql0_deb.yml template as patroni0's config just below, so both
  # would claim the same etcd member name "postgresql0" if both actually
  # ran -- whichever starts second crashes with "there is already a node
  # named 'postgresql0' running". patroni0/1/2 are the real 3-node cluster;
  # this base unit only needs to exist and be enabled for test_patroni_service,
  # so enable it without starting it on Debian.
  - name: Enable (but do not start) patroni on Debian
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: patroni
      svc_state: stopped
      svc_daemon_reload: true
    when: ansible_os_family == "Debian"

  # - name: Install patroni related dependency on Debian 13
  #   apt:
  #     name: "{{ packages }}"
  #     state: latest
  #     update_cache: yes
  #   vars:
  #     packages:
  #       - python3-etcd
  #   when: ansible_os_family == "Debian" and ansible_distribution_major_version == "13"

# when: (ansible_distribution == "Ubuntu") or
#       (ansible_os_family == "Debian" and ansible_lsb.major_release|int <= 11)

  # - name: Install patroni related packages Debian 12
  #   apt:
  #     name: "{{ packages }}"
  #     state: latest
  #     update_cache: yes
  #   vars:
  #     packages:
  #       - etcd-server
  #       - etcd-client
  #       - percona-haproxy
  #   when: (ansible_os_family == "Debian" and ansible_lsb.major_release|int >= 12)

  - name: Create test patroni directory RHEL
    file:
      path: /var/lib/pgsql/patroni_test/
      state: directory
      owner: postgres
      group: postgres
    when: ansible_os_family == "RedHat"

  - name: Create test patroni directory Debian
    file:
      path: /var/lib/postgresql/patroni_test/
      state: directory
      owner: postgres
      group: postgres
    when: ansible_os_family == "Debian"

  - name: Copy postgresql0.yml for patroni service Debian
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql0_deb.yml.j2"
      dest: /var/lib/postgresql/patroni_test/postgresql0.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy postgresql1.yml for patroni service Debian
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql1_deb.yml.j2"
      dest: /var/lib/postgresql/patroni_test/postgresql1.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy postgresql2.yml for patroni service Debian
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql2_deb.yml.j2"
      dest: /var/lib/postgresql/patroni_test/postgresql2.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy postgresql0.yml for patroni service RHEL
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql0.yml.j2"
      dest: /var/lib/pgsql/patroni_test/postgresql0.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Copy postgresql1.yml for patroni service RHEL
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql1.yml.j2"
      dest: /var/lib/pgsql/patroni_test/postgresql1.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Copy postgresql2.yml for patroni service RHEL
    template:
      src: "{{ role_path }}/../../files/patroni_common/postgresql2.yml.j2"
      dest: /var/lib/pgsql/patroni_test/postgresql2.yml
      owner: postgres
      group: postgres
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Copy patroni0 service file Debian
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni0_deb.service"
      dest: /lib/systemd/system/patroni0.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy patroni1 service file Debian
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni1_deb.service"
      dest: /lib/systemd/system/patroni1.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy patroni2 service file Debian
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni2_deb.service"
      dest: /lib/systemd/system/patroni2.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "Debian"

  - name: Copy patroni0 service file RHEL
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni0.service"
      dest: /usr/lib/systemd/system/patroni0.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Copy patroni1 service file RHEL
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni1.service"
      dest: /usr/lib/systemd/system/patroni1.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Copy patroni2 service file RHEL
    copy:
      src: "{{ role_path }}/../../files/patroni_common/patroni2.service"
      dest: /usr/lib/systemd/system/patroni2.service
      owner: root
      group: root
      mode: 0644
    when: ansible_os_family == "RedHat"

  - name: Start etcd
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: etcd
      svc_state: started

  - name: Start patroni0
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: patroni0
      svc_state: started

  - name: Start patroni1
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: patroni1
      svc_state: started

  - name: Start patroni2
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: patroni2
      svc_state: started

  - name: Copy haproxy.cfg
    copy:
      src: "{{ role_path }}/../../files/patroni_common/haproxy.cfg"
      dest: /etc/haproxy/haproxy.cfg
      owner: root
      group: root
      mode: 0644

  - name: Start haproxy
    include_tasks: "{{ role_path }}/../../tasks/start_haproxy_with_diagnostics.yml"
    vars:
      haproxy_cfg: /etc/haproxy/haproxy.cfg

  - name: Wait for the HA cluster to be reachable through haproxy
    include_tasks: "{{ role_path }}/../../tasks/wait_for_haproxy_backend.yml"
    vars:
      haproxy_port: 5000

  - name: Start pgpool service
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: pgpool
      svc_state: started
    when: ansible_os_family == "RedHat"

  - name: Start pgpool service
    include_tasks: "{{ role_path }}/../../tasks/start_service_with_diagnostics.yml"
    vars:
      svc_name: percona-pgpool2
      svc_state: started
    when: ansible_os_family == "Debian"

  - name: Add user postgres to sudoers
    user:
      name: postgres
      groups: sudo
      append: yes
    when: ansible_os_family == "Debian"

  - name: Pause for 1 minutes
    ansible.builtin.pause:
      minutes: 1