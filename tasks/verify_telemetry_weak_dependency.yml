---
# PG-2615: percona-pg-telemetry is now a weak dependency (Recommends/Suggests)
# of the PG server package, specifically so that users who have concerns can
# opt out of installing it. This exercises that opt-out path end to end:
# remove percona-pg-telemetry, reinstall the server package with weak
# dependencies disabled, and confirm it does NOT get pulled back in.
#
# Only applicable to versions that ship the PG-2615 packaging (ppg-14.24,
# ppg-15.19, ppg-16.15, ppg-17.11, ppg-18.5 and later) — older minors still
# hard-depend on percona-telemetry-agent and have no weak dependency to opt
# out of. Callers must gate the include on `weak_dependency_expected` (set by
# tasks/verify_telemetry.yml, which is assumed to have already run in this
# play so percona-pg-telemetry is currently installed via the default
# recommends-on install). This restores that default state again at the end
# so later tasks in the play see the same package set a normal install would
# produce.

- name: Setting facts so that they will be persisted in the fact cache
  ansible.builtin.set_fact:
    pg_version_to_install: "{{ lookup('env', 'VERSION') | regex_replace('^(?:ppg|psp)-','') }}"

- name: Extract major version
  ansible.builtin.set_fact:
    major_version: "{{ pg_version_to_install.split('.')[0] }}"

- name: Set service name based on the operating system
  set_fact:
    postgresql_service_name: "{{ 'postgresql-' + major_version if ansible_facts['os_family'] == 'RedHat' else 'postgresql' }}"

- name: Set package names based on the major version and OS
  set_fact:
    telemetry_package_name: "percona-pg-telemetry{{ major_version }}"
    server_package_name: "{{ 'percona-postgresql' + major_version + '-server' if ansible_facts['os_family'] == 'RedHat' else 'percona-postgresql-' + major_version }}"

- name: Set PostgreSQL configuration file path based on the operating system
  set_fact:
    postgresql_conf_path: "{{ '/var/lib/pgsql/' + major_version + '/data/postgresql.conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/postgresql/' + major_version + '/main/postgresql.conf' }}"

# If percona_pg_telemetry is configured in shared_preload_libraries (e.g. by
# install_ppgNN_tools.yml earlier in this same play), removing the package
# below would delete the .so file postgres is configured to preload -- ANY
# subsequent restart (ours, or the RPM's own %postun `systemctl try-restart`
# scriptlet on the reinstall further down) would then fatally fail with
# "could not access file "percona_pg_telemetry": No such file or directory".
# Confirmed against a real RHEL9 VM: removing the package while it's still
# preloaded reproduces exactly this crash. Strip it out and restart *before*
# touching the package, and restore it (with another restart) at the end.
- name: Capture the current shared_preload_libraries line, if any
  ansible.builtin.command:
    cmd: grep -E '^shared_preload_libraries\s*=' "{{ postgresql_conf_path }}"
  register: shared_preload_line
  changed_when: false
  failed_when: false
  become: true

- name: Determine whether "{{ telemetry_package_name }}" is preloaded
  ansible.builtin.set_fact:
    telemetry_is_preloaded: "{{ shared_preload_line.rc == 0 and 'percona_pg_telemetry' in shared_preload_line.stdout }}"

- name: Temporarily drop percona_pg_telemetry from shared_preload_libraries
  when: telemetry_is_preloaded
  become: true
  block:
    - name: Strip percona_pg_telemetry out of shared_preload_libraries
      ansible.builtin.replace:
        path: "{{ postgresql_conf_path }}"
        regexp: 'percona_pg_telemetry,?\s*|,\s*percona_pg_telemetry'
        replace: ""

    - name: Restart "{{ postgresql_service_name }}" without percona_pg_telemetry preloaded
      ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
      vars:
        svc_name: "{{ postgresql_service_name }}"
        svc_state: restarted

- name: Remove "{{ telemetry_package_name }}" so we can test opting back out at install time
  ansible.builtin.package:
    name: "{{ telemetry_package_name }}"
    state: absent
  become: true

- name: Confirm "{{ server_package_name }}" survives removing "{{ telemetry_package_name }}"
  ansible.builtin.command:
    cmd: "{{ 'rpm -q ' ~ server_package_name if ansible_facts['os_family'] == 'RedHat' else 'dpkg -s ' ~ server_package_name }}"
  register: server_after_removal
  changed_when: false

- name: Fail if "{{ server_package_name }}" was removed along with "{{ telemetry_package_name }}"
  ansible.builtin.fail:
    msg: "{{ server_package_name }} should not be affected by removing {{ telemetry_package_name }}."
  when: server_after_removal.rc != 0

- name: Reinstall "{{ server_package_name }}" with weak dependencies disabled (RedHat)
  ansible.builtin.command:
    cmd: "dnf reinstall -y --setopt=install_weak_deps=False {{ server_package_name }}"
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Reinstall "{{ server_package_name }}" with weak dependencies disabled (Debian)
  ansible.builtin.command:
    cmd: "apt-get install --reinstall -y --no-install-recommends {{ server_package_name }}"
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ansible_facts['os_family'] == 'Debian'

- name: Check whether "{{ telemetry_package_name }}" is installed on RedHat
  ansible.builtin.command:
    cmd: rpm -q "{{ telemetry_package_name }}"
  register: telemetry_after_optout_rpm
  ignore_errors: true
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Check whether "{{ telemetry_package_name }}" is installed on Debian/Ubuntu
  # dpkg -l | grep would also match a package removed-but-not-purged (status
  # "rc"), which apt-get remove (not purge) leaves behind -- query ${Status}
  # directly so only a genuinely-installed "ok installed" counts.
  ansible.builtin.shell: dpkg-query -W -f='${Status}\n' "{{ telemetry_package_name }}" 2>/dev/null | grep "ok installed"
  register: telemetry_after_optout_deb
  ignore_errors: true
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Normalize "{{ telemetry_package_name }}" post-opt-out status across OS families
  ansible.builtin.set_fact:
    telemetry_after_optout: "{{ telemetry_after_optout_rpm if ansible_facts['os_family'] == 'RedHat' else telemetry_after_optout_deb }}"

# Print the actual package specs unconditionally (not just in a fail
# message) so a CI log always shows exactly what was checked, whether this
# passes or fails -- this is the data that would have made the Debian
# "rc" vs "ii" detection bug immediately obvious without needing to
# reproduce it separately.
- name: Get "{{ server_package_name }}" Requires after the reinstall (RedHat)
  ansible.builtin.command:
    cmd: rpm -q --requires "{{ server_package_name }}"
  register: server_requires_after_optout
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Get "{{ server_package_name }}" Recommends after the reinstall (RedHat)
  ansible.builtin.command:
    cmd: rpm -q --recommends "{{ server_package_name }}"
  register: server_recommends_after_optout
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Get "{{ server_package_name }}" Depends after the reinstall (Debian)
  ansible.builtin.shell: dpkg-query -W -f='${Depends}\n' "{{ server_package_name }}"
  register: server_depends_after_optout
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Get "{{ server_package_name }}" Recommends after the reinstall (Debian)
  ansible.builtin.shell: dpkg-query -W -f='${Recommends}\n' "{{ server_package_name }}"
  register: server_recommends_after_optout_deb
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'

- name: Print "{{ telemetry_package_name }}"/"{{ server_package_name }}" specs after the reinstall (RedHat)
  ansible.builtin.debug:
    msg:
      "{{ telemetry_package_name }} (rpm -q)": "{{ telemetry_after_optout.stdout | default('not installed') }}"
      "{{ server_package_name }} Requires": "{{ server_requires_after_optout.stdout_lines }}"
      "{{ server_package_name }} Recommends": "{{ server_recommends_after_optout.stdout_lines }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Print "{{ telemetry_package_name }}"/"{{ server_package_name }}" specs after the reinstall (Debian)
  ansible.builtin.debug:
    msg:
      "{{ telemetry_package_name }} (dpkg-query Status)": "{{ telemetry_after_optout.stdout | default('not installed') }}"
      "{{ server_package_name }} Depends": "{{ server_depends_after_optout.stdout }}"
      "{{ server_package_name }} Recommends": "{{ server_recommends_after_optout_deb.stdout }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Fail if opting out of weak dependencies still installed "{{ telemetry_package_name }}"
  ansible.builtin.fail:
    msg: >-
      {{ telemetry_package_name }} got reinstalled even though weak
      dependencies were explicitly disabled while reinstalling
      {{ server_package_name }}. It is no longer being treated as a weak
      dependency.
  when: telemetry_after_optout.rc == 0

- name: Print confirmation that opting out of the weak dependency works
  ansible.builtin.debug:
    msg: >-
      {{ telemetry_package_name }} was correctly skipped when installing
      {{ server_package_name }} with weak dependencies disabled.

- name: Confirm "{{ postgresql_service_name }}" is still running after the reinstall
  # Reinstalling the server package can itself trigger a service
  # restart via the RPM's own %postun scriptlet (systemctl try-restart on
  # upgrade paths, which `dnf reinstall` goes through) -- if that in-package
  # restart fails, dump journalctl + postgres logs here instead of the bare
  # "control process exited" message with no detail.
  ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
  vars:
    svc_name: "{{ postgresql_service_name }}"
    svc_state: started

# Restore the default (recommends-on) install so the rest of the suite sees
# the same package set a normal install would produce.
- name: Reinstall "{{ telemetry_package_name }}" to restore the default install state (RedHat)
  ansible.builtin.command:
    cmd: "dnf install -y {{ telemetry_package_name }}"
  become: true
  when: ansible_facts['os_family'] == 'RedHat'

- name: Reinstall "{{ telemetry_package_name }}" to restore the default install state (Debian)
  ansible.builtin.apt:
    name: "{{ telemetry_package_name }}"
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Confirm "{{ telemetry_package_name }}" is back after restoring the default install state
  ansible.builtin.package_facts:
    manager: auto

- name: Fail if "{{ telemetry_package_name }}" was not restored
  ansible.builtin.fail:
    msg: "{{ telemetry_package_name }} was not reinstalled after the opt-out test."
  when: telemetry_package_name not in ansible_facts.packages

- name: Restore percona_pg_telemetry in shared_preload_libraries
  when: telemetry_is_preloaded
  become: true
  block:
    - name: Restore the original shared_preload_libraries line
      ansible.builtin.lineinfile:
        path: "{{ postgresql_conf_path }}"
        regexp: '^shared_preload_libraries\s*='
        line: "{{ shared_preload_line.stdout }}"

    - name: Restart "{{ postgresql_service_name }}" with percona_pg_telemetry preloaded again
      ansible.builtin.include_tasks: "{{ role_path }}/../../tasks/start_postgres_with_diagnostics.yml"
      vars:
        svc_name: "{{ postgresql_service_name }}"
        svc_state: restarted
