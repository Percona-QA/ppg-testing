---
# image catalog for the libvirt backend.
# key = value of the ami_* env vars in local/env.sh.
# ssh_user is the cloud image default user (differs from the AMI ssh_user
# in molecule.yml, which the libvirt backend ignores on purpose).
# checksum is either a pinned hash or a checksum-file url (get_url looks the
# image filename up in it). debian/ubuntu/rocky publish latest/current images
# that get rebuilt upstream, so they point at the checksum file next to the
# image and follow rotations. ol urls are versioned and immutable, their
# hashes are pinned from the html table at yum.oracle.com/oracle-linux-templates.html.
debian-12:
  url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
  checksum: "sha512:https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS"
  ssh_user: debian
