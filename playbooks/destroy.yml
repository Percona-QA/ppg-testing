---
- name: Destroy
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ not (lookup('env', 'MOLECULE_DEBUG') | bool or molecule_yml.provisioner.log|default(false) | bool) }}"
  vars:
    backend_driver: "{{ lookup('env', 'driver') }}"
  tasks:
    - name: Check driver selection
      fail:
        msg: "driver env var must be ec2, delegated or default, got '{{ backend_driver }}'. Source local/env.sh or the CI env first."
      when: backend_driver not in ['ec2', 'delegated', 'default']

    - name: Destroy instances on AWS
      include_tasks: aws/destroy_tasks.yml
      when: backend_driver == 'ec2'
      vars:
        # See playbooks/create.yml for why: raises the default ~5-attempt botocore
        # retry budget so terminate calls survive RequestLimitExceeded throttling
        # when many molecule pipelines tear down in parallel against the same account.
        aws_retry_config:
          retries:
            mode: adaptive
            max_attempts: 15

    - name: Destroy instances on libvirt
      include_tasks: libvirt/destroy_tasks.yml
      when: backend_driver in ['delegated', 'default']
