---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  no_log: "{{ not (lookup('env', 'MOLECULE_DEBUG') | bool or molecule_yml.provisioner.log|default(false) | bool) }}"
  vars:
    backend_driver: "{{ lookup('env', 'driver') }}"
  tasks:
    - name: Check driver selection
      fail:
        msg: "driver env var must be ec2, delegated or default, got '{{ backend_driver }}'. Source local/env.sh or the CI env first."
      when: backend_driver not in ['ec2', 'delegated', 'default']

    - name: Create instances on AWS
      include_tasks: aws/create_tasks.yml
      when: backend_driver == 'ec2'
      vars:
        ssh_user: ubuntu
        ssh_port: 22
        default_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('us-east-1', true) }}"
        security_group_name_prefix: molecule
        security_group_description: Security group for testing Molecule
        security_group_rules:
          - proto: tcp
            from_port: "{{ ssh_port }}"
            to_port: "{{ ssh_port }}"
            cidr_ip: '0.0.0.0/0'
          - proto: icmp
            from_port: 8
            to_port: -1
            cidr_ip: '0.0.0.0/0'
        security_group_rules_egress:
          - proto: -1
            from_port: 0
            to_port: 0
            cidr_ip: '0.0.0.0/0'
        keypair_name: "molecule-pkg-tests"
        keypair_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ssh_key"
        # Every ec2_instance/ec2_security_group/ec2_vpc_subnet_info call in the
        # aws tasks makes its own DescribeSecurityGroups/DescribeSubnets lookup
        # internally, and those calls use the client's plain botocore retry policy
        # (not AWSRetry), which gives up after ~5 attempts. With many molecule
        # pipelines launching in parallel against the same AWS account, that
        # budget is exhausted by RequestLimitExceeded before backoff has a chance
        # to help. Raise it and use adaptive mode's client-side rate limiting.
        aws_retry_config:
          retries:
            mode: adaptive
            max_attempts: 15
        # All known AZ subnets, so a capacity-driven fallback (see aws/create_instance_retry.yml)
        # always has a subnet_dict entry and pre-created security group to launch into,
        # regardless of which one a platform originally pinned.
        az_fallback_subnet_ids: "{{ [
            lookup('env', 'vpc_subnet_id_aws1'),
            lookup('env', 'vpc_subnet_id_aws2'),
            lookup('env', 'vpc_subnet_id_aws3')
          ] | select | unique | list }}"

    - name: Create instances on libvirt
      include_tasks: libvirt/create_tasks.yml
      when: backend_driver in ['delegated', 'default']
