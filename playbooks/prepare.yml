---
- name: Prepare node for running tests
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true
  tasks:
    # Rocky's default baseos/appstream/crb repos resolve mirrors through the
    # mirrorlist service, which is unreliable on Rocky 10 (esp. aarch64) and
    # fails with "No URLs in mirrorlist". Pin them to the canonical CDN baseurl
    # (dl.rockylinux.org) before any dnf cache refresh so we never depend on it.
    - name: Pin Rocky repos to dl.rockylinux.org baseurl (mirrorlist is unreliable on Rocky 10)
      become: true
      ansible.builtin.shell: |
        sed -i \
          -e 's|^mirrorlist=|#mirrorlist=|g' \
          -e 's|^#\s*baseurl=https\?://dl.rockylinux.org|baseurl=https://dl.rockylinux.org|g' \
          /etc/yum.repos.d/rocky*.repo
        dnf clean all
        dnf makecache
      args:
        executable: /bin/bash
      register: rocky_repo_pin
      retries: 5
      delay: 10
      until: rocky_repo_pin is succeeded
      when: ansible_distribution == "Rocky"

    - name: setup ca-certificates release
      yum:
        name: ca-certificates
        update_cache: yes
        state: present
      when: ansible_os_family == "RedHat"
      register: ca_certs_setup
      retries: 5
      delay: 10
      until: ca_certs_setup is succeeded

    - name: Enable epel-release on Rhel8 systems using Fedora epel rpm
      become: true
      command: dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "8"
      register: epel8
      retries: 5
      delay: 10
      until: epel8 is succeeded

    - name: Enable epel-release on Rhel9 systems using Fedora epel rpm
      become: true
      command: dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "9"
      register: epel9
      retries: 5
      delay: 10
      until: epel9 is succeeded

    - name: Enable epel-release on Rhel10 systems using Fedora epel rpm
      become: true
      command: dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"
      register: epel10
      retries: 5
      delay: 10
      until: epel10 is succeeded

    - name: Disable subscription message on RHEL OS
      become: true
      command: sudo sed -i 's/enabled[ ]*=[ ]*1/enabled=0/g' /etc/dnf/plugins/subscription-manager.conf
      when: ansible_os_family == "RedHat" and ansible_distribution == "RedHat"

    - name: setup epel release
      yum:
        name: epel-release
        update_cache: yes
        state: present
      when: ansible_os_family == "RedHat" and ansible_distribution != "RedHat"
      register: epel_setup
      retries: 5
      delay: 10
      until: epel_setup is succeeded

    # Debian 11 (bullseye) is fully EOL now -- deb.debian.org and
    # security.debian.org have stopped serving its packages entirely (404,
    # confirmed on a live node). Non-security packages have moved to
    # archive.debian.org, but as of this writing bullseye-security itself
    # hasn't been archived there yet either (archive.debian.org/debian-security
    # only has entries up to buster) -- so the security suite line is simply
    # dropped rather than rewritten to a still-404ing path. This means the
    # base "bullseye"/"bullseye-updates" suites' package versions are used
    # instead of their (now completely unreachable) security-patched
    # counterparts, which is the best available outcome for an EOL release.
    - name: Update /etc/apt/sources.list on Debian 11
      become: true
      command: sudo sed -i -e 's/cdn-aws\.deb/archive/g' -e 's/deb\.debian\.org/archive.debian.org/g' -e '/security\.debian\.org/d' /etc/apt/sources.list
      when: ansible_os_family == "Debian" and ansible_distribution_major_version == "11"

    # archive.debian.org is a frozen snapshot, so its Release files carry a
    # Valid-Until timestamp from whenever bullseye was archived. Not observed
    # to actually block anything as of this writing, but kept as a defensive
    # measure since that timestamp only gets further in the past over time.
    - name: Disable apt Release-file expiry check on Debian 11 (archive.debian.org snapshots are frozen)
      become: true
      copy:
        dest: /etc/apt/apt.conf.d/99no-check-valid-until
        content: |
          Acquire::Check-Valid-Until "false";
        mode: '0644'
      when: ansible_os_family == "Debian" and ansible_distribution_major_version == "11"

    # Some AMI builds bake in packages (observed: gpgv, perl-base) at a
    # security-patched version newer than anything the now-security-suite-less
    # archive offers, which blocks installing anything that depends on the
    # older version (e.g. gnupg needs gpgv < the installed version). apt
    # never downgrades an already-installed package on its own, even with
    # --allow-downgrades, unless told exactly which package+version -- so
    # detect precisely which packages the target install actually needs
    # downgraded (via a dry run) and fix only those, rather than a blanket
    # downgrade of anything with a newer-than-archived version (far too broad
    # -- that set includes systemd, dpkg, openssh-server, the kernel image,
    # grub, etc., none of which this task has any business touching).
    - name: Downgrade any package blocking the Debian 11 test-tooling install (archive.debian.org no longer has security-patched versions)
      become: true
      ansible.builtin.shell: |
        set -uo pipefail
        SIM_LOG=$(mktemp)
        apt-get -y -s install {{ packages | join(' ') }} > "${SIM_LOG}" 2>&1 || true
        BLOCKING=$(grep 'Depends:' "${SIM_LOG}" | awk '{print $4}' | sort -u)
        for pkg in ${BLOCKING}; do
          avail=$(apt list -a "${pkg}" 2>/dev/null | awk -F'[ /]' '!/^Listing/ && !/\/now / && NF>1 {print $3; exit}')
          if [ -n "${avail}" ]; then
            echo "Downgrading ${pkg} to ${avail} (blocks installing: {{ packages | join(' ') }})"
            apt-get -y --allow-downgrades install "${pkg}=${avail}"
          fi
        done
        rm -f "${SIM_LOG}"
      args:
        executable: /bin/bash
      vars:
        packages:
          - unzip
          - wget
          - gnupg
          - gnupg2
          - rsync
          - acl
          - git
      when: ansible_os_family == "Debian" and ansible_distribution_major_version == "11"

    - name: install needed packages for running tests with apt
      apt:
        name: "{{ packages }}"
        update_cache: yes
        state: latest
      vars:
        packages:
          - unzip
          - wget
          - gnupg
          - gnupg2
          - rsync
          - acl
          - git
      retries: 60
      delay: 10
      register: result
      until: result is not failed
      when: ansible_os_family == "Debian"

    - name: update systemd-sysv integration on debian/ubuntu
      apt:
        name: "{{ packages }}"
        update_cache: yes
        state: latest
      vars:
        packages:
        - systemd-sysv
      # Same dpkg-lock race as the apt task above: cloud-init/unattended-upgrades
      # can still be running apt-get in the background right after boot.
      retries: 60
      delay: 10
      register: systemd_sysv_result
      until: systemd_sysv_result is not failed
      when: ansible_os_family == "Debian"

    - name: install needed packages for running tests with yum
      yum:
        name: "{{ packages }}"
        state: latest
      vars:
        packages:
          - pv
          - libselinux-python
          - unzip
          - wget
          - rsync
          - git-all
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version|int <= 7

    - name: install needed packages for running tests with yum on RHEL8
      yum:
        name: "{{ packages }}"
        state: latest
      vars:
        packages:
        - unzip
        - wget
        - git-all
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version|int == 8

    - name: Update RedHat-family systems to latest
      become: true
      # --nobest: tolerate transient RHUI repo skew where a package and its
      # version-locked subpackage (e.g. glibc vs glibc-gconv-extra) are
      # published out of sync. Falls back to the largest consistent version
      # set instead of failing on a "best" candidate that has no partner.
      ansible.builtin.shell: dnf update -y --nobest
      when: ansible_os_family == "RedHat"

    - name: Enable Powertools on Rocky 8
      become: true
      shell: | 
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled powertools
      when: ansible_distribution == "Rocky" and ansible_distribution_major_version == "8"

    - name: Enable CRB on rocky linux 9 and 10
      become: true
      shell: | 
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled crb
      when: ansible_os_family == "RedHat" and ansible_distribution == "Rocky" and
        (ansible_distribution_major_version == "9" or ansible_distribution_major_version == "10")

    - name: Enable ol8_codeready_builder on Oracle Linux 8
      become: true
      shell: | 
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled ol8_codeready_builder
      when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version == "8"

    - name: Enable ol9_codeready_builder on Oracle Linux 9
      become: true
      shell: |
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled ol9_codeready_builder
      when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version == "9"

    - name: Enable ol10_codeready_builder on Oracle Linux 10
      become: true
      shell: |
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled ol10_codeready_builder
      when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version == "10"

    - name: Enable codeready-builder for RHEL 8
      become: true
      shell: | 
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled codeready-builder-for-rhel-8-rhui-rpms
      when: ansible_os_family == "RedHat" and ansible_distribution == "RedHat" and ansible_distribution_major_version == "8"

    - name: Enable codeready-builder for RHEL 9
      become: true
      shell: | 
        dnf install -y dnf-plugins-core
        dnf config-manager --set-enabled codeready-builder-for-rhel-9-rhui-rpms
      when: ansible_os_family == "RedHat" and ansible_distribution == "RedHat" and ansible_distribution_major_version == "9"

    - name: Enable CodeReady Builder on RHEL 10
      become: true
      block:
        - name: Install dnf plugins
          ansible.builtin.dnf:
            name: dnf-plugins-core
            state: present

        - name: Enable CodeReady Builder repo
          ansible.builtin.command:
            cmd: dnf config-manager --set-enabled codeready-builder-for-rhel-10-rhui-rpms
      when:
        - ansible_distribution == "RedHat"
        - ansible_distribution_major_version | int == 10

    - name: install acl package on rhel 10
      become: true
      command:  sudo dnf install -y acl
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

    - name: Setup oracle linux 9 for ssh
      become: true
      shell: | 
        setenforce 0
        firewall-cmd --permanent --add-service=ssh
        firewall-cmd --reload
        systemctl enable sshd
        systemctl start sshd
      when: ansible_distribution == "OracleLinux" and ansible_distribution_major_version == "9"

    - name: Install additional packages RPM
      yum:
        name: "{{ packages }}"
        state: latest
        update_cache: yes
      vars:
        packages:
          - openssl-devel
          - readline-devel
          - openssl
          - gcc
          - gcc-c++
          - libevent-devel
          - perl-Pod-Checker
          - perl-devel
          - perl-JSON-XS
          - perl-Test-Simple
          - perl-IPC-Run
          - libtool
          - make
          - pandoc
          - pkgconfig
      when: ansible_os_family == "RedHat"

    # - name: Install additional packages RPM
    #   yum:
    #     name: "{{ packages }}"
    #     state: latest
    #     update_cache: yes
    #   vars:
    #     packages:
    #       - openssl-devel
    #       - readline-devel
    #       - openssl
    #       - gcc
    #       - gcc-c++
    #       - libevent-devel
    #       - perl-Pod-Checker
    #       - perl-devel
    #       - perl-JSON-XS
    #       - perl-Test-Simple
    #       - libtool
    #       - make
    #       - pandoc
    #       - pkgconfig
    #   when: ansible_os_family == "RedHat"

    # - name: Install Perl JSON module for EL10+
    #   yum:
    #     name: perl-JSON
    #     state: present
    #   when:
    #     - ansible_os_family == "RedHat"
    #     - ansible_distribution_major_version|int >= 10

    # - name: Install Perl JSON::XS for EL7–9
    #   yum:
    #     name: perl-JSON-XS
    #     state: present
    #   when:
    #     - ansible_os_family == "RedHat"
    #     - ansible_distribution_major_version|int < 10

    - name: Install additional packages Debian
      apt:
        name: "{{ packages }}"
        state: latest
        update_cache: yes
      vars:
        packages:
          - libtool
          - libevent-dev
          - m4
          - automake
          - pkg-config
          - libssl-dev
          - libreadline-dev
          - build-essential
          - pandoc
      when: ansible_os_family == "Debian"

    - name: Setup SSH keys RedHat
      ansible.posix.authorized_key:
        user: ec2-user
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "RedHat"

    - name: Setup SSH keys for Oracle Linux or Amazon
      ansible.posix.authorized_key:
        user: ec2-user
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "OracleLinux"

    - name: Setup SSH keys for Rocky Linux or Amazon
      ansible.posix.authorized_key:
        user: rocky
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Rocky"

    - name: Setup SSH keys Debian
      ansible.posix.authorized_key:
        user: admin
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Debian"

    - name: Setup SSH keys Ubuntu
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ lookup('file', 'public_keys') }}"
        state: present
        exclusive: False
      when: ansible_distribution == "Ubuntu"
