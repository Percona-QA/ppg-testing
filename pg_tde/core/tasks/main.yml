---
  - name: Set Base Facts
    set_fact:
      major_version: "{{ lookup('env','VERSION') | regex_replace('ppg-(\\d+).*','\\1') }}"
      install_from_packages: "{{ lookup('env', 'INSTALL_FROM_PACKAGES') | default('false') | bool }}"
      full_version: "{{ lookup('env','VERSION') | regex_replace('ppg-','') }}"

      # Convert "true"/"false" strings to actual Booleans
      build_from_source: "{{ lookup('env', 'BUILD_FROM_SOURCE') | default('false') | bool }}"

      # Direct mappings
      io_method: "{{ lookup('env', 'IO_METHOD') | default('worker') }}"
      psp_repo: "{{ lookup('env', 'PSP_REPO') }}"
      psp_branch: "{{ lookup('env', 'PSP_BRANCH') }}"
      tde_repo: "{{ lookup('env', 'TDE_REPO') }}"
      tde_branch: "{{ lookup('env', 'TDE_BRANCH') }}"
      # Which package source to install PSP/pg_tde from when install_from_packages
      # is set. 'percona-release' drives ../../../../tasks/enable_repo.yml
      # (REPO=testing/release/experimental). 'obs' drives enable_obs_repo.yml
      # (OBS_CHANNEL=devel/staging/release — the semantic equivalents of
      # REPO's experimental/testing/release tiers).
      package_source: "{{ lookup('env', 'PACKAGE_SOURCE') | default('percona-release') }}"
      obs_channel: "{{ lookup('env', 'OBS_CHANNEL') | default('devel') }}"
      # percona-qa/postgresql/pytest sections to skip by default: upgrade
      # coverage lives in the dedicated upgrade role, vault/kmip need external
      # key-provider services this role doesn't set up, and slow tests don't
      # belong in the core regression pass. Override via PYTEST_SKIP_SECTIONS.
      pytest_skip_sections: "{{ lookup('env', 'PYTEST_SKIP_SECTIONS') | default('upgrade,minor_upgrade,slow,vault,kmip,openbao', true) }}"
      # 'Sanity' (default — preserves prior behavior for callers not yet
      # passing TEST_SUITE): pytest_skip_sections applies, external key
      # providers are not set up — same as every run to date. 'All': every
      # test case runs, including slow/vault/kmip/openbao — pytest_skip_sections
      # is ignored and setup_test_env.sh installs Cosmian KMS + OpenBao so
      # those sections actually exercise something instead of self-skipping.
      # Note even in 'All', upgrade/minor_upgrade tests still self-skip: they
      # need --old-install-dir, which this role (unlike the dedicated upgrade
      # role) doesn't provision.
      test_suite: "{{ lookup('env', 'TEST_SUITE') | default('Sanity', true) }}"
      # Opt-in pytest-xdist parallelism (pytest -n <N>). Empty/unset = serial
      # (unchanged default behavior). The suite's own run_tests.sh already
      # exposes --workers N -> -n N, so this isn't new territory for the
      # suite itself — but conftest.py's allocate_port() uses a module-level
      # counter + lock that's process-local, giving no cross-process
      # coordination between xdist workers (each worker is a separate
      # process). The bind-check before returning a port gives reasonable,
      # not airtight, collision protection under concurrent workers.
      # Validated clean on multiple live "All" + 4-worker runs, so this is
      # now the default. default(_, true) also treats an unset/empty env
      # var the same way (lookup('env', ...) returns '' when unset, which
      # a bare default() would NOT replace). Pass PYTEST_WORKERS=0 to
      # disable xdist distribution and run serially.
      pytest_workers: "{{ lookup('env', 'PYTEST_WORKERS') | default('4', true) }}"
      # ... include other env lookups here ...
      go_version: "1.25.6"
      go_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
      artifact_filename: "tde-core-{{ lookup('env','VERSION') }}-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-build{{ lookup('env','BUILD_NUMBER') }}.tar.gz"
      cacheable: true

  - name: End play on Ubuntu 26 if PostgreSQL version is not supported
    meta: end_host
    vars:
      ubuntu26_min_versions:
        '14': '14.23'
        '15': '15.18'
        '16': '16.14'
        '17': '17.10'
        '18': '18.4'
      pg_major: "{{ full_version | string | split('.') | first }}"
      min_ver: "{{ ubuntu26_min_versions[pg_major] | default('0.0') }}"
    when:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "26"
      - min_ver != '0.0'
      - full_version | string is version(min_ver, '<', strict=True)

  # Kept outside the block below (which owns artifact collection via its
  # always:) since this is a deliberate "this platform combo isn't tested"
  # short-circuit, not a failure — no artifact is expected for it, and
  # meta: end_play's interaction with an enclosing block's rescue/always is
  # inconsistent across Ansible versions, so it's safest run before entering
  # that block at all. Only depends on facts already set above.
  - name: End play on RHEL 8 and Rocky 8 for pg-18>= and io_uring, as uring not supported
    meta: end_play
    when:
      - (major_version | int) >= 18
      - io_method in ['io_uring']
      - >
        (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'Rocky' and ansible_facts['distribution_major_version'] | int == 8)
        or
        (ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] == 'RedHat' and ansible_facts['distribution_major_version'] | int == 8)

  # ====================================================================
  # Everything below — setup, build/install, and the pytest run itself —
  # is wrapped in one block so a failure ANYWHERE (not just a pytest test
  # failure) still collects and uploads a debug artifact to Jenkins via
  # always:. Before this wrapper existed, a hard failure in an early setup
  # step (Docker/Cosmian bring-up, package install, build_from_source,
  # setup_test_env.sh, ...) aborted the play for that host immediately —
  # skipping the packaging/fetch tasks entirely, so Jenkins showed nothing
  # for that platform even though it had genuinely failed.
  # ====================================================================
  - name: Run pg_tde core setup, build, and pytest suite
    block:
      - name: Set Dependent Facts
        set_fact:
          # Now that go_version is saved, we can use it here
          go_tarball: "go{{ go_version }}.linux-{{ go_arch }}"
          go_download_url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_arch }}.tar.gz"
          go_install_dir: "/usr/local"
          cacheable: true

      - name: Set PostgreSQL config path for Debian/Ubuntu
        set_fact:
          pg_conf: "/etc/postgresql/{{ major_version }}/main/postgresql.conf"
          pg_config_path: "/usr/lib/postgresql/{{ major_version }}/bin/pg_config"
          pg_bin_dir: "/usr/lib/postgresql/{{ major_version }}/bin"
          pg_lib_dir: "/usr/lib/postgresql/{{ major_version }}/lib"
          pg_install_dir: "/usr/lib/postgresql/{{ major_version }}"
        when: ansible_os_family == "Debian" and install_from_packages

      - name: Set PostgreSQL config path for RHEL/CentOS/Rocky
        set_fact:
          pg_conf: "/var/lib/pgsql/{{ major_version }}/data/postgresql.conf"
          pg_config_path: "/usr/pgsql-{{ major_version }}/bin/pg_config"
          pg_bin_dir: "/usr/pgsql-{{ major_version }}/bin"
          pg_lib_dir: "/usr/pgsql-{{ major_version }}/lib"
          pg_install_dir: "/usr/pgsql-{{ major_version }}"
        when: ansible_os_family == "RedHat" and install_from_packages

      - name: Set PostgreSQL config path for build from sources
        set_fact:
          pg_conf: "/opt/pgsql/data/postgresql.conf"
          pg_config_path: "/opt/pgsql/bin/pg_config"
          pg_bin_dir: "/opt/pgsql/bin"
          pg_lib_dir: "/opt/pgsql/lib"
          pg_install_dir: "/opt/pgsql"
        when: not install_from_packages

      # On Debian 13 / Ubuntu 26 systemd mounts /tmp as a RAM-backed tmpfs (~16 GB,
      # half of RAM). The test framework runs in /tmp/pgtest and the suite needs
      # more than that on those distros, so /tmp fills (ENOSPC) and the host dies
      # before packaging — even though the 100 GB root disk is ~85% free. Redirect
      # /tmp onto the root disk (bind mount) where it is tmpfs, before the build or
      # tests write anything there. Only acts where /tmp is actually tmpfs.
      - name: Move /tmp off tmpfs onto the root disk where applicable
        become: true
        ansible.builtin.shell: |
          set -e
          if findmnt -no FSTYPE /tmp 2>/dev/null | grep -qx tmpfs; then
            mkdir -p /var/tmp/disktmp
            chmod 1777 /var/tmp/disktmp
            mount --bind /var/tmp/disktmp /tmp
            echo "REDIRECTED /tmp -> /var/tmp/disktmp (was tmpfs)"
          else
            echo "/tmp is not tmpfs; no change"
          fi
        register: tmp_redirect
        changed_when: "'REDIRECTED' in tmp_redirect.stdout"

      - name: Show /tmp redirect result
        ansible.builtin.debug:
          var: tmp_redirect.stdout

      - name: Configure repository (percona-release)
        ansible.builtin.include_tasks: ../../../../tasks/enable_repo.yml
        when: install_from_packages and package_source == 'percona-release'

      - name: Configure repository (OBS)
        ansible.builtin.include_tasks: enable_obs_repo.yml
        when: install_from_packages and package_source == 'obs'

      - name: Include Redhat tasks file
        include_tasks:
          file: "redhat_tasks.yml"
        when: ansible_os_family == 'RedHat'

      - name: Include Debian tasks file
        include_tasks:
          file: "debian_tasks.yml"
        when: ansible_os_family == 'Debian'

      # Docker is required on all platforms — the pytest suite uses it for KMIP
      # and other key provider services at test runtime.
      - name: Include Docker setup file
        include_tasks:
          file: "install_docker.yml"

      - name: Verify Docker daemon is responsive
        become: true
        command: docker info
        register: docker_info
        retries: 3
        delay: 5
        until: docker_info.rc == 0

      # cosmian_kms is a Rust binary linked against glibc 2.33/2.34. RHEL8-family
      # (rhel8/rocky8/ol8) ships glibc 2.28, so the native binary exits
      # immediately with "GLIBC_2.3x not found" and crashes pytest_configure
      # (ensure_external_key_providers runs at collection time, before any test).
      # Only matters when TEST_SUITE=All actually starts kmip/vault/openbao —
      # otherwise external key providers are skipped entirely and this is a
      # no-op. Default cosmian_kmip_env to {} so the pytest run task's
      # environment stays unchanged when the Docker route isn't used.
      - name: Default Cosmian KMIP env (no-op unless Docker route runs)
        set_fact:
          cosmian_kmip_env: {}

      - name: Determine whether Cosmian KMS needs to run in Docker (RHEL8-family glibc mismatch)
        set_fact:
          cosmian_needs_docker: "{{ test_suite == 'All' and ansible_os_family == 'RedHat' and ansible_distribution_major_version == '8' }}"

      - name: Run Cosmian KMS in Docker (RHEL8-family only)
        include_tasks:
          file: "run_cosmian_docker.yml"
        when: cosmian_needs_docker

      # ansible_swaptotal_mb is gathered automatically (setup module) — no need
      # to shell out to swapon/parse its human-readable output (which was the
      # bug here before: `swapon --show=SIZE` prints "4G", not bytes, so the old
      # regex_findall/1048576 math always came out near-zero and re-ran mkswap
      # against an already-active swapfile on every subsequent converge of the
      # same host, failing with "swapfile is mounted; will not make swapspace").
      - name: Ensure at least 4 GB swap is configured
        become: true
        block:
          - name: Create 4G swap file if not present or too small
            ansible.builtin.command: fallocate -l 4G /swapfile
            args:
              creates: /swapfile
            when: ansible_swaptotal_mb < 3000

          - name: Secure swap file permissions
            ansible.builtin.file:
              path: /swapfile
              owner: root
              group: root
              mode: '0600'
            when: ansible_swaptotal_mb < 3000

          - name: Format swap file
            ansible.builtin.command: mkswap /swapfile
            when: ansible_swaptotal_mb < 3000

          - name: Enable swap
            ansible.builtin.command: swapon /swapfile
            when: ansible_swaptotal_mb < 3000

          - name: Persist swap in /etc/fstab
            ansible.builtin.lineinfile:
              path: /etc/fstab
              line: '/swapfile none swap sw 0 0'
              state: present
            when: ansible_swaptotal_mb < 3000

      - name: Set stack ulimit for a specific user
        become: true
        pam_limits:
          domain: postgres  # Replace with the target username
          limit_type: "-"         # Applies to both soft and hard limits
          limit_item: stack
          value: 102400            # Desired stack size in KB

      - name: Check if io_uring is disabled
        command: cat /proc/sys/kernel/io_uring_disabled
        register: uring_disabled
        ignore_errors: true
        when:
          - (major_version | int) >= 18
          - io_method in ['io_uring']
          - ansible_os_family == 'RedHat'

      - name: Enable io_uring if possible
        become: true
        sysctl:
          name: kernel.io_uring_disabled
          value: 0
          state: present
        when:
          - (major_version | int) >= 18
          - io_method in ['io_uring']
          - ansible_os_family == 'RedHat'
          - uring_disabled.stdout is defined
          - uring_disabled.stdout | int > 0

      - name: Ensure postgres user has unlimited core dump limit
        become: true
        community.general.pam_limits:
          domain: postgres
          limit_item: core
          limit_type: "{{ item }}"
          value: unlimited
        loop:
          - soft
          - hard

      - name: Install OS-specific prerequisites
        package:
          name:
            - curl
            - tar
          state: present

      # Needed for the pgbackrest-marked pytest tests (TestPgBackRest is always
      # included in Sanity; the full pgbackrest matrix runs under TEST_SUITE=All).
      # When install_from_packages is set, a Percona repo is already enabled by
      # this point (see "Configure repository (percona-release)" above), so use
      # the Percona-branded package. In build-from-source mode no Percona repo is
      # enabled, so fall back to the plain OS-packaged binary: Debian/Ubuntu ship
      # pgbackrest directly, RHEL family gets it via EPEL (already enabled by
      # redhat_tasks.yml above).
      - name: Install pgbackrest
        become: true
        package:
          name: "{{ 'percona-pgbackrest' if install_from_packages else 'pgbackrest' }}"
          state: present

      - name: Check if Go is already installed
        shell: "/usr/local/go/bin/go version | grep -q 'go{{ go_version }}'"
        register: go_exists
        ignore_errors: true
        changed_when: false

      - name: Installation Block
        when: go_exists.rc != 0
        block:
          - name: Download Go binary
            get_url:
              url: "{{ go_download_url }}"
              dest: "/tmp/{{ go_tarball }}"
              mode: '0644'

          - name: Remove old Go installation
            file:
              path: "{{ go_install_dir }}/go"
              state: absent

          - name: Extract Go tarball
            unarchive:
              src: "/tmp/{{ go_tarball }}"
              dest: "{{ go_install_dir }}"
              remote_src: yes

      - name: Add Go to system-wide PATH
        copy:
          dest: /etc/profile.d/golang.sh
          content: |
            export PATH=$PATH:/usr/local/go/bin
            export GOPATH=$HOME/go
            export PATH=$PATH:$GOPATH/bin
          mode: '0644'

      - name: Clean up tarball
        file:
          path: "/tmp/{{ go_tarball }}"
          state: absent

      # =================================================
      # Clone,Build and install, Postgres/PSP with pg_tde
      # =================================================

      - name: Build from sources, PSP and TDE
        include_tasks:
          file: "build_from_source.yml"
        when: not install_from_packages

      # =================================================
      # Install from packages, both Postgres/PSP and pg_tde
      # =================================================

      - name: Install on RHEL
        include_tasks:
          file: "install_from_packages_rhel.yml"
        when: install_from_packages and ansible_os_family == 'RedHat'

      - name: Install on Debian
        include_tasks:
          file: "install_from_packages_deb.yml"
        when: install_from_packages and ansible_os_family == 'Debian'

      # =============================
      # Deploy the pg_tde pytest suite
      # =============================
      # Vendored under files/pytest/ (copied from percona-qa's postgresql/pytest,
      # py_framework branch) so this role no longer depends on a separate
      # percona-qa clone/branch at test time.

      - name: Deploy pg_tde pytest suite
        copy:
          src: ../files/pytest/
          dest: /tmp/pg_tde_pytest_src
          mode: preserve
        become: true          # Required for become_user to work
        become_user: postgres

      - name: Prepare pytest environment (venv, deps, pg_tde smoke check)
        become: true
        become_user: postgres
        # TEST_SUITE=All installs Cosmian KMS + OpenBao so kmip/vault/openbao
        # tests actually run instead of self-skipping; Sanity skips that setup,
        # same as every run to date.
        shell: >-
          ./setup_test_env.sh
          --install-dir {{ pg_install_dir }}
          --pg-major {{ major_version }}
          {{ '' if test_suite == 'All' else '--no-setup-external-key-providers' }}
        args:
          executable: /bin/bash
          chdir: "/tmp/pg_tde_pytest_src"
        environment:
          PATH: "{{ pg_bin_dir }}:{{ pg_lib_dir }}:/usr/local/go/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"
          LD_LIBRARY_PATH: "{{ pg_lib_dir }}"
          INSTALL_DIR: "{{ pg_install_dir }}"
        register: pytest_env_setup

      - name: Save pytest environment setup log
        copy:
          content: "{{ pytest_env_setup.stdout | default('') }}\n--- STDERR ---\n{{ pytest_env_setup.stderr | default('') }}"
          dest: /tmp/pg_tde_pytest_env_setup.log
        become: true

      - name: Show pytest environment setup output
        debug:
          var: pytest_env_setup.stdout_lines

      # A stale --basetemp from a previous run on a reused host can make pytest's
      # own startup cleanup fail outright rather than just being ignored: xdist's
      # nodemanager calls getbasetemp() during pytest_sessionstart, and if the
      # prior rm_rf left anything behind (e.g. a worker subdir it couldn't fully
      # clear), mkdir(basetemp) raises FileExistsError as an INTERNALERROR before
      # a single test runs (rc=3, whole run gone). `rm -rf` as root succeeds
      # regardless of whether a leftover/orphaned postgres process from a
      # previous run still has files under here open — Linux allows removing an
      # open file, the process just keeps its own handle to the unlinked inode.
      - name: Clear stale pytest --basetemp from a previous run
        become: true
        ansible.builtin.file:
          path: /tmp/pg_tde_pytest_run
          state: absent

      # =============================
      # Run the pg_tde pytest suite
      # =============================
      - name: Run pg_tde pytest suite
        become: true
        become_user: postgres
        # TEST_SUITE=All runs every test case (no --skip-sections at all — slow/
        # vault/kmip/openbao all run for real). Sanity keeps the proven default:
        # pytest_skip_sections applies (upgrade,minor_upgrade,slow,vault,kmip,openbao).
        # NOTE: do not add --tb=line/--tb=short here to shrink console output.
        # --tb is a single global setting — it collapses the failure repr
        # everywhere pytest writes it, including the JUnit XML <failure> text and
        # the HTML report, not just stdout. Verified: a 3-frame failure
        # (test -> helper_1 -> helper_2) under --tb=line shows only the raised
        # exception's one line in the JUnit XML too — the entire call chain and
        # per-frame line numbers are gone, not just hidden from the console.
        # Keep pyproject.toml's default --tb=long so the saved artifacts (used
        # for actual debugging) stay complete; console-output size is a separate
        # concern from artifact completeness.
        shell: >-
          set -o pipefail;
          source .env.sh &&
          pytest tests/
          {{ '' if test_suite == 'All' else '--skip-sections=' ~ pytest_skip_sections }}
          {{ '-n ' ~ pytest_workers if pytest_workers | length > 0 else '' }}
          --basetemp=/tmp/pg_tde_pytest_run
          --junitxml=/tmp/pg_tde_pytest_junit.xml
          --html=/tmp/pg_tde_pytest_report.html --self-contained-html
        args:
          executable: /bin/bash
          chdir: "/tmp/pg_tde_pytest_src"
        # cosmian_kmip_env is {} unless the RHEL8-family Docker-Cosmian route ran
        # above; when it did, this merges in KMIP_SERVER_ADDRESS/PORT and the
        # client/CA cert paths so pytest finds the already-running container via
        # kmip_pytest_env_ready() instead of trying (and failing) to spawn the
        # native cosmian_kms binary.
        # IO_METHOD: conftest.py's --io-method CLI option defaults from this env
        # var (os.environ.get("IO_METHOD", "worker")) — without it here, the
        # Jenkins IO_METHOD parameter (fact set at the top of this file) never
        # actually reaches pytest, and every run silently uses "worker". The
        # io_method GUC only exists on PG 18+ (see PG_IO_METHOD_MIN_MAJOR in
        # lib/cluster.py); conftest.py hard pytest.exit()s if a non-"worker"
        # value is requested against an older major, so force "worker" here on
        # <18 rather than letting a leftover/mismatched Jenkins selection fail
        # the whole run outright.
        environment: "{{ {
            'PATH': pg_bin_dir ~ ':' ~ pg_lib_dir ~ ':/usr/local/go/bin:' ~ (ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin')),
            'LD_LIBRARY_PATH': pg_lib_dir,
            'INSTALL_DIR': pg_install_dir,
            'PG_MAJOR': major_version,
            'IO_METHOD': (io_method if (major_version | int) >= 18 else 'worker'),
            'PG_TDE_SKIP_EXTERNAL_KEY_PROVIDERS': ('0' if test_suite == 'All' else '1'),
          } | combine(cosmian_kmip_env | default({})) }}"
        ignore_errors: true
        register: regression

      - name: Determine pytest failure status
        set_fact:
          pytest_failed: "{{ (regression.rc | default(1)) != 0 }}"

      # Disk-usage report printed to the Jenkins console (survives a later host death
      # at "Save test runner output"). Some hosts (debian13-x86, uresolute-x86) fill
      # the volume during the run for an as-yet-unknown reason; this shows what ate it.
      - name: Capture disk usage after test run
        become: true
        ansible.builtin.shell: |
          set +e
          echo "===== df -h ====="
          df -h
          echo "===== du -sh /tmp/pg_tde_pytest_run top-level (pytest --basetemp) ====="
          du -sh /tmp/pg_tde_pytest_run 2>/dev/null
          echo "===== du -sh /tmp/pg_tde_pytest_run/* ====="
          du -sh /tmp/pg_tde_pytest_run/* 2>/dev/null | sort -rh | head -20
          echo "===== largest files under /tmp/pg_tde_pytest_run ====="
          find /tmp/pg_tde_pytest_run -type f -size +100M -exec du -h {} \; 2>/dev/null | sort -rh | head -20
          echo "===== core dumps ====="
          find / -maxdepth 4 -name "core*" -type f 2>/dev/null -exec du -h {} \; | head -20
          ls -1 /proc/sys/kernel/core_pattern 2>/dev/null && cat /proc/sys/kernel/core_pattern 2>/dev/null
        register: disk_report
        changed_when: false
        ignore_errors: true

      - name: Show disk usage report
        ansible.builtin.debug:
          var: disk_report.stdout_lines

      # Console display is decoupled from artifact content (the JUnit XML/HTML/
      # .log file always have the complete run regardless of what's echoed
      # here — see git history for why --tb isn't touched to "shrink" that data).
      # On a pass, the full -v listing (hundreds of PASSED lines for the All
      # suite) is just noise — show the one-line pytest summary instead. On a
      # failure, dump everything: the individual PASSED/FAILED lines plus full
      # tracebacks (pyproject.toml's addopts: -v --tb=long) are exactly what's
      # needed to diagnose without leaving Jenkins for the artifact.
      - name: Show pytest summary (pass — one line, not the full listing)
        debug:
          msg: "{{ regression.stdout_lines[-1] if (regression.stdout_lines | default([]) | length > 0) else 'no pytest output captured' }}"
        when: not pytest_failed

      - name: Show pytest output (failure — full listing + tracebacks)
        debug:
          msg: "{{ regression.stdout_lines if regression.stdout_lines is defined else [] }}"
        when: pytest_failed

      - name: Show stderr if pytest run failed
        debug:
          var: regression.stderr_lines
        when: pytest_failed

      - name: Save pytest run output to file
        copy:
          content: "{{ regression.stdout | default('') }}\n--- STDERR ---\n{{ regression.stderr | default('') }}"
          dest: /tmp/pg_tde_pytest_output.log
        become: true
        when: regression is defined

    rescue:
      # Reached only on a hard failure in the block above that ISN'T already
      # tolerated by ignore_errors (i.e. something before or outside the
      # pytest run itself — Docker/Cosmian setup, package install,
      # build_from_source, setup_test_env.sh, ...). pytest_failed won't be
      # set yet in that case (the "Determine pytest failure status" task
      # never ran), so default it to true before always: packages the
      # artifact as a failure bundle.
      - name: Mark this run failed (setup/build failure before or during the pytest run)
        set_fact:
          pytest_failed: true
        when: pytest_failed is not defined

      - name: "Re-raise the original failure (artifacts are still collected via always below)"
        fail:
          msg: >-
            pg_tde core role failed in task '{{ ansible_failed_task.name | default('unknown task') }}':
            {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('see console output above')) }}

    always:
      # Belt-and-braces: guarantee pytest_failed exists even if rescue itself
      # never ran (e.g. a failure so early "Set Base Facts" is fine but this
      # whole block's very first task fails before pytest_failed is set).
      - name: Ensure pytest_failed is always defined before artifact packaging
        set_fact:
          pytest_failed: "{{ pytest_failed | default(true) }}"

      - name: Collect and upload pg_tde pytest test artifacts
        include_tasks: collect_artifacts.yml

  - name: Fail the playbook if pg_tde pytest tests failed
    fail:
      msg: "pg_tde pytest suite failed"
    when: pytest_failed | default(true)
