os_list: all
name_pattern: pgtde-{token}-{build}
aws:
  size: xlarge
  subnet: aws2
cleanup: none
verifier: ansible
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - destroy
  cleanup:
  - cleanup
params:
- name: PLATFORM
  kind: choice
  special: platform_choice
  description: For what platform (OS) need to test
  flavors:
  - single
- name: REPO
  kind: choice
  choices:
  - testing
  - experimental
  - release
  description: Packages Repo for testing
- name: TDE_REPO
  kind: string
  default: https://github.com/percona/pg_tde.git
  description: pg_tde repo that we want to test, we could also use forked developer
    repo here.
- name: TDE_BRANCH
  kind: string
  default: release-2.2.0
  description: TDE repo version/branch/tag to use; e.g main, release-2.1
- name: VERSION
  kind: string
  default: ppg-18.4
  description: Server PG version for test, including major and minor version, e.g
    ppg-17.4, ppg-17.3
- name: IO_METHOD
  kind: choice
  choices:
  - sync
  - worker
  - io_uring
  description: io_method to use for the server (applicable to pg-18 and onwards only).
- name: TESTING_BRANCH
  kind: string
  default: main
  description: Branch for ppg-testing testing repository
- name: DESTROY_ENV
  kind: boolean
  default: true
  description: Destroy VM after tests
  flavors:
  - single
- name: MAJOR_REPO
  kind: boolean
  quote: '"'
  description: Enable to use major (ppg-17) repo instead of ppg-17.4
  description_parallel: Enable to use major (ppg-17) repo instead of ppg-17.6
jenkins:
  molecule_dir: pg_tde/tde
  artifacts: pg_tde/tde/artifacts/**/*.tar.gz
  jobs:
    single:
      job_name: ppg
      file: tde
      display_name: ${env.BUILD_NUMBER}-${env.VERSION}-${env.PLATFORM}
    parallel:
      job_name: tde-parallel
      file: tde-parallel
      display_name: ${env.BUILD_NUMBER}-tde-${env.VERSION}-${env.IO_METHOD}
      slack:
        channel: '#postgresql-test'
        params:
        - psp_repo
        - psp_branch
        - version
        - package_repo
        - major_repo
        args:
        - TDE_REPO
        - TDE_BRANCH
        - VERSION
        - REPO
        - MAJOR_REPO
        fields:
        - label: PSP_Repo
          param: psp_repo
        - label: PSP_Branch
          param: psp_branch
        - label: Version
          param: version
        - label: Package_Repo
          param: package_repo
        - label: Major_Repo
          param: major_repo
