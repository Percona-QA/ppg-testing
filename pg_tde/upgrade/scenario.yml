os_list: all
name_pattern: tde-upgrade-{token}-{build}
aws:
  size: xlarge
  subnet: aws2
cleanup: none
verifier: ansible
sequences:
  destroy:
  - destroy
  test:
  - destroy
  - create
  - prepare
  - converge
  - destroy
  cleanup:
  - cleanup
# TEMPORARY: host QA runs against an OBS project that has EL repositories
# only, so the Debian/Ubuntu scenarios do nothing.
overrides:
  debian-12:
    sequences:
      destroy:
      - destroy
      test:
      - destroy
      cleanup:
      - cleanup
