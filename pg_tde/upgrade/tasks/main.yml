---
  # ===========================================================
  # Base facts from environment variables
  # ===========================================================
  - name: Set base facts
    set_fact:
      from_full_version:     "{{ lookup('env', 'FROM_VERSION') | regex_replace('^(?:ppg|psp)-', '') }}"
      to_full_version:       "{{ lookup('env', 'TO_VERSION')   | regex_replace('^(?:ppg|psp)-', '') }}"
      from_version_str:      "{{ lookup('env', 'FROM_VERSION') }}"
      to_version_str:        "{{ lookup('env', 'TO_VERSION')   }}"
      # psp only ships one repo per major version (psp-16), no psp-16.xx minor
      # repos exist, unlike ppg (ppg-16.14 etc.) — trim the minor for psp only.
      from_repo_version:     "{{ lookup('env', 'FROM_VERSION').split('.')[0] if lookup('env', 'FROM_VERSION').startswith('psp-') else lookup('env', 'FROM_VERSION') }}"
      to_repo_version:       "{{ lookup('env', 'TO_VERSION').split('.')[0] if lookup('env', 'TO_VERSION').startswith('psp-') else lookup('env', 'TO_VERSION') }}"
      upgrade_type:          "{{ lookup('env', 'UPGRADE_TYPE') | default('server_minor') | lower }}"
      tde_upgrade:           "{{ lookup('env', 'TDE_UPGRADE')  | default('false') | bool }}"
      install_from_packages: "{{ lookup('env', 'INSTALL_FROM_PACKAGES') | default('true') | bool }}"
      tde_repo:              "{{ lookup('env', 'TDE_REPO') | default('https://github.com/percona/pg_tde.git') }}"
      from_tde_branch:       "{{ lookup('env', 'FROM_TDE_BRANCH') | default('main') }}"
      to_tde_branch:         "{{ lookup('env', 'TO_TDE_BRANCH')   | default('main') }}"
      from_repo:             "{{ lookup('env', 'FROM_REPO') | default('testing') }}"
      to_repo:               "{{ lookup('env', 'TO_REPO')   | default('testing') }}"
      build_number:          "{{ lookup('env', 'BUILD_NUMBER') | default('0') }}"
      # server_major only: also run the pytest major-upgrade tests against the
      # packaged FROM/TO binaries (run_pytest_upgrade_section.yml).
      run_pytest_upgrade_section: "{{ lookup('env', 'RUN_PYTEST_UPGRADE_SECTION') | default('false', true) | bool }}"
      pytest_upgrade_tests:  "{{ lookup('env', 'PYTEST_UPGRADE_TESTS') | default('tests/test_tde_pg_upgrade.py', true) }}"
      # Key provider for the staged checker's global and tde_a keys:
      # file, or a KMS started by start_key_provider.yml.
      key_provider:          "{{ lookup('env', 'KEY_PROVIDER') | default('file', true) | lower }}"
      # Root token of the localhost-only vault/openbao dev server.
      kms_root_token:        upg-root-token
      # HA=true: a streaming replica on the same host (replica.yml), upgraded
      # rolling for minor/tde_only and rebuilt after a major upgrade.
      ha:                    "{{ lookup('env', 'HA') | default('false', true) | bool }}"
      replica_port:          5433
      # Data checksums of the FROM cluster: default (initdb default of the FROM
      # major: off before 18, on from 18), on or off. The TO cluster of a major
      # upgrade follows the FROM setting (major_upgrade.yml).
      data_checksums:        "{{ lookup('env', 'DATA_CHECKSUMS') | default('default', true) | lower }}"
      # Host ports of the KMS containers, away from the defaults a native
      # openbao / cosmian_kms install would use.
      vault_host_port:       18200
      kmip_host_port:        15556
      # Optional package pins for Percona patched-release upgrades. Empty = latest
      # in the channel (current behaviour). Server is pinned by build increment
      # (e.g. "2" -> 18.4-2); pg_tde is pinned by package version (e.g. "2.2.0").
      from_pkg_release:      "{{ lookup('env', 'FROM_PKG_RELEASE') | default('', true) }}"
      to_pkg_release:        "{{ lookup('env', 'TO_PKG_RELEASE')   | default('', true) }}"
      from_tde_pkg_version:  "{{ lookup('env', 'FROM_TDE_PKG_VERSION') | default('', true) }}"
      to_tde_pkg_version:    "{{ lookup('env', 'TO_TDE_PKG_VERSION')   | default('', true) }}"
      # Optional expected Percona server patch versions (e.g. 18.4.1 / 18.4.2). When
      # set, the version captures assert SELECT version() reports them and fail if not.
      from_percona_server_version: "{{ lookup('env', 'FROM_PERCONA_SERVER_VERSION') | default('', true) }}"
      to_percona_server_version:   "{{ lookup('env', 'TO_PERCONA_SERVER_VERSION')   | default('', true) }}"
      cacheable: true

  - name: Detect whether the TO side installs from OBS
    include_tasks: "{{ role_path }}/../../tasks/detect_use_obs_repo.yml"

  - name: Validate DATA_CHECKSUMS
    fail:
      msg: "DATA_CHECKSUMS={{ data_checksums }}: expected default, on or off"
    when: data_checksums not in ['default', 'on', 'off']

  - name: Validate KEY_PROVIDER
    fail:
      msg: "KEY_PROVIDER={{ key_provider }}: expected file, vault, openbao or kmip"
    when: key_provider not in ['file', 'vault', 'openbao', 'kmip']

  - name: Set derived major version facts
    set_fact:
      from_major_version: "{{ from_full_version | string | split('.') | first }}"
      to_major_version:   "{{ to_full_version   | string | split('.') | first }}"
      cacheable: true

  # ===========================================================
  # Ubuntu 26 (Resolute) version compatibility guard
  # ===========================================================
  - name: End play on Ubuntu 26 if FROM_VERSION is not supported
    meta: end_host
    vars:
      ubuntu26_min_versions:
        '14': '14.23'
        '15': '15.18'
        '16': '16.14'
        '17': '17.10'
        '18': '18.4'
      min_ver: "{{ ubuntu26_min_versions[from_major_version] | default('0.0') }}"
    when:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "26"
      - min_ver != '0.0'
      - from_full_version is version(min_ver, '<', strict=True)

  - name: End play on Ubuntu 26 if TO_VERSION is not supported
    meta: end_host
    vars:
      ubuntu26_min_versions:
        '14': '14.23'
        '15': '15.18'
        '16': '16.14'
        '17': '17.10'
        '18': '18.4'
      min_ver: "{{ ubuntu26_min_versions[to_major_version] | default('0.0') }}"
    when:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "26"
      - min_ver != '0.0'
      - to_full_version is version(min_ver, '<', strict=True)

  - name: Set artifact filename
    set_fact:
      # Staged upgrade checker (pg_tde/core/files/pytest/tests/test_tde_upgrade_check.py)
      checker_src: /tmp/pg_tde_pytest_src
      checker_dir: /var/lib/pg_tde_upgrade_check
      artifact_filename: "tde-upgrade-{{ from_version_str }}-to-{{ to_version_str }}-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-build{{ build_number }}.tar.gz"
      cacheable: true

  - name: Set PostgreSQL paths (RHEL)
    set_fact:
      from_pg_conf:        "/var/lib/pgsql/{{ from_major_version }}/data/postgresql.conf"
      from_pg_data_dir:    "/var/lib/pgsql/{{ from_major_version }}/data"
      from_pg_config_bin:  "/usr/pgsql-{{ from_major_version }}/bin/pg_config"
      from_pg_bin_dir:     "/usr/pgsql-{{ from_major_version }}/bin"
      from_pg_lib_dir:     "/usr/pgsql-{{ from_major_version }}/lib"
      from_pg_install_dir: "/usr/pgsql-{{ from_major_version }}"
      from_pg_service:     "postgresql-{{ from_major_version }}"
      from_pg_socket_dir:  "/tmp"
      to_pg_conf:          "/var/lib/pgsql/{{ to_major_version }}/data/postgresql.conf"
      to_pg_data_dir:      "/var/lib/pgsql/{{ to_major_version }}/data"
      to_pg_config_bin:    "/usr/pgsql-{{ to_major_version }}/bin/pg_config"
      to_pg_bin_dir:       "/usr/pgsql-{{ to_major_version }}/bin"
      to_pg_lib_dir:       "/usr/pgsql-{{ to_major_version }}/lib"
      to_pg_install_dir:   "/usr/pgsql-{{ to_major_version }}"
      to_pg_service:       "postgresql-{{ to_major_version }}"
      to_pg_socket_dir:    "/tmp"
      cacheable: true
    when: ansible_os_family == "RedHat"

  - name: Set PostgreSQL paths (Debian)
    set_fact:
      from_pg_conf:        "/etc/postgresql/{{ from_major_version }}/main/postgresql.conf"
      from_pg_data_dir:    "/var/lib/postgresql/{{ from_major_version }}/main"
      from_pg_config_bin:  "/usr/lib/postgresql/{{ from_major_version }}/bin/pg_config"
      from_pg_bin_dir:     "/usr/lib/postgresql/{{ from_major_version }}/bin"
      from_pg_lib_dir:     "/usr/lib/postgresql/{{ from_major_version }}/lib"
      from_pg_install_dir: "/usr/lib/postgresql/{{ from_major_version }}"
      from_pg_service:     "postgresql"
      from_pg_socket_dir:  "/var/run/postgresql"
      to_pg_conf:          "/etc/postgresql/{{ to_major_version }}/main/postgresql.conf"
      to_pg_data_dir:      "/var/lib/postgresql/{{ to_major_version }}/main"
      to_pg_config_bin:    "/usr/lib/postgresql/{{ to_major_version }}/bin/pg_config"
      to_pg_bin_dir:       "/usr/lib/postgresql/{{ to_major_version }}/bin"
      to_pg_lib_dir:       "/usr/lib/postgresql/{{ to_major_version }}/lib"
      to_pg_install_dir:   "/usr/lib/postgresql/{{ to_major_version }}"
      to_pg_service:       "postgresql"
      to_pg_socket_dir:    "/var/run/postgresql"
      cacheable: true
    when: ansible_os_family == "Debian"

  - name: Log upgrade scenario
    debug:
      msg:
        - "FROM: {{ from_version_str }} (major {{ from_major_version }})"
        - "TO:   {{ to_version_str }} (major {{ to_major_version }})"
        - "Upgrade type: {{ upgrade_type }}"
        - "TDE upgrade: {{ tde_upgrade }}"
        - "TDE from packages: {{ install_from_packages }}"
        - "TO repo source: {{ 'OBS' if use_obs_repo else 'percona-release' }}"
        - "pytest upgrade tests: {{ run_pytest_upgrade_section and upgrade_type == 'server_major' }}"
        - "Key provider: {{ key_provider }}"
        - "HA replica: {{ ha }}"
        - "FROM data checksums: {{ data_checksums }}"

  # ===========================================================
  # Main flow — wrapped in block/always so artifacts are always
  # collected even when the play fails mid-way.
  # ===========================================================
  - name: Upgrade test main flow
    block:

      # ===========================================================
      # OS prerequisites
      # ===========================================================
      - name: OS prerequisites (RHEL)
        include_tasks:
          file: redhat_tasks.yml
        when: ansible_os_family == "RedHat"

      - name: OS prerequisites (Debian)
        include_tasks:
          file: debian_tasks.yml
        when: ansible_os_family == "Debian"

      # ===========================================================
      # Install Percona release tool + enable FROM version repo
      # ===========================================================
      - name: Install percona-release (RHEL)
        command: yum -y install https://repo.percona.com/yum/percona-release-latest.noarch.rpm
        when: ansible_os_family == "RedHat"

      - name: Refresh yum cache (RHEL)
        shell: yum clean all && yum makecache
        when: ansible_os_family == "RedHat"

      - name: Install percona-release (Debian)
        apt:
          deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        when: ansible_os_family == "Debian"

      - name: Enable Percona repo for FROM version
        command: percona-release enable-only {{ from_repo_version }} {{ from_repo }}


      # ===========================================================
      # Install PostgreSQL FROM version packages
      # ===========================================================
      - name: Install PostgreSQL FROM version packages (RHEL)
        include_tasks:
          file: install_pg_packages_rhel.yml
        vars:
          pg_major: "{{ from_major_version }}"
          pg_full_version: "{{ from_full_version }}"
          pkg_release: "{{ from_pkg_release }}"
        when: ansible_os_family == "RedHat"

      - name: Install PostgreSQL FROM version packages (Debian)
        include_tasks:
          file: install_pg_packages_deb.yml
        vars:
          pg_major: "{{ from_major_version }}"
          pg_full_version: "{{ from_full_version }}"
          pkg_release: "{{ from_pkg_release }}"
        when: ansible_os_family == "Debian"

      # ===========================================================
      # Install pg_tde for FROM version
      # ===========================================================
      - name: Install pg_tde FROM version packages
        include_tasks:
          file: install_tde_packages.yml
        vars:
          pg_major: "{{ from_major_version }}"
          tde_pkg_version: "{{ from_tde_pkg_version }}"
        when: install_from_packages | bool

      - name: Build pg_tde from source for FROM version
        include_tasks:
          file: build_tde_source.yml
        vars:
          tde_branch_to_build: "{{ from_tde_branch }}"
          tde_src_dest:        "/tmp/pg_tde_from"
          tde_build_dest:      "/tmp/pg_tde_from-build"
          pg_config_path:      "{{ from_pg_config_bin }}"
          pg_bin_dir:          "{{ from_pg_bin_dir }}"
          pg_lib_dir:          "{{ from_pg_lib_dir }}"
          tde_build_log:       "/tmp/tde-from-build.log"
          tde_install_log:     "/tmp/tde-from-install.log"
        when: not (install_from_packages | bool)

      # ===========================================================
      # Initialize and start PostgreSQL FROM version
      # ===========================================================
      # initdb flag for DATA_CHECKSUMS; --no-data-checksums only exists from
      # PG 18, where checksums became the default.
      - name: Pick initdb checksum option for the FROM cluster
        set_fact:
          from_initdb_checksum_opt: >-
            {%- if data_checksums == 'on' -%}--data-checksums
            {%- elif data_checksums == 'off' and from_major_version | int >= 18 -%}--no-data-checksums
            {%- endif -%}

      - name: Initialize PostgreSQL FROM version data directory (RHEL)
        command: /usr/pgsql-{{ from_major_version }}/bin/postgresql-{{ from_major_version }}-setup initdb
        become: true
        environment:
          PGSETUP_INITDB_OPTIONS: "{{ from_initdb_checksum_opt }}"
        when: ansible_os_family == "RedHat"

      # The Debian server package creates <ver>/main with initdb defaults; for an
      # explicit DATA_CHECKSUMS it is recreated with the requested setting.
      - name: Recreate the FROM cluster with DATA_CHECKSUMS={{ data_checksums }} (Debian)
        shell: |
          set -e
          pg_dropcluster --stop {{ from_major_version }} main
          pg_createcluster {{ from_major_version }} main {{ ('-- ' ~ from_initdb_checksum_opt) if from_initdb_checksum_opt | length > 0 else '' }}
        args:
          executable: /bin/bash
        become: true
        when:
          - ansible_os_family == "Debian"
          - data_checksums != 'default'

      - name: Start PostgreSQL FROM version
        service:
          name: "{{ from_pg_service }}"
          state: started
          enabled: true
        become: true

      # ===========================================================
      # Configure pg_tde: add to shared_preload_libraries + restart
      # ===========================================================
      - name: Add pg_tde to shared_preload_libraries (FROM version)
        include_tasks:
          file: configure_tde_conf.yml
        vars:
          pg_conf: "{{ from_pg_conf }}"

      - name: Restart PostgreSQL FROM version to load pg_tde
        include_tasks:
          file: restart_and_wait.yml
        vars:
          pg_service:    "{{ from_pg_service }}"
          pg_bin_dir:    "{{ from_pg_bin_dir }}"
          pg_socket_dir: "{{ from_pg_socket_dir }}"

      # ===========================================================
      # Seed the standard dataset (pre-upgrade) with the staged checker:
      # prepare sets up the server key and turns WAL encryption on, which
      # needs a restart before setup seeds and snapshots the data.
      # ===========================================================
      - name: Deploy the upgrade checker
        include_tasks:
          file: deploy_checker.yml

      - name: Start the {{ key_provider }} key provider
        include_tasks:
          file: start_key_provider.yml
        when: key_provider != 'file'

      - name: Upgrade checker - prepare
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  prepare
          pg_bin_dir:     "{{ from_pg_bin_dir }}"
          pg_install_dir: "{{ from_pg_install_dir }}"
          pg_socket_dir:  "{{ from_pg_socket_dir }}"

      - name: Restart PostgreSQL FROM version to enable WAL encryption
        include_tasks:
          file: restart_and_wait.yml
        vars:
          pg_service:    "{{ from_pg_service }}"
          pg_bin_dir:    "{{ from_pg_bin_dir }}"
          pg_socket_dir: "{{ from_pg_socket_dir }}"

      - name: Upgrade checker - setup
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  setup
          pg_bin_dir:     "{{ from_pg_bin_dir }}"
          pg_install_dir: "{{ from_pg_install_dir }}"
          pg_socket_dir:  "{{ from_pg_socket_dir }}"

      # HA: the replica is built from the seeded FROM cluster and checked
      # before the upgrade, so a later failure is the upgrade's, not the setup's.
      - name: HA - create the replica (FROM)
        include_tasks:
          file: replica.yml
        vars:
          replica_action: "{{ item }}"
          pg_bin_dir:     "{{ from_pg_bin_dir }}"
          pg_socket_dir:  "{{ from_pg_socket_dir }}"
        loop: [create, wait]
        when: ha | bool

      - name: Upgrade checker - verify-replica (FROM)
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  verify-replica
          pg_bin_dir:     "{{ from_pg_bin_dir }}"
          pg_install_dir: "{{ from_pg_install_dir }}"
          pg_socket_dir:  "{{ from_pg_socket_dir }}"
        when: ha | bool

      - name: Capture server version (FROM, pre-upgrade)
        include_tasks:
          file: capture_server_version.yml
        vars:
          pg_major:         "{{ from_major_version }}"
          pg_bin_dir:       "{{ from_pg_bin_dir }}"
          pg_socket_dir:    "{{ from_pg_socket_dir }}"
          version_log:      "/tmp/server-from-version.log"
          version_label:    "FROM"
          expected_version: "{{ from_percona_server_version }}"

      - name: Capture pg_tde version (FROM, pre-upgrade)
        include_tasks:
          file: capture_tde_version.yml
        vars:
          pg_major:             "{{ from_major_version }}"
          pg_bin_dir:           "{{ from_pg_bin_dir }}"
          pg_socket_dir:        "{{ from_pg_socket_dir }}"
          version_log:          "/tmp/tde-from-version.log"
          version_label:        "FROM"
          expected_tde_version: "{{ from_tde_pkg_version }}"

      - name: Read versions (FROM, pre-upgrade)
        include_tasks:
          file: read_versions.yml
        vars:
          pg_major:      "{{ from_major_version }}"
          pg_bin_dir:    "{{ from_pg_bin_dir }}"
          pg_socket_dir: "{{ from_pg_socket_dir }}"
          version_label: "FROM"

      # ===========================================================
      # Perform the upgrade
      # ===========================================================
      - name: Perform minor version upgrade
        include_tasks:
          file: minor_upgrade.yml
        when: upgrade_type == "server_minor"

      - name: Perform major version upgrade
        include_tasks:
          file: major_upgrade.yml
        when: upgrade_type == "server_major"

      - name: Perform pg_tde-only upgrade (PostgreSQL version unchanged)
        include_tasks:
          file: tde_only_upgrade.yml
        when: upgrade_type == "tde_only"

      # ===========================================================
      # Verify TDE data post-upgrade: once with the new pg_tde library
      # still on the old extension catalog, then again after
      # ALTER EXTENSION pg_tde UPDATE.
      # ===========================================================
      - name: Upgrade checker - verify-before-alter
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  verify-before-alter
          pg_bin_dir:     "{{ to_pg_bin_dir }}"
          pg_install_dir: "{{ to_pg_install_dir }}"
          pg_socket_dir:  "{{ to_pg_socket_dir }}"

      - name: Update pg_tde extension in every database
        include_tasks:
          file: alter_extension_update.yml
        vars:
          pg_bin_dir:    "{{ to_pg_bin_dir }}"
          pg_socket_dir: "{{ to_pg_socket_dir }}"

      - name: Upgrade checker - verify
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  verify
          pg_bin_dir:     "{{ to_pg_bin_dir }}"
          pg_install_dir: "{{ to_pg_install_dir }}"
          pg_socket_dir:  "{{ to_pg_socket_dir }}"

      - name: Upgrade checker - verify-replica (TO)
        include_tasks:
          file: run_checker.yml
        vars:
          checker_stage:  verify-replica
          pg_bin_dir:     "{{ to_pg_bin_dir }}"
          pg_install_dir: "{{ to_pg_install_dir }}"
          pg_socket_dir:  "{{ to_pg_socket_dir }}"
        when: ha | bool

      - name: Verify data checksums offline (pg_tde_checksums)
        include_tasks:
          file: verify_checksums.yml
        vars:
          pg_bin_dir:    "{{ to_pg_bin_dir }}"
          pg_data_dir:   "{{ to_pg_data_dir }}"
          pg_service:    "{{ to_pg_service }}"
          pg_socket_dir: "{{ to_pg_socket_dir }}"

      - name: Capture server version (TO, post-upgrade)
        include_tasks:
          file: capture_server_version.yml
        vars:
          pg_major:         "{{ to_major_version }}"
          pg_bin_dir:       "{{ to_pg_bin_dir }}"
          pg_socket_dir:    "{{ to_pg_socket_dir }}"
          version_log:      "/tmp/server-to-version.log"
          version_label:    "TO"
          expected_version: "{{ to_percona_server_version }}"

      - name: Capture pg_tde version (TO, post-upgrade)
        include_tasks:
          file: capture_tde_version.yml
        vars:
          pg_major:             "{{ to_major_version }}"
          pg_bin_dir:           "{{ to_pg_bin_dir }}"
          pg_socket_dir:        "{{ to_pg_socket_dir }}"
          version_log:          "/tmp/tde-to-version.log"
          version_label:        "TO"
          expected_tde_version: "{{ to_tde_pkg_version }}"

      - name: Read versions (TO, post-upgrade)
        include_tasks:
          file: read_versions.yml
        vars:
          pg_major:      "{{ to_major_version }}"
          pg_bin_dir:    "{{ to_pg_bin_dir }}"
          pg_socket_dir: "{{ to_pg_socket_dir }}"
          version_label: "TO"

      - name: Check the upgrade actually changed what it was asked to
        include_tasks:
          file: assert_upgrade_versions.yml

      - name: Run pytest upgrade tests on the packaged binaries
        include_tasks:
          file: run_pytest_upgrade_section.yml
        when:
          - upgrade_type == "server_major"
          - run_pytest_upgrade_section | bool

    rescue:
      - name: Record upgrade test failure
        set_fact:
          upgrade_test_failed: true
          cacheable: true

    always:
      - name: Release the HA package-script hold if a run stopped mid-way
        include_tasks:
          file: ha_release_hold.yml
        when: ha | bool

      # ===========================================================
      # Collect artifacts — runs even when the play fails
      # ===========================================================
      - name: Collect and package upgrade test artifacts
        include_tasks:
          file: collect_artifacts.yml

  # ===========================================================
  # Fail the play after artifacts are collected
  # ===========================================================
  - name: Fail if upgrade test failed
    fail:
      msg: "Upgrade test failed — see artifacts for details"
    when: upgrade_test_failed | default(false) | bool
