---
  # ===========================================================
  # Base facts from environment variables
  # ===========================================================
  - name: Set base facts
    set_fact:
      from_full_version:     "{{ lookup('env', 'FROM_VERSION') | regex_replace('^(?:ppg|psp)-', '') }}"
      to_full_version:       "{{ lookup('env', 'TO_VERSION')   | regex_replace('^(?:ppg|psp)-', '') }}"
      from_version_str:      "{{ lookup('env', 'FROM_VERSION') }}"
      to_version_str:        "{{ lookup('env', 'TO_VERSION')   }}"
      # psp only ships one repo per major version (psp-16), no psp-16.xx minor
      # repos exist, unlike ppg (ppg-16.14 etc.) — trim the minor for psp only.
      from_repo_version:     "{{ lookup('env', 'FROM_VERSION').split('.')[0] if lookup('env', 'FROM_VERSION').startswith('psp-') else lookup('env', 'FROM_VERSION') }}"
      to_repo_version:       "{{ lookup('env', 'TO_VERSION').split('.')[0] if lookup('env', 'TO_VERSION').startswith('psp-') else lookup('env', 'TO_VERSION') }}"
      upgrade_type:          "{{ lookup('env', 'UPGRADE_TYPE') | default('server_minor', true) | lower }}"
      tde_upgrade:           "{{ lookup('env', 'TDE_UPGRADE')  | default('true', true) | bool }}"
      # Packages only: everything tested is an OBS-built package. The TO side
      # always comes from OBS. The FROM side comes from OBS too for a major
      # upgrade (the previous major's project); a minor or pg_tde-only upgrade
      # needs an older version than OBS has (OBS keeps only the newest minor),
      # so its FROM side comes from repo.percona.com (FROM_REPO channel).
      from_source:           "{{ 'obs' if (lookup('env', 'UPGRADE_TYPE') | default('server_minor', true) | lower) == 'server_major' else 'release' }}"
      from_repo:             "{{ lookup('env', 'FROM_REPO') | default('release', true) }}"
      # Only used to derive an OBS project when OBS_PROJECT is empty
      # (testing -> isv:percona:ppg:staging:<major>).
      to_repo:               "testing"
      build_number:          "{{ lookup('env', 'BUILD_NUMBER') | default('0') }}"
      # The shared install tasks support build pins; nothing is pinned here:
      # the newest package in the enabled repo is installed.
      from_pkg_release:      ""
      to_pkg_release:        ""
      from_tde_pkg_version:  ""
      to_tde_pkg_version:    ""
      expected_versions:     "{{ lookup('env', 'EXPECTED_VERSIONS') | default('', true) }}"
      cacheable: true

  # TO side: always OBS.
  - name: Install the TO side from OBS
    set_fact:
      use_obs_repo: true
      cacheable: true

  - name: Set derived major version facts
    set_fact:
      from_major_version: "{{ from_full_version | string | split('.') | first }}"
      to_major_version:   "{{ to_full_version   | string | split('.') | first }}"
      cacheable: true

  # FROM OBS project (major upgrade): FROM_OBS_PROJECT, else OBS_PROJECT with
  # the TO major replaced by the FROM major (…:staging:18 -> …:staging:17),
  # else derived from FROM_VERSION like the TO project.
  # Expected TO versions: the OBS-built versions (EXPECTED_VERSIONS, sent by
  # OBS QA): the server unless the server is unchanged (pg_tde-only), pg_tde
  # when it is upgraded. Empty when not given (no check).
  - name: Set FROM OBS project and expected TO versions
    set_fact:
      from_obs_project: >-
        {{ lookup('env', 'FROM_OBS_PROJECT') | default('', true) | trim
           or ((lookup('env', 'OBS_PROJECT') | trim) | regex_replace(':' ~ to_major_version ~ '(?=:|$)', ':' ~ from_major_version)
               if (lookup('env', 'OBS_PROJECT') | trim) else '') }}
      expected_to_server_version: >-
        {{ (expected_versions.splitlines() | select('match', '^percona-postgresql=') | map('regex_replace', '^percona-postgresql=', '') | first | default('', true))
           if upgrade_type != 'tde_only' else '' }}
      expected_to_tde_version: >-
        {{ (expected_versions.splitlines() | select('match', '^percona-pg_tde=') | map('regex_replace', '^percona-pg_tde=', '') | first | default('', true))
           if (tde_upgrade | bool) or upgrade_type == 'tde_only' else '' }}
      cacheable: true

  # ===========================================================
  # Ubuntu 26 (Resolute) version compatibility guard
  # ===========================================================
  - name: End play on Ubuntu 26 if FROM_VERSION is not supported
    meta: end_host
    vars:
      ubuntu26_min_versions:
        '14': '14.23'
        '15': '15.18'
        '16': '16.14'
        '17': '17.10'
        '18': '18.4'
      min_ver: "{{ ubuntu26_min_versions[from_major_version] | default('0.0') }}"
    when:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "26"
      - min_ver != '0.0'
      - from_full_version is version(min_ver, '<', strict=True)

  - name: End play on Ubuntu 26 if TO_VERSION is not supported
    meta: end_host
    vars:
      ubuntu26_min_versions:
        '14': '14.23'
        '15': '15.18'
        '16': '16.14'
        '17': '17.10'
        '18': '18.4'
      min_ver: "{{ ubuntu26_min_versions[to_major_version] | default('0.0') }}"
    when:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version == "26"
      - min_ver != '0.0'
      - to_full_version is version(min_ver, '<', strict=True)

  - name: Set artifact filename
    set_fact:
      artifact_filename: "tde-upgrade-{{ from_version_str }}-to-{{ to_version_str }}-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-build{{ build_number }}.tar.gz"
      cacheable: true

  - name: Set PostgreSQL paths (RHEL)
    set_fact:
      from_pg_conf:        "/var/lib/pgsql/{{ from_major_version }}/data/postgresql.conf"
      from_pg_data_dir:    "/var/lib/pgsql/{{ from_major_version }}/data"
      from_pg_config_bin:  "/usr/pgsql-{{ from_major_version }}/bin/pg_config"
      from_pg_bin_dir:     "/usr/pgsql-{{ from_major_version }}/bin"
      from_pg_lib_dir:     "/usr/pgsql-{{ from_major_version }}/lib"
      from_pg_install_dir: "/usr/pgsql-{{ from_major_version }}"
      from_pg_service:     "postgresql-{{ from_major_version }}"
      from_pg_socket_dir:  "/tmp"
      to_pg_conf:          "/var/lib/pgsql/{{ to_major_version }}/data/postgresql.conf"
      to_pg_data_dir:      "/var/lib/pgsql/{{ to_major_version }}/data"
      to_pg_config_bin:    "/usr/pgsql-{{ to_major_version }}/bin/pg_config"
      to_pg_bin_dir:       "/usr/pgsql-{{ to_major_version }}/bin"
      to_pg_lib_dir:       "/usr/pgsql-{{ to_major_version }}/lib"
      to_pg_install_dir:   "/usr/pgsql-{{ to_major_version }}"
      to_pg_service:       "postgresql-{{ to_major_version }}"
      to_pg_socket_dir:    "/tmp"
      cacheable: true
    when: ansible_os_family == "RedHat"

  - name: Set PostgreSQL paths (Debian)
    set_fact:
      from_pg_conf:        "/etc/postgresql/{{ from_major_version }}/main/postgresql.conf"
      from_pg_data_dir:    "/var/lib/postgresql/{{ from_major_version }}/main"
      from_pg_config_bin:  "/usr/lib/postgresql/{{ from_major_version }}/bin/pg_config"
      from_pg_bin_dir:     "/usr/lib/postgresql/{{ from_major_version }}/bin"
      from_pg_lib_dir:     "/usr/lib/postgresql/{{ from_major_version }}/lib"
      from_pg_install_dir: "/usr/lib/postgresql/{{ from_major_version }}"
      from_pg_service:     "postgresql"
      from_pg_socket_dir:  "/var/run/postgresql"
      to_pg_conf:          "/etc/postgresql/{{ to_major_version }}/main/postgresql.conf"
      to_pg_data_dir:      "/var/lib/postgresql/{{ to_major_version }}/main"
      to_pg_config_bin:    "/usr/lib/postgresql/{{ to_major_version }}/bin/pg_config"
      to_pg_bin_dir:       "/usr/lib/postgresql/{{ to_major_version }}/bin"
      to_pg_lib_dir:       "/usr/lib/postgresql/{{ to_major_version }}/lib"
      to_pg_install_dir:   "/usr/lib/postgresql/{{ to_major_version }}"
      to_pg_service:       "postgresql"
      to_pg_socket_dir:    "/var/run/postgresql"
      cacheable: true
    when: ansible_os_family == "Debian"

  - name: Log upgrade scenario
    debug:
      msg:
        - "FROM: {{ from_version_str }} (major {{ from_major_version }})"
        - "TO:   {{ to_version_str }} (major {{ to_major_version }})"
        - "Upgrade type: {{ upgrade_type }}"
        - "TDE upgrade: {{ tde_upgrade }}"
        - "FROM source: {{ ('OBS ' ~ (from_obs_project or '(derived from FROM_VERSION)')) if from_source == 'obs' else ('repo.percona.com, ' ~ from_repo ~ ' channel') }}"
        - "TO source: OBS {{ lookup('env', 'OBS_PROJECT') or '(derived from TO_VERSION)' }}"
        - "Expected TO versions: server {{ expected_to_server_version or '-' }}, pg_tde {{ expected_to_tde_version or '-' }}"

  # ===========================================================
  # Main flow — wrapped in block/always so artifacts are always
  # collected even when the play fails mid-way.
  # ===========================================================
  - name: Upgrade test main flow
    block:

      # ===========================================================
      # OS prerequisites
      # ===========================================================
      - name: OS prerequisites (RHEL)
        include_tasks:
          file: redhat_tasks.yml
        when: ansible_os_family == "RedHat"

      - name: OS prerequisites (Debian)
        include_tasks:
          file: debian_tasks.yml
        when: ansible_os_family == "Debian"

      # ===========================================================
      # Install Percona release tool + enable FROM version repo
      # ===========================================================
      - name: Install percona-release (RHEL)
        command: yum -y install https://repo.percona.com/yum/percona-release-latest.noarch.rpm
        when: ansible_os_family == "RedHat"

      - name: Refresh yum cache (RHEL)
        shell: yum clean all && yum makecache
        when: ansible_os_family == "RedHat"

      - name: Install percona-release (Debian)
        apt:
          deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        when: ansible_os_family == "Debian"

      # FROM from repo.percona.com (minor and pg_tde-only upgrades): the version
      # must be released. A pg_tde-only upgrade keeps the server version, so it
      # can only run when the OBS server version is also released: skip it
      # otherwise. For other upgrades a missing release is an error.
      - name: Check the FROM version is released on repo.percona.com
        uri:
          url: "https://repo.percona.com/{{ from_repo_version }}/"
          method: GET
          status_code: [200, 301, 302, 403, 404]
        register: from_release_check
        when: from_source == 'release'

      - name: Skip the pg_tde-only upgrade (server version not released yet)
        when:
          - from_source == 'release'
          - upgrade_type == 'tde_only'
          - from_release_check.status == 404
        block:
          - name: Explain the skip
            debug:
              msg: >-
                {{ from_version_str }} is not released on repo.percona.com yet: a pg_tde-only
                upgrade needs the same server version released and in OBS. Skipped.
          - name: End the play for this host
            meta: end_host

      - name: Fail if the FROM version is not released
        fail:
          msg: "{{ from_version_str }} is not on repo.percona.com (https://repo.percona.com/{{ from_repo_version }}/ returned 404)"
        when:
          - from_source == 'release'
          - from_release_check.status == 404

      - name: Enable Percona repo for FROM version
        command: percona-release enable-only {{ from_repo_version }} {{ from_repo }}
        when: from_source == 'release'

      # FROM from OBS (major upgrade): the previous major's project.
      - name: Enable the OBS repo for the FROM version
        include_tasks: "{{ role_path }}/../../tasks/enable_obs_repo.yml"
        vars:
          obs_version: "{{ from_version_str }}"
          obs_repo: "{{ to_repo }}"
          obs_project_name: "{{ from_obs_project }}"
        when: from_source == 'obs'

      - name: Remember the FROM OBS repo (removed before the TO repo is enabled)
        set_fact:
          from_obs_project_used: "{{ obs_project }}"
          from_obs_safe_id: "{{ obs_safe_id }}"
          cacheable: true
        when: from_source == 'obs'

      # ===========================================================
      # Install PostgreSQL FROM version packages
      # ===========================================================
      - name: Install PostgreSQL FROM version packages (RHEL)
        include_tasks:
          file: install_pg_packages_rhel.yml
        vars:
          pg_major: "{{ from_major_version }}"
          pg_full_version: "{{ from_full_version }}"
          pkg_release: "{{ from_pkg_release }}"
        when: ansible_os_family == "RedHat"

      - name: Install PostgreSQL FROM version packages (Debian)
        include_tasks:
          file: install_pg_packages_deb.yml
        vars:
          pg_major: "{{ from_major_version }}"
          pg_full_version: "{{ from_full_version }}"
          pkg_release: "{{ from_pkg_release }}"
        when: ansible_os_family == "Debian"

      # ===========================================================
      # Install pg_tde for FROM version
      # ===========================================================
      - name: Install pg_tde FROM version packages
        include_tasks:
          file: install_tde_packages.yml
        vars:
          pg_major: "{{ from_major_version }}"
          tde_pkg_version: "{{ from_tde_pkg_version }}"

      # ===========================================================
      # Initialize and start PostgreSQL FROM version
      # ===========================================================
      - name: Initialize PostgreSQL FROM version data directory (RHEL)
        command: /usr/pgsql-{{ from_major_version }}/bin/postgresql-{{ from_major_version }}-setup initdb
        become: true
        when: ansible_os_family == "RedHat"

      - name: Start PostgreSQL FROM version
        service:
          name: "{{ from_pg_service }}"
          state: started
          enabled: true
        become: true

      # ===========================================================
      # Configure pg_tde: add to shared_preload_libraries + restart
      # ===========================================================
      - name: Add pg_tde to shared_preload_libraries (FROM version)
        include_tasks:
          file: configure_tde_conf.yml
        vars:
          pg_conf: "{{ from_pg_conf }}"

      - name: Restart PostgreSQL FROM version to load pg_tde
        service:
          name: "{{ from_pg_service }}"
          state: restarted
        become: true

      - name: Wait for PostgreSQL FROM version to be ready
        become: true
        become_user: postgres
        shell: pg_isready -h {{ from_pg_socket_dir }} -p 5432
        args:
          executable: /bin/bash
        environment:
          PATH: "{{ from_pg_bin_dir }}:{{ ansible_env.PATH }}"
        register: pg_ready_from
        until: pg_ready_from.rc == 0
        retries: 12
        delay: 5

      # ===========================================================
      # Seed TDE test data (pre-upgrade)
      # ===========================================================
      - name: Seed TDE encrypted test data
        include_tasks:
          file: seed_tde_data.yml
        vars:
          pg_bin_dir:    "{{ from_pg_bin_dir }}"
          pg_socket_dir: "{{ from_pg_socket_dir }}"

      - name: Verify TDE data is readable (pre-upgrade)
        include_tasks:
          file: verify_tde_data.yml
        vars:
          pg_bin_dir:    "{{ from_pg_bin_dir }}"
          pg_socket_dir: "{{ from_pg_socket_dir }}"
          check_label:   "pre-upgrade"

      - name: Capture server version (FROM, pre-upgrade)
        include_tasks:
          file: capture_server_version.yml
        vars:
          pg_major:         "{{ from_major_version }}"
          pg_bin_dir:       "{{ from_pg_bin_dir }}"
          pg_socket_dir:    "{{ from_pg_socket_dir }}"
          version_log:      "/tmp/server-from-version.log"
          version_label:    "FROM"
          expected_version: ""

      - name: Capture pg_tde version (FROM, pre-upgrade)
        include_tasks:
          file: capture_tde_version.yml
        vars:
          pg_major:             "{{ from_major_version }}"
          pg_bin_dir:           "{{ from_pg_bin_dir }}"
          pg_socket_dir:        "{{ from_pg_socket_dir }}"
          version_log:          "/tmp/tde-from-version.log"
          version_label:        "FROM"
          expected_tde_version: ""

      # ===========================================================
      # Perform the upgrade
      # ===========================================================
      - name: Perform minor version upgrade
        include_tasks:
          file: minor_upgrade.yml
        when: upgrade_type == "server_minor"

      - name: Perform major version upgrade
        include_tasks:
          file: major_upgrade.yml
        when: upgrade_type == "server_major"

      - name: Perform pg_tde-only upgrade (PostgreSQL version unchanged)
        include_tasks:
          file: tde_only_upgrade.yml
        when: upgrade_type == "tde_only"

      # ===========================================================
      # Verify TDE data post-upgrade
      # ===========================================================
      - name: Verify TDE data is readable (post-upgrade)
        include_tasks:
          file: verify_tde_data.yml
        vars:
          pg_bin_dir:    "{{ to_pg_bin_dir }}"
          pg_socket_dir: "{{ to_pg_socket_dir }}"
          check_label:   "post-upgrade"

      - name: Capture server version (TO, post-upgrade)
        include_tasks:
          file: capture_server_version.yml
        vars:
          pg_major:         "{{ to_major_version }}"
          pg_bin_dir:       "{{ to_pg_bin_dir }}"
          pg_socket_dir:    "{{ to_pg_socket_dir }}"
          version_log:      "/tmp/server-to-version.log"
          version_label:    "TO"
          expected_version: "{{ expected_to_server_version }}"

      - name: Capture pg_tde version (TO, post-upgrade)
        include_tasks:
          file: capture_tde_version.yml
        vars:
          pg_major:             "{{ to_major_version }}"
          pg_bin_dir:           "{{ to_pg_bin_dir }}"
          pg_socket_dir:        "{{ to_pg_socket_dir }}"
          version_log:          "/tmp/tde-to-version.log"
          version_label:        "TO"
          expected_tde_version: "{{ expected_to_tde_version }}"

    rescue:
      - name: Record upgrade test failure
        set_fact:
          upgrade_test_failed: true
          cacheable: true

    always:
      # ===========================================================
      # Collect artifacts — runs even when the play fails
      # ===========================================================
      - name: Collect and package upgrade test artifacts
        include_tasks:
          file: collect_artifacts.yml

  # ===========================================================
  # Fail the play after artifacts are collected
  # ===========================================================
  - name: Fail if upgrade test failed
    fail:
      msg: "Upgrade test failed — see artifacts for details"
    when: upgrade_test_failed | default(false) | bool
