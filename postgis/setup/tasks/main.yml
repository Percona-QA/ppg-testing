---
  - name: Set Facts
    set_fact:
      major_version: "{{ lookup('env', 'VERSION').split('.')[0].split('-')[1] }}"
      cacheable: true

  - name: Setting facts so that they will be persisted in the fact cache
    ansible.builtin.set_fact:
      # PostGIS RPM major per PG major, as in obs-packaging's POSTGIS_RPM_MAJOR
      # macro: PG 19+ ships PostGIS 3.7, PG 14-18 ship 3.5.
      postgis_rhel_package_name_prefix: "percona-postgis{{ '37' if (major_version | int) >= 19 else '35' }}_{{ major_version }}"

  - name: Configure repository
    include_tasks: ../../../../tasks/enable_repo.yml

  - name: install Percona Platform for PostgreSQL rpm packages
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - percona-postgresql-client-common
      - percona-postgresql-common
      - percona-postgresql{{ major_version }}
      - percona-postgresql{{ major_version }}-contrib
      - percona-postgresql{{ major_version }}-libs
      - percona-postgresql{{ major_version }}-server
      - percona-postgresql{{ major_version }}-devel

    environment:
      PERCONA_TELEMETRY_URL: "https://check-dev.percona.com/v1/telemetry/GenericReport"

  - name: install Percona Platform for PostGis rpm packages
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - "{{postgis_rhel_package_name_prefix}}"
      - "{{postgis_rhel_package_name_prefix}}-client"
      - "{{postgis_rhel_package_name_prefix}}-client-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-devel"
      - "{{postgis_rhel_package_name_prefix}}-docs"
      - "{{postgis_rhel_package_name_prefix}}-gui"
      - "{{postgis_rhel_package_name_prefix}}-gui-debuginfo"
      - "{{postgis_rhel_package_name_prefix}}-llvmjit"
      - "{{postgis_rhel_package_name_prefix}}-utils"

  # PostGIS 3.7 (PG 19+) splits address_standardizer and the tiger geocoder
  # into their own packages, which percona-postgis37_XX only Suggests.
  - name: install the split-out PostGIS extension packages (PG 19+)
    yum:
      name: "{{ packages }}"
      state: latest
      update_cache: yes
    vars:
      packages:
      - "percona-address-standardizer{{ major_version }}"
      - "percona-address-standardizer{{ major_version }}-llvmjit"
      - "percona-postgis-tiger-geocoder{{ major_version }}"
    when: (major_version | int) >= 19

  - name: Initialize Postgres RHEL
    become: true
    command: /usr/pgsql-{{ major_version }}/bin/postgresql-{{ major_version }}-setup initdb
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  - name: Start Postgres RHEL
    include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
    vars:
      svc_name: postgresql-{{ major_version }}
      svc_state: started

  - name: CREATE EXTENSION postgis/postgis_raster/postgis_sfcgal/fuzzystrmatch/address_standardizer(_data_us)/postgis_tiger_geocoder/postgis_topology
    become_user: postgres
    command: psql -c "CREATE EXTENSION {{ item }};"
    loop:
      - postgis
      - postgis_raster
      - postgis_sfcgal
      - fuzzystrmatch
      - address_standardizer
      - address_standardizer_data_us
      - postgis_tiger_geocoder
      - postgis_topology

  # postgis_raster ships with GDAL output drivers disabled by default
  # (postgis.gdal_enabled_drivers boots to "DISABLE_ALL" - a security
  # hardening default.
  - name: Enable GDAL raster output drivers (disabled by default for security)
    become_user: postgres
    command: psql -c "ALTER DATABASE postgres SET \"postgis.gdal_enabled_drivers\" = 'ENABLE_ALL';"

  # PostGIS's own upstream regression suite, run via `make installcheck`
  # against the already-installed Percona package (same principle as
  # pg_audit/pg_repack/wal2json/pgvector: build from source only to get the
  # regress harness's helper binaries, never `make install`, so installcheck
  # validates the shipped package's SQL/library files, not a from-source
  # build).

  - name: Record the shipped package's actual linked library versions (ground truth for comparison below)
    become_user: postgres
    command: psql -tAc "SELECT PostGIS_Full_Version();"
    register: shipped_postgis_full_version

  - debug:
      msg: "Shipped {{ postgis_rhel_package_name_prefix }} reports: {{ shipped_postgis_full_version.stdout }}"

  # percona-postgis35_XX requires the PGDG-style versioned GIS packages by
  # name (e.g. geos315, proj98, gdal313-libs, libgeotiff17 on EL9/EL10;
  # proj96/gdal38-libs on EL8). Derive the matching -devel packages and
  # install prefixes from the shipped package instead of hardcoding versions.
  - name: Derive the GIS stack (devel packages and prefixes) from the shipped percona-postgis package
    shell: >-
      rpm -q --requires {{ postgis_rhel_package_name_prefix }}
      | awk '{print $1}'
      | grep -E '^(geos|proj|gdal|libgeotiff)[0-9]+(-libs)?$'
      | sort -u
    register: postgis_gis_requires
    changed_when: false
    failed_when: false

  - name: Set GIS stack facts from the shipped package requirements
    set_fact:
      gis_base_names: "{{ postgis_gis_requires.stdout_lines | map('regex_replace', '-libs$', '') | list }}"

  - name: Fail clearly if the shipped package does not declare versioned geos/proj/gdal requirements
    fail:
      msg: >-
        {{ postgis_rhel_package_name_prefix }} declares no versioned geos/proj/gdal requirement
        (got: {{ postgis_gis_requires.stdout_lines }}); this role expects the PGDG-style GIS stack
        (geosNNN/projNN/gdalNNN) and cannot derive the build dependencies from an older package.
    when: >-
      (gis_base_names | select('match', '^geos') | list | length == 0) or
      (gis_base_names | select('match', '^proj') | list | length == 0) or
      (gis_base_names | select('match', '^gdal') | list | length == 0)

  - name: Set GIS devel packages and prefix facts
    set_fact:
      gis_devel_pkgs: "{{ (gis_base_names | map('regex_replace', '$', '-devel') | list) + (gis_base_names | select('match', '^gdal') | list) }}"
      gis_geos_prefix: "/usr/{{ gis_base_names | select('match', '^geos') | first }}"
      gis_proj_prefix: "/usr/{{ gis_base_names | select('match', '^proj') | first }}"
      gis_gdal_prefix: "/usr/{{ gis_base_names | select('match', '^gdal') | first }}"

  - name: Set GIS PATH and PKG_CONFIG_PATH facts
    set_fact:
      gis_path: "{{ gis_gdal_prefix }}/bin:{{ gis_geos_prefix }}/bin"
      gis_pkg_config_path: "{{ gis_gdal_prefix }}/lib/pkgconfig:{{ gis_geos_prefix }}/lib64/pkgconfig:{{ gis_proj_prefix }}/lib64/pkgconfig"

  - name: Install PostGIS build dependencies, version-matched to what percona-postgis35 actually depends on
    yum:
      name: "{{ packages + gis_devel_pkgs }}"
      state: present
      update_cache: yes
    vars:
      packages:
        - autoconf
        - automake
        - libtool
        - pkgconfig
        - make
        - gcc
        - gcc-c++
        - git
        - perl
        - bison
        - flex
        # The versioned geos/proj/gdal -devel packages (plus gdal for gdalinfo)
        # are derived from percona-postgis35_XX's real declared dependencies
        # (see gis_devel_pkgs above) - from Percona's own repo, not EPEL/base RHEL.
        - SFCGAL
        - SFCGAL-devel
        - json-c-devel
        - protobuf-c-devel
        - libxml2-devel
        - sqlite-devel
        - libcurl-devel
        - libtiff-devel
        - pcre2-devel

  # Same fix as pgaudit13_set_user/setup: install gcc-toolset-14 and source
  # its enable script before configure/build/installcheck.
  - name: Install gcc-toolset-14 for CFLAGS/LTO compatibility on RHEL 9
    dnf:
      name: gcc-toolset-14
      state: present
    when: ansible_distribution_major_version == "9"

  # PostgreSQL's JIT bitcode index is built with $(LLVM_BINPATH)/llvm-lto.
  # Try to install the exact matching llvm major first (keeps clang/llvm-lto
  # runtime llvm-libs internally consistent), and if that specific major
  # isn't available in the repos, fall back to symlinking whatever
  # llvm-lto binary IS present into the path PG's Makefile.global expects,
  # so the build still completes.
  - name: Ensure llvm toolchain matches target PostgreSQL for JIT bitcode (RHEL)
    shell: |
      set -uo pipefail
      MG="/usr/pgsql-{{ major_version }}/lib/pgxs/src/Makefile.global"
      [ -f "$MG" ] || { echo "Makefile.global not found at $MG; skipping"; exit 0; }

      LLVM_BIN=$(awk -F= '/^LLVM_BINPATH/{gsub(/ /,"",$2); print $2; exit}' "$MG")
      if [ -z "$LLVM_BIN" ]; then
        echo "with_llvm not enabled (no LLVM_BINPATH); nothing to do"; exit 0
      fi
      if [ -x "$LLVM_BIN/llvm-lto" ]; then
        echo "llvm-lto already present at $LLVM_BIN/llvm-lto"; exit 0
      fi

      VER=$(echo "$LLVM_BIN" | sed -n 's;.*/llvm\([0-9]\+\).*;\1;p')
      echo "PG built with llvm major: ${VER:-unknown} (LLVM_BINPATH=$LLVM_BIN)"

      # Preferred: install the matching major (the provider is the unversioned
      # `llvm` package at that version, e.g. llvm-20.*, not a `llvm20` package).
      if [ -n "$VER" ]; then
        dnf install -y --allowerasing "llvm-${VER}*" "llvm-devel-${VER}*" "clang-${VER}*" || true
      fi
      if [ -x "$LLVM_BIN/llvm-lto" ]; then
        echo "Installed matching llvm ${VER}"; exit 0
      fi

      # Fallback: symlink an existing llvm-lto into the expected path.
      LTO=$(command -v llvm-lto 2>/dev/null || find /usr/bin /usr/lib64 /opt/rh -name llvm-lto 2>/dev/null | head -1)
      if [ -z "$LTO" ]; then
        echo "ERROR: llvm-lto not found and llvm-${VER} unavailable" >&2
        exit 1
      fi
      echo "WARN: llvm-${VER} unavailable; symlinking $LTO -> $LLVM_BIN/llvm-lto"
      mkdir -p "$LLVM_BIN"
      ln -sf "$LTO" "$LLVM_BIN/llvm-lto"
    args:
      executable: /bin/bash
    become: true
    register: postgis_llvm_setup
    when: ansible_os_family == "RedHat"

  - debug:
      var: postgis_llvm_setup.stdout_lines
    when: ansible_os_family == "RedHat"

  - name: Record the actual build-time library versions we're about to compile against
    shell: |
      export PATH="{{ gis_path }}:$PATH"
      export PKG_CONFIG_PATH="{{ gis_pkg_config_path }}"
      echo "geos-config:     $(geos-config --version 2>&1 || echo 'not found')"
      echo "gdal-config:     $(gdal-config --version 2>&1 || echo 'not found')"
      echo "gdalinfo formats: $(gdalinfo --formats 2>&1 | grep -i tif || echo 'no tif/GTiff driver')"
      echo "proj (pkg-config): $(pkg-config --modversion proj 2>&1 || echo 'not found')"
      echo "json-c (pkg-config): $(pkg-config --modversion json-c 2>&1 || echo 'not found')"
      echo "protobuf-c (pkg-config): $(pkg-config --modversion libprotobuf-c 2>&1 || echo 'not found')"
      echo "sfcgal (pkg-config): $(pkg-config --modversion sfcgal 2>&1 || echo 'not found')"
    args:
      executable: /bin/bash
    register: build_time_lib_versions
    changed_when: false
    ignore_errors: true

  - debug:
      msg: >-
        Build-time library versions (what we're about to compile postgis against):
        {{ build_time_lib_versions.stdout_lines }}
        --- compare this against the shipped package's ground truth reported above:
        {{ shipped_postgis_full_version.stdout }}
        --- a mismatch here (e.g. shipped GEOS="3.9.x" but geos-config reports 3.12.x) means
        this from-source build will not be representative of the actual shipped binary,
        even if it compiles and installcheck passes.

  - name: Clone postgis sources matching the packaged version
    git:
      repo: "{{ repo }}"
      version: "{{ version }}"
      dest: /tmp/postgis
    vars:
      repo: "{{ lookup('env', 'COMPONENT_REPO') }}"
      version: "{{ lookup('env', 'COMPONENT_REF') | default(lookup('env', 'COMPONENT_VERSION'), true) }}"
    become_user: postgres

  # 3.5.7's own regression tests predate SFCGAL 2.3 (two stable-3.5 commits
  # fix the sfcgal expected output) and GEOS 3.15 (PGDG's geos315 backport
  # patch, also carried by the percona-postgis package). Apply them so
  # installcheck compares like with like. Delete when 3.5.8 is tagged.
  - name: Apply stable-3.5 regress fixes needed by 3.5.7 with SFCGAL 2.3 and GEOS 3.15
    shell: |
      set -euo pipefail
      for c in 8b3fcf54a572b5e84071d8fc6661003e3113b35f fb149e149967fa10bed9d823d043c3c83d3b9b81; do
        curl -fsSL "https://gitea.osgeo.org/postgis/postgis/commit/$c.patch" | git apply --include='sfcgal/regress/*'
      done
      curl -fsSL "https://raw.githubusercontent.com/pgdg-packaging/pgdg-rpms/e38918e895bcd74d083b33ccb440f3afd21a5c97/rpm/redhat/main/non-common/postgis35/main/postgis35-3.5.7-geos315-backport.patch" | git apply
    args:
      chdir: /tmp/postgis
      executable: /bin/bash
    become_user: postgres
    when: lookup('env', 'COMPONENT_REF') == '3.5.7'

  - name: Autogen postgis
    shell: ./autogen.sh
    args:
      chdir: /tmp/postgis
    become_user: postgres
    environment:
      PATH: "/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"

  # The PGDG-style geos/proj/gdal packages install to their own prefixes
  # (e.g. /usr/geos315, /usr/proj98, /usr/gdal313; derived into gis_*_prefix
  # above), not standard system paths - PATH and PKG_CONFIG_PATH need these
  # explicitly for ./configure's autodetection
  - name: Configure postgis against the already-installed GEOS/PROJ/GDAL/SFCGAL/json-c libraries
    shell: |
      {% if ansible_distribution_major_version == "9" %}
      source /opt/rh/gcc-toolset-14/enable
      {% endif %}
      set -o pipefail
      ./configure 2>&1 | tee /tmp/postgis-configure.log
    args:
      chdir: /tmp/postgis
      executable: /bin/bash
    become_user: postgres
    environment:
      PATH: "{{ gis_path }}:/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"
      PKG_CONFIG_PATH: "{{ gis_pkg_config_path }}:{{ ansible_env.PKG_CONFIG_PATH | default('') }}"
    register: postgis_configure
    ignore_errors: true

  - debug:
      var: postgis_configure.stdout_lines

  - name: Show config.log if configure failed (autotools records *why* a library wasn't detected here)
    shell: cat /tmp/postgis/config.log
    register: postgis_config_log
    when: postgis_configure is defined and postgis_configure.rc != 0
    ignore_errors: true
    become_user: postgres

  - debug:
      var: postgis_config_log.stdout_lines
    when: postgis_configure is defined and postgis_configure.rc != 0 and postgis_config_log is defined

  - name: Fail the playbook if postgis configure failed
    fail:
      msg: "postgis ./configure failed with return code {{ postgis_configure.rc }} - see config.log above"
    when: postgis_configure is defined and postgis_configure.rc != 0

  - name: Build postgis from source (compile-only - the installed package above is what installcheck validates)
    shell: |
      {% if ansible_distribution_major_version == "9" %}
      source /opt/rh/gcc-toolset-14/enable
      {% endif %}
      set -o pipefail
      make -j "$(nproc)" 2>&1 | tee /tmp/postgis-build.log
    args:
      chdir: /tmp/postgis
      executable: /bin/bash
    become_user: postgres
    environment:
      PATH: "{{ gis_path }}:/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"
    register: postgis_build
    ignore_errors: true

  - debug:
      var: postgis_build.stdout_lines

  - name: Fail the playbook if the postgis build failed
    fail:
      msg: "postgis `make` failed with return code {{ postgis_build.rc }} - see build log above"
    when: postgis_build is defined and postgis_build.rc != 0

  # PostGIS's test suite runs via `make installcheck`
  # against the already-installed Percona package (same principle as
  # pg_audit/pg_repack/wal2json/pgvector: build from source only to get the
  # regress harness's helper binaries, never `make install`, so installcheck
  # validates the shipped package's SQL/library files, not a from-source
  # build).
  - name: Run the PostGIS regression suite against the installed package
    shell: |
      {% if ansible_distribution_major_version == "9" %}
      source /opt/rh/gcc-toolset-14/enable
      {% endif %}
      set -o pipefail
      make installcheck 2>&1 | tee /tmp/postgis-installcheck.log
    args:
      chdir: /tmp/postgis
      executable: /bin/bash
    become_user: postgres
    environment:
      PATH: "{{ gis_path }}:/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"
    register: postgis_installcheck
    ignore_errors: true

  - debug:
      var: postgis_installcheck.stdout_lines

  # Kept as a safety and diagnosis net for reference in case of a failure
  - name: Find regression diff/error files if the suite failed
    shell: >
      find /tmp/postgis /tmp/pgis_reg \( -name "*.diffs" -o -name "*.err" \)
      -exec sh -c 'echo "=== {} ==="; cat "{}"' \; 2>/dev/null
    register: postgis_diffs
    when: postgis_installcheck is defined and postgis_installcheck.rc != 0
    ignore_errors: true
    become_user: postgres

  - debug:
      var: postgis_diffs.stdout_lines
    when: postgis_installcheck is defined and postgis_installcheck.rc != 0 and postgis_diffs is defined

  # Kept as a safety and diagnosis net for reference in case of a failure
  - name: Diagnose raster2pgsql's ability to read a real test raster directly (bypassing the regress harness)
    shell: |
      export PATH="{{ gis_path }}:$PATH"
      echo "=== gdalinfo --version ==="
      gdalinfo --version 2>&1 || echo "gdalinfo not found or failed"
      echo "=== gdalinfo --formats (checking for GTiff driver specifically) ==="
      gdalinfo --formats 2>&1 | grep -i tif || echo "no tif/GTiff driver listed (or gdalinfo unavailable)"
      echo "=== gdalinfo on the failing test raster ==="
      gdalinfo /tmp/postgis/raster/test/regress/loader/testraster2.tif 2>&1 || echo "gdalinfo failed to read the file, rc=$?"
      echo "=== freshly-built raster2pgsql on the same file ==="
      /tmp/postgis/raster/loader/raster2pgsql /tmp/postgis/raster/test/regress/loader/testraster2.tif diag_raster_check 2>&1 || echo "raster2pgsql failed, rc=$?"
    args:
      executable: /bin/bash
    register: postgis_raster_diag
    when: postgis_installcheck is defined and postgis_installcheck.rc != 0
    ignore_errors: true
    become_user: postgres

  - debug:
      var: postgis_raster_diag.stdout_lines
    when: postgis_installcheck is defined and postgis_installcheck.rc != 0 and postgis_raster_diag is defined

  - name: Fail the playbook if the postgis regression suite failed
    fail:
      msg: "PostGIS installcheck failed with return code {{ postgis_installcheck.rc }} - see regression diffs above"
    when: postgis_installcheck is defined and postgis_installcheck.rc != 0
