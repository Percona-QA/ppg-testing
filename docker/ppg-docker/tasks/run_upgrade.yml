---
- name: Run full 3-phase upgrade test suite via run_upgrade.sh
  shell: ./run_upgrade.sh
  args:
    executable: /bin/bash
    chdir: /tmp/docker_test
  become: true
  environment:
    OLD_VERSION: "{{ OLD_VERSION }}"
    NEW_VERSION: "{{ NEW_VERSION }}"
    DOCKER_REPOSITORY: "{{ DOCKER_REPOSITORY }}"
    OLD_REPOSITORY: "{{ OLD_REPOSITORY }}"
    NEW_REPOSITORY: "{{ NEW_REPOSITORY }}"
    UPGRADE_REPOSITORY: "{{ UPGRADE_REPOSITORY }}"
    OLD_TAG: "{{ OLD_TAG }}"
    NEW_TAG: "{{ NEW_TAG }}"
    UPGRADE_TAG: "{{ UPGRADE_TAG }}"
    # Per-image package versions from OBS QA (empty: the settings.py tables);
    # settings.py picks the list matching each version's major.
    EXPECTED_VERSIONS: "{{ lookup('env', 'EXPECTED_VERSIONS') }}"
    OLD_EXPECTED_VERSIONS: "{{ lookup('env', 'OLD_EXPECTED_VERSIONS') }}"
    WITH_POSTGIS: "{{ WITH_POSTGIS }}"
    PPG_LABEL_MAINTAINER: "{{ ppg_label_maintainer | default('Percona Development <info@percona.com>') }}"
    PPG_LABEL_VENDOR: "{{ ppg_label_vendor | default('Percona') }}"
    PPG_LABEL_NAME_POSTGRESQL: "{{ ppg_label_name_postgresql | default('Percona Distribution for PostgreSQL') }}"
  ignore_errors: true
  register: results
