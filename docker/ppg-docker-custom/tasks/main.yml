---
# DOCKER_TEST_TYPE picks what this role runs:
#   server  (default) the custom image test suite against one image
#   upgrade           run_upgrade.sh: the suite on the OLD image, pg_upgrade
#                     via the custom mediator image, then the suite on the NEW image
# Tags are used as given: Docker Hub and OBS publish multi-arch images, so
# docker pulls the host's architecture from the plain tag.
- name: Set common facts
  set_fact:
    DOCKER_TEST_TYPE: "{{ lookup('env', 'DOCKER_TEST_TYPE') | default('server', true) | lower }}"
    # Image prefix typed into the job: drop stray whitespace and trailing "/"
    # so "<prefix>/<image>:<tag>" stays a valid reference.
    DOCKER_REPOSITORY: "{{ lookup('env', 'REPOSITORY') | trim | regex_replace('/+$', '') }}"
    cacheable: true

- name: Fail on an unknown DOCKER_TEST_TYPE
  fail:
    msg: "DOCKER_TEST_TYPE={{ DOCKER_TEST_TYPE }} is not supported; use server or upgrade."
  when: DOCKER_TEST_TYPE not in ['server', 'upgrade']

- name: Fail when REPOSITORY is empty
  fail:
    msg: "REPOSITORY is empty; set an image prefix such as percona, perconalab, or an OBS registry path."
  when: DOCKER_REPOSITORY | length == 0

- include_tasks: "{{ role_path }}/../../tasks/check_docker_repository.yml"

- name: Set server test facts
  set_fact:
    PPG_VERSION: "{{ lookup('env', 'SERVER_VERSION') }}"
    TAG: "{{ lookup('env', 'DOCKER_TAG') }}"
    cacheable: true
  when: DOCKER_TEST_TYPE == 'server'

- name: Set upgrade test facts
  set_fact:
    OLD_VERSION: "{{ lookup('env', 'OLD_SERVER_VERSION') | default('17.10', true) }}"
    NEW_VERSION: "{{ lookup('env', 'NEW_SERVER_VERSION') | default('18.4', true) }}"
    OLD_TAG: "{{ lookup('env', 'OLD_VERSION_DOCKER_TAG') | default(lookup('env', 'OLD_VERSION'), true) }}"
    NEW_TAG: "{{ lookup('env', 'NEW_VERSION_DOCKER_TAG') | default(lookup('env', 'NEW_VERSION'), true) }}"
    UPGRADE_TAG: "{{ lookup('env', 'UPGRADE_DOCKER_TAG') | default('18-17-16', true) }}"
    # Old image, new image and the pg_upgrade mediator may live under different
    # prefixes (on OBS each PG major is its own project); each defaults to REPOSITORY.
    OLD_REPOSITORY: "{{ (lookup('env', 'OLD_REPOSITORY') | trim | regex_replace('/+$', '')) or DOCKER_REPOSITORY }}"
    NEW_REPOSITORY: "{{ (lookup('env', 'NEW_REPOSITORY') | trim | regex_replace('/+$', '')) or DOCKER_REPOSITORY }}"
    UPGRADE_REPOSITORY: "{{ (lookup('env', 'UPGRADE_REPOSITORY') | trim | regex_replace('/+$', '')) or DOCKER_REPOSITORY }}"
    cacheable: true
  when: DOCKER_TEST_TYPE == 'upgrade'

- name: Print server test settings
  debug:
    msg: "PPG_VERSION: {{ PPG_VERSION }}, TAG: {{ TAG }}"
  when: DOCKER_TEST_TYPE == 'server'

- name: Print upgrade test settings
  debug:
    msg: "Upgrade: PG {{ OLD_VERSION }} → PG {{ NEW_VERSION }}; OLD_TAG: {{ OLD_TAG }}, NEW_TAG: {{ NEW_TAG }}, UPGRADE_TAG: {{ UPGRADE_TAG }}"
  when: DOCKER_TEST_TYPE == 'upgrade'

- name: Yum update
  become: true
  command: yum -y update
  when: ansible_os_family == "RedHat"

- name: Ensure required dependencies are installed
  ansible.builtin.yum:
    name:
      - yum-utils
      - device-mapper-persistent-data
      - lvm2
    state: present
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

- name: Install kernel-modules-extra on RHEL 10
  dnf:
    name: "kernel-modules-extra-{{ ansible_kernel }}"
    state: present
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

- name: Ensure br_netfilter module is loaded (RHEL 10 only)
  community.general.modprobe:
    name: br_netfilter
    state: present
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

- name: Add Docker CE repository RHEL 8, 9, 10
  become: true
  command: yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  when: ansible_os_family == "RedHat"

- name: Yum update
  become: true
  # Refreshes metadata for the Docker CE repo just added above — not a
  # system update, so use makecache rather than "yum -y update".
  command: yum makecache
  when: ansible_os_family == "RedHat"

- name: Install python3-psycopg2
  become: true
  apt:
    name: python3-psycopg2
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install python3-psycopg2
  become: true
  ansible.builtin.yum:
    name: python3-psycopg2
    state: latest
  when: ansible_os_family == "RedHat"

- name: Install Docker packages
  become: true
  ansible.builtin.yum:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure containerd service is started
  include_tasks: ../../../../tasks/start_service_with_diagnostics.yml
  vars:
    svc_name: containerd
    svc_state: started
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "10"

- name: Start docker
  include_tasks: ../../../../tasks/start_service_with_diagnostics.yml
  vars:
    svc_name: docker
    svc_state: started
  when: ansible_os_family == "RedHat"

- name: Install docker.io Deb
  become: true
  apt:
    name: docker.io
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install python3-pip
  become: true
  apt:
    name: python3-pip
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: run this on OSX type systems
  debug: msg="hello from osx"
  when: ansible_distribution == 'MacOSX'

- name: Install brew
  become: true
  command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  when: ansible_os_family == "MacOSX"

- name: Install Docker
  become: true
  command: brew cask install docker
  when: ansible_os_family == "MacOSX"

- name: show docker version
  command: docker -v
  register: results
  when: ansible_os_family == "Debian" or ansible_os_family == "MacOSX"

- debug:
    var: results.stdout

- name: show docker binary location
  command: which docker
  register: results

- debug:
    var: results.stdout

- name: Install python3-venv
  become: true
  apt:
    name: python3-venv
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install bash
  become: true
  apt:
    name: bash
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Ensure test directory exists
  file:
    path: /tmp/docker_test
    state: directory
    mode: 0755

- name: Copy docker test files to remote
  copy:
    src: "{{ item.src }}"
    dest: "/tmp/docker_test/{{ item.src }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: pytest.ini,               mode: "0644" }
    - { src: settings.py,              mode: "0644" }
    - { src: test_docker.py,           mode: "0644" }
    - { src: test_patroni_ha.py,       mode: "0644" }
    - { src: test_pgbackrest.py,       mode: "0644" }
    - { src: test_labels_licences.py,  mode: "0644" }
    - { src: test_upgrade.py,          mode: "0644" }
    - { src: run_upgrade.sh,           mode: "0755" }

- name: Ensure Python virtual environment exists
  ansible.builtin.command: python3 -m venv validation
  args:
    chdir: /tmp/docker_test
    creates: /tmp/docker_test/validation

- name: Install bash on Debian
  become: true
  apt:
    name: bash
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Run the {{ DOCKER_TEST_TYPE }} tests
  include_tasks: "run_{{ DOCKER_TEST_TYPE }}.yml"

- name: Show stdout of {{ DOCKER_TEST_TYPE }} tests
  debug:
    var: results.stdout_lines

- name: Show stderr if {{ DOCKER_TEST_TYPE }} tests fail
  debug:
    var: results.stderr_lines
  when:
    - results is defined
    - results.rc != 0

- name: Dump docker container logs if {{ DOCKER_TEST_TYPE }} tests failed
  include_tasks: ../../../../tasks/dump_docker_logs.yml
  when:
    - results is defined
    - results.rc != 0

- name: Fail the playbook if {{ DOCKER_TEST_TYPE }} tests failed
  fail:
    msg: "{{ DOCKER_TEST_TYPE | capitalize }} tests failed with return code {{ results.rc }}"
  when:
    - results is defined
    - results.rc != 0
