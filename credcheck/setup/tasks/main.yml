---
  - name: Set Facts
    set_fact:
      major_version: "{{ lookup('env', 'VERSION').split('.')[0].split('-')[1] }}"
      cacheable: true

  - name: Configure repository
    include_tasks: ../../../../tasks/enable_repo.yml

  # percona-postgresql<N>-devel requires perl(IPC::Run), which is only in CRB
  - name: Install Percona Server for PostgreSQL and the credcheck package
    yum:
      name: "{{ packages }}"
      state: latest
      enablerepo: crb
      update_cache: yes
    vars:
      packages:
      - percona-postgresql-client-common
      - percona-postgresql-common
      - percona-postgresql{{ major_version }}
      - percona-postgresql{{ major_version }}-contrib
      - percona-postgresql{{ major_version }}-libs
      - percona-postgresql{{ major_version }}-server
      - percona-postgresql{{ major_version }}-devel
      - percona-postgresql{{ major_version }}-llvmjit
      - percona-credcheck{{ major_version }}
      - percona-credcheck{{ major_version }}-llvmjit

  # perl-IPC-Run and prove run the upstream TAP tests (t/)
  - name: Install build dependencies and the TAP test Perl modules
    yum:
      name: "{{ packages }}"
      state: present
      update_cache: yes
    vars:
      packages:
      - make
      - gcc
      - git
      - perl
      - perl-IPC-Run
      - perl-Test-Harness
      - krb5-devel
      - openssl-devel
      - sudo
      - acl

  # credcheck's Makefile adds -flto, same toolchain fix as postgis/setup
  - name: Install gcc-toolset-14 for CFLAGS/LTO compatibility on RHEL 9
    dnf:
      name: gcc-toolset-14
      state: present
    when: ansible_distribution_major_version == "9"

  # PostgreSQL's JIT bitcode index is built with $(LLVM_BINPATH)/llvm-lto.
  # Install the matching llvm major, or symlink an llvm-lto that is present
  # into the path PG's Makefile.global expects (same as postgis/setup).
  - name: Ensure llvm toolchain matches target PostgreSQL for JIT bitcode (RHEL)
    shell: |
      set -uo pipefail
      MG="/usr/pgsql-{{ major_version }}/lib/pgxs/src/Makefile.global"
      [ -f "$MG" ] || { echo "Makefile.global not found at $MG; skipping"; exit 0; }

      LLVM_BIN=$(awk -F= '/^LLVM_BINPATH/{gsub(/ /,"",$2); print $2; exit}' "$MG")
      if [ -z "$LLVM_BIN" ]; then
        echo "with_llvm not enabled (no LLVM_BINPATH); nothing to do"; exit 0
      fi
      if [ -x "$LLVM_BIN/llvm-lto" ]; then
        echo "llvm-lto already present at $LLVM_BIN/llvm-lto"; exit 0
      fi

      VER=$(echo "$LLVM_BIN" | sed -n 's;.*/llvm\([0-9]\+\).*;\1;p')
      echo "PG built with llvm major: ${VER:-unknown} (LLVM_BINPATH=$LLVM_BIN)"

      if [ -n "$VER" ]; then
        dnf install -y --allowerasing "llvm-${VER}*" "llvm-devel-${VER}*" "clang-${VER}*" || true
      else
        dnf install -y --allowerasing llvm llvm-devel clang || true
      fi
      if [ -x "$LLVM_BIN/llvm-lto" ]; then
        echo "llvm-lto available"; exit 0
      fi

      LTO=$(command -v llvm-lto 2>/dev/null || find /usr/bin /usr/lib64 /opt/rh -name llvm-lto 2>/dev/null | head -1)
      if [ -z "$LTO" ]; then
        echo "ERROR: llvm-lto not found and llvm-${VER} unavailable" >&2
        exit 1
      fi
      echo "WARN: symlinking $LTO -> $LLVM_BIN/llvm-lto"
      mkdir -p "$LLVM_BIN"
      ln -sf "$LTO" "$LLVM_BIN/llvm-lto"
    args:
      executable: /bin/bash
    become: true
    register: credcheck_llvm_setup

  - debug:
      var: credcheck_llvm_setup.stdout_lines

  - name: Initialize Postgres RHEL
    become: true
    command: /usr/pgsql-{{ major_version }}/bin/postgresql-{{ major_version }}-setup initdb
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  # credcheck only enforces its rules when preloaded, and its tests create
  # roles and connect as them, so local connections must be trusted
  - name: Preload credcheck
    become: true
    lineinfile:
      path: "/var/lib/pgsql/{{ major_version }}/data/postgresql.conf"
      line: "shared_preload_libraries = 'credcheck'"

  - name: Trust local connections for the regression roles
    become: true
    lineinfile:
      path: "/var/lib/pgsql/{{ major_version }}/data/pg_hba.conf"
      line: "local   all   all   trust"
      insertbefore: BOF

  - name: Start Postgres RHEL
    include_tasks: ../../../../tasks/start_postgres_with_diagnostics.yml
    vars:
      svc_name: postgresql-{{ major_version }}
      svc_state: started

  - name: Record the shipped package versions (ground truth for the run)
    become_user: postgres
    command: psql -tAc "SELECT name, default_version FROM pg_available_extensions WHERE name = 'credcheck';"
    register: shipped_credcheck

  - debug:
      msg: "Shipped percona-credcheck{{ major_version }} reports: {{ shipped_credcheck.stdout }}"

  # Fail fast if the installed package is not the version under test.
  # Expected: the percona-credcheck line of EXPECTED_VERSIONS (OBS package
  # versions, when the job passes them on), else COMPONENT_REF when it is a
  # release tag: OBS QA sends the tag the package is built from (v5.0 -> 5.0).
  # Neither (e.g. a manual run on a branch): the check is skipped.
  - name: Read the installed percona-credcheck package version
    command: rpm -q --qf '%{VERSION}' percona-credcheck{{ major_version }}
    register: credcheck_rpm_version
    changed_when: false

  - name: Work out the expected credcheck version
    set_fact:
      credcheck_expected_version: "{{ from_expected_versions or from_component_ref }}"
    vars:
      from_expected_versions: >-
        {{ lookup('env', 'EXPECTED_VERSIONS').splitlines()
           | select('match', '^percona-credcheck=')
           | map('regex_replace', '^percona-credcheck=', '')
           | first | default('') }}
      component_ref: "{{ lookup('env', 'COMPONENT_REF') }}"
      from_component_ref: >-
        {{ component_ref | regex_replace('^v', '')
           if component_ref is match('^v?[0-9]+([.][0-9]+)+$') else '' }}

  - name: Check the installed credcheck version
    assert:
      that:
        - credcheck_rpm_version.stdout == credcheck_expected_version
      fail_msg: >-
        percona-credcheck{{ major_version }} {{ credcheck_rpm_version.stdout }} is installed,
        but {{ credcheck_expected_version }} is expected
      success_msg: "percona-credcheck{{ major_version }} {{ credcheck_rpm_version.stdout }} as expected"
    when: credcheck_expected_version | length > 0

  - debug:
      msg: >-
        No expected credcheck version (no EXPECTED_VERSIONS entry, and COMPONENT_REF
        '{{ lookup('env', 'COMPONENT_REF') }}' is not a release tag): version check skipped
    when: credcheck_expected_version | length == 0

  - name: Clone credcheck sources matching the packaged version
    git:
      repo: "{{ repo }}"
      version: "{{ version }}"
      dest: /tmp/credcheck
    vars:
      repo: "{{ lookup('env', 'COMPONENT_REPO') }}"
      version: "{{ lookup('env', 'COMPONENT_REF') | default(lookup('env', 'COMPONENT_VERSION'), true) }}"
    become: true
    become_user: postgres

  # Built only to get the regress harness and TAP test inputs. No
  # `make install`: the packaged credcheck installed above is what
  # installcheck validates, not a from-source build that would overwrite it.
  - name: Build credcheck from sources (compile-only sanity check)
    shell: |
      source /opt/rh/gcc-toolset-14/enable
      set -o pipefail
      make PG_CONFIG=/usr/pgsql-{{ major_version }}/bin/pg_config 2>&1 | tee /tmp/credcheck-build.log
    args:
      chdir: /tmp/credcheck
      executable: /bin/bash
    become: true
    become_user: postgres
    environment:
      PATH: "/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"
    register: credcheck_build
    ignore_errors: true

  - debug:
      var: credcheck_build.stdout_lines

  - name: Fail the playbook if the credcheck build failed
    fail:
      msg: "credcheck `make` failed with return code {{ credcheck_build.rc }} - see build log above"
    when: credcheck_build.rc != 0

  # Upstream regression suite (test/) plus the TAP tests (t/), run against
  # the installed package.
  - name: Run the credcheck regression suite against the installed package
    shell: |
      source /opt/rh/gcc-toolset-14/enable
      set -o pipefail
      make installcheck PG_CONFIG=/usr/pgsql-{{ major_version }}/bin/pg_config 2>&1 | tee /tmp/credcheck-installcheck.log
    args:
      chdir: /tmp/credcheck
      executable: /bin/bash
    become: true
    become_user: postgres
    environment:
      PATH: "/usr/pgsql-{{ major_version }}/bin:{{ ansible_env.PATH }}"
      PG_TEST_PORT_DIR: /tmp/credcheck
    register: credcheck_installcheck
    ignore_errors: true

  - debug:
      var: credcheck_installcheck.stdout_lines

  - name: Show regression.diffs if installcheck failed
    shell: cat /tmp/credcheck/regression.diffs
    register: diffs_output
    when: credcheck_installcheck is failed
    ignore_errors: true

  - debug:
      msg: "{{ diffs_output.stdout_lines }}"
    when:
      - credcheck_installcheck is failed
      - diffs_output is defined

  - name: Set credcheck artifact filename
    set_fact:
      artifact_filename: "credcheck-{{ lookup('env','VERSION') }}-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}-build{{ lookup('env','BUILD_NUMBER') }}.tar.gz"
    when: credcheck_installcheck is failed

  - name: Package and fetch credcheck failure artifacts to controller
    shell: |
      set -uo pipefail
      ARTIFACT_BASENAME="{{ artifact_filename | default('') | replace('.tar.gz', '') }}"
      ARTIFACT_DIR="/tmp/$ARTIFACT_BASENAME"
      rm -rf "$ARTIFACT_DIR"
      mkdir -p "$ARTIFACT_DIR"
      find /tmp/credcheck -name "regression.diffs" -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
      find /tmp/credcheck -name "regression.out" -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
      find /tmp/credcheck/tmp_check -name "*.log" -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
      cp /tmp/credcheck-build.log /tmp/credcheck-installcheck.log "$ARTIFACT_DIR/" 2>/dev/null || true
      find /var/lib/pgsql/{{ major_version }}/data/log -name "*.log" -type f -exec cp --parents {} "$ARTIFACT_DIR/" \; 2>/dev/null || true
      tar -czf "/tmp/{{ artifact_filename | default('credcheck-artifacts.tar.gz') }}" -C /tmp "$ARTIFACT_BASENAME"
    args:
      executable: /bin/bash
    when: credcheck_installcheck is failed
    ignore_errors: true
    become: true

  - name: Fetch credcheck failure artifacts to controller
    fetch:
      src: "/tmp/{{ artifact_filename }}"
      dest: "{{ playbook_dir }}/../artifacts/"
      fail_on_missing: false
    when: credcheck_installcheck is failed
    become: true

  - name: Fail the playbook if installcheck failed
    fail:
      msg: "credcheck installcheck failed with return code {{ credcheck_installcheck.rc | default('unknown - see debug output above') }}"
    when: credcheck_installcheck is failed
